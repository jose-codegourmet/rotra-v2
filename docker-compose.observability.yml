# Local Grafana stack for OpenTelemetry (docs/observability.md).
# Grafana on http://localhost:3000 (admin/admin); OTLP gRPC :4317, OTLP HTTP :4318.
# Start with `make observability-up`, stop with `make observability-down`.
services:
  otel-lgtm:
    image: grafana/otel-lgtm:0.40.0
    container_name: rotra-otel-lgtm
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
