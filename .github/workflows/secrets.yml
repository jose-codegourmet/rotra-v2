# Secret scanning layer 3 (B-39): gitleaks on every PR and push. A red result also holds the Railway
# deploy through Wait for CI. Layers 1 and 2: GitHub push protection and the .husky/pre-commit hook.
# Setup: docs/backend/infrastructure.md
name: Secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks version
      - name: Scan the commits of this change
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = "pull_request" ]; then
            range="${BASE_SHA}..${{ github.event.pull_request.head.sha }}"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ]; then
            range="${BEFORE}..${AFTER}"
          else
            range="${AFTER}"
          fi
          ./gitleaks git --redact --no-banner --log-opts="$range"
