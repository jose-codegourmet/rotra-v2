# Advisory only: there is no branch protection and no required check, so PRs auto-merge whatever
# this reports. A red run on main becomes the next fix ticket (docs/ways-of-working.md §5).
name: CI

#
# Backend-only and docs-only changes skip this workflow, so Railway's "Wait for CI" on the Go API
# sees only Backend CI (backend.yml). A change that also touches frontend files still runs it.
on:
  pull_request:
    paths-ignore:
      - 'apps/api/**'
      - 'packages/rule-cases/**'
      - '.railway/**'
      - '.github/workflows/backend.yml'
      - 'docs/**'
      - '*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'apps/api/**'
      - 'packages/rule-cases/**'
      - '.railway/**'
      - '.github/workflows/backend.yml'
      - 'docs/**'
      - '*.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/verify-vercel-services.mjs
