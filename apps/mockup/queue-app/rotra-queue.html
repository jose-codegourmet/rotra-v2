</style></head><body>
<title>ROTRA Queue</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: courtside operator app. One top bar, one content column on phones; courts beside the shared queue on wide screens.
   Tokens follow apps/client globals.css (dark default, light toggleable). */
:root {
  --bg: #0b0b0c; --surface: #1a1a1d; --elev: #2a2a2e; --overlay: #3a3a3f;
  --fg: #f0f0f2; --fg2: #9090a0; --fg3: #5a5a66;
  --accent: #00ff88; --accent-dim: #00cc6a; --accent-subtle: rgba(0, 255, 136, 0.13); --on-accent: #0b0b0c;
  --error: #ff4d4d; --error-subtle: rgba(255, 77, 77, 0.12); --warn: #ffb800; --warn-subtle: rgba(255, 184, 0, 0.12);
  --border: #2a2a2e; --border-strong: #404048; --scrim: rgba(0, 0, 0, 0.6);
  --font: "Satoshi", "Manrope", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  --r: 10px; --r-sm: 6px;
  --court: #14603f; --court-line: rgba(255, 255, 255, 0.85); --court-free: #232328; --court-free-line: rgba(255, 255, 255, 0.16);
  --shadow: none; --knob: var(--fg); --field: var(--bg);
  --lv-beg: #3d9bff; --lv-int: #ffd23f; --lv-adv: #ff5a5f;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  /* Light: white cards on a soft off-white page, a deeper green that reads as text and carries white labels (AA). */
  --bg: #f4f5f2; --surface: #ffffff; --elev: #eef0ec; --overlay: #dfe3dc;
  --fg: #121513; --fg2: #535a54; --fg3: #7a817b;
  --accent: #0a7d44; --accent-dim: #086a39; --accent-subtle: rgba(10, 125, 68, 0.09); --on-accent: #ffffff;
  --error: #c62828; --error-subtle: rgba(198, 40, 40, 0.07); --warn: #a35600; --warn-subtle: rgba(217, 119, 6, 0.09);
  --border: #e2e5df; --border-strong: #cdd2c9; --scrim: rgba(18, 21, 19, 0.4);
  --court: #2e8b57; --court-line: #ffffff; --court-free: #e8ebe5; --court-free-line: rgba(18, 21, 19, 0.14);
  --shadow: 0 1px 2px rgba(18, 24, 20, 0.05), 0 2px 8px rgba(18, 24, 20, 0.04); --knob: #ffffff; --field: #ffffff;
  --lv-beg: #1d6fd1; --lv-int: #d19a00; --lv-adv: #d6293a;
  color-scheme: light;
} }
:root[data-theme="light"] {
  /* Light: white cards on a soft off-white page, a deeper green that reads as text and carries white labels (AA). */
  --bg: #f4f5f2; --surface: #ffffff; --elev: #eef0ec; --overlay: #dfe3dc;
  --fg: #121513; --fg2: #535a54; --fg3: #7a817b;
  --accent: #0a7d44; --accent-dim: #086a39; --accent-subtle: rgba(10, 125, 68, 0.09); --on-accent: #ffffff;
  --error: #c62828; --error-subtle: rgba(198, 40, 40, 0.07); --warn: #a35600; --warn-subtle: rgba(217, 119, 6, 0.09);
  --border: #e2e5df; --border-strong: #cdd2c9; --scrim: rgba(18, 21, 19, 0.4);
  --court: #2e8b57; --court-line: #ffffff; --court-free: #e8ebe5; --court-free-line: rgba(18, 21, 19, 0.14);
  --shadow: 0 1px 2px rgba(18, 24, 20, 0.05), 0 2px 8px rgba(18, 24, 20, 0.04); --knob: #ffffff; --field: #ffffff;
  --lv-beg: #1d6fd1; --lv-int: #d19a00; --lv-adv: #d6293a;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.3px; }
h1 { font-size: 26px; font-weight: 800; line-height: 1.2; }
.title-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.mono { font-family: var(--mono); font-size: 0.92em; }
.muted { color: var(--fg2); }
.small { font-size: 13px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--fg2); }
.tnum { font-variant-numeric: tabular-nums; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.top-in { display: flex; align-items: center; gap: 12px; padding: 10px var(--page-r) 10px var(--page-l); }
.brand { display: flex; align-items: baseline; gap: 8px; font-weight: 800; letter-spacing: 1.5px; font-size: 17px; }
.brand b { color: var(--accent); }
.brand span { font-weight: 600; letter-spacing: 0; color: var(--fg2); font-size: 14px; }
.top .grow { flex: 1; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
button.conn { background: transparent; cursor: pointer; min-height: 32px; }
button.conn:hover { border-color: var(--accent); background: var(--surface); }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.sync-head { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-subtle); }
.sync-head > i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 7px; flex: none; }
.sync-head.off { border-color: var(--warn); background: var(--warn-subtle); }
.sync-head.off > i { background: var(--warn); }
.sync-head.sync > i { animation: pulse 1s infinite; }
@media (prefers-reduced-motion: reduce) { .sync-head.sync > i { animation: none; } }
.sync-grp { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--bg); }
.sync-grp.wait { border-color: var(--warn); }
.sync-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.sync-list li { display: flex; justify-content: space-between; gap: 12px; min-width: 0; }
.sync-list li > span:first-child { overflow-wrap: anywhere; }
.conn.off i { background: var(--warn); }
.conn.sync i { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .conn.sync i { animation: none; } }

/* Pages fill the width beside the rail; only the side padding stays. Forms keep a readable width. */
:root { --page-x: clamp(16px, 3vw, 40px); --page-l: max(var(--page-x), env(safe-area-inset-left, 0px)); --page-r: max(var(--page-x), env(safe-area-inset-right, 0px)); }
.wrap { padding-block: 20px 120px; padding-left: var(--page-l); padding-right: var(--page-r); display: flex; flex-direction: column; gap: 20px; }
.narrow { max-width: calc(760px + var(--page-l) + var(--page-r)); margin-inline: auto; width: 100%; }
.crumb { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-weight: 600; text-align: center; }
.btn:hover:not(:disabled) { background: var(--elev); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-dim); }
.btn.danger { border-color: var(--error); color: var(--error); background: transparent; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--elev); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.xs { min-height: 32px; padding: 0 10px; font-size: 13px; border-radius: var(--r-sm); }
.btn.block { width: 100%; }
.btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-subtle); }
.btn.primary[aria-pressed] { background: var(--accent); }
.icon-btn { min-width: 36px; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.tight { gap: 6px; }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; min-width: 0; box-shadow: var(--shadow); }
.card.hl { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-subtle) inset; }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--border); }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; min-width: 0; }
.li .main { flex: 1; min-width: 0; }
.li.click { cursor: pointer; }
.card.li { padding: 14px 16px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--fg2); white-space: nowrap; }
.chip.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-subtle); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-subtle); }
.chip.bad { color: var(--error); border-color: color-mix(in srgb, var(--error) 45%, transparent); background: var(--error-subtle); }
.chip.solid { background: var(--elev); color: var(--fg); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--elev); color: var(--fg2); flex: none; }
.avatar.lg { width: 52px; height: 52px; font-size: 18px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-weight: 800; }
.avatar.photo { background: var(--elev); overflow: hidden; }
.avatar.photo svg { width: 100%; height: 100%; display: block; }
.avatar.xl { width: 64px; height: 64px; font-size: 20px; }
.avatar.xl.photo { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--border-strong); }

/* Console player grid */
.pgrid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 156px), 1fr)); gap: 12px; }
.pcard2 { display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--surface); min-width: 0; }
.pcard2.playing { border-color: var(--accent); background: linear-gradient(180deg, var(--accent-subtle), transparent 60%), var(--surface); }
.pcard2.away .avatar { opacity: .45; filter: grayscale(1); }
.pcard2 .pc-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.pcard2 .pc-sw { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--fg2); }
.pcard2 .pc-name { font-weight: 700; overflow-wrap: anywhere; line-height: 1.3; }
.pcard2 .ctx { font-size: 13px; color: var(--fg2); }
.pcard2.playing .ctx { color: var(--accent); font-weight: 600; }
.pcard2 .prog { width: 100%; }
.pcard2 .pc-games { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: auto; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--surface); font-size: 14px; }
.notice.warn { border-color: var(--warn); background: var(--warn-subtle); }
.notice.bad { border-color: var(--error); background: var(--error-subtle); }
.notice.ok { border-color: var(--accent); background: var(--accent-subtle); }
.notice svg { flex: none; margin-top: 2px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--fg2); }
.kv dd { margin: 0; min-width: 0; }
@media (max-width: 420px) {
  .live-settings .kv { grid-template-columns: minmax(0, 1fr); row-gap: 0; }
  .live-settings .kv dd { margin-bottom: 8px; }
}
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.empty { padding: 24px 12px; text-align: center; color: var(--fg2); font-size: 14px; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--fg2); }
.field .hint, .hint { font-size: 12px; color: var(--fg2); font-weight: 400; }
.err { font-size: 13px; color: var(--error); font-weight: 600; }
.input, select.input, textarea.input { width: 100%; min-height: 44px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--field); padding: 8px 12px; }
textarea.input { min-height: 80px; resize: vertical; }
.input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.input.bad { border-color: var(--error); }
.sc-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.sc-tile { display: flex; flex-direction: column; gap: 8px; padding: 8px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); color: var(--fg); font: inherit; text-align: left; cursor: pointer; min-width: 0; }
.sc-tile:hover { border-color: var(--border-strong); }
.sc-art { position: relative; display: block; }
.sc-svg { display: block; width: 100%; height: auto; border-radius: 6px; }
.sc-name { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 2px 10px; border-radius: 999px; background: rgba(0, 0, 0, 0.55); color: #fff; font-weight: 700; font-size: 13px; white-space: nowrap; max-width: 80%; overflow: hidden; text-overflow: ellipsis; }
.sc-cap { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--fg2); padding-inline: 2px; }
.sc-cap b { color: var(--fg); }
.step-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stepcard { min-width: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); }
.stepcard > span { font-size: 13px; color: var(--fg2); }
.stepcard .row { justify-content: space-between; flex-wrap: nowrap; gap: 6px; }
.stepcard .btn { min-width: 40px; padding: 0; }
.stepcard b { font-size: 24px; min-width: 28px; text-align: center; }
.disclose { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 12px 14px; border: 1px solid var(--border-strong); border-radius: var(--r); background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.disclose[aria-expanded="true"] svg { transform: rotate(180deg); }
.when-grid { display: grid; grid-template-columns: minmax(0, 4fr) minmax(84px, 1fr); gap: 14px; align-items: stretch; }
.when-main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.when-total { display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 12px; border: 1px solid var(--border); border-radius: var(--r); background: var(--surface); text-align: center; }
.when-total b { font-size: 22px; line-height: 1.15; }
.when-total .label { font-size: 11px; }
.time-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.time-pair .dt-field { max-width: none; padding-inline: 8px; gap: 4px; }
.time-pair .dt-field > svg:last-child { width: 12px; height: 12px; flex: none; }
.time-pair .dt-field > svg:first-child { display: none; }
.time-pair .dt-val { white-space: nowrap; font-size: 14px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r); padding: 3px; gap: 3px; flex-wrap: wrap; align-self: flex-start; }
.seg button { border: 0; background: transparent; min-height: 36px; padding: 0 14px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--fg2); }
.seg button[aria-pressed="true"] { background: var(--elev); color: var(--fg); }
/* Session QR share card: fixed brand colors (dark, ROTRA green) so the downloaded image never changes with the app theme. */
.qr-card { --qc-bg: #0b0b0c; --qc-fg: #f0f0f2; --qc-dim: #9090a0; --qc-accent: #00ff88; width: min(100%, 320px); display: flex; flex-direction: column; justify-content: space-between; gap: 14px; padding: 22px 20px 18px; border-radius: 20px; background: radial-gradient(120% 70% at 50% 0%, rgba(0, 255, 136, 0.16), transparent 60%), var(--qc-bg); color: var(--qc-fg); text-align: center; box-sizing: border-box; }
.qr-card.post { aspect-ratio: 4 / 5; }
.qr-card.story { aspect-ratio: 9 / 16; width: min(100%, 270px); padding-block: 28px 22px; }
.qc-top { display: flex; align-items: center; justify-content: center; gap: 10px; text-align: left; }
.qc-top b { display: block; font-size: 15px; }
.qc-top div span { font-size: 12px; color: var(--qc-dim); }
.qc-club { width: 40px; height: 40px; flex: none; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--qc-accent); color: #0b0b0c; font-weight: 800; font-size: 14px; }
.qc-club img, .qc-badge img { width: 100%; height: 100%; object-fit: cover; display: block; }
.qc-mid h3 { margin: 0 0 6px; font-size: 22px; font-weight: 800; line-height: 1.15; color: var(--qc-fg); text-wrap: balance; }
.qr-card.story .qc-mid h3 { font-size: 24px; }
.qc-mid p { margin: 0; font-size: 13px; line-height: 1.4; color: var(--qc-dim); }
.qc-qr { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.qc-qr b { font-size: 15px; color: var(--qc-accent); }
.qc-qr .mono { font-size: 10px; color: var(--qc-dim); overflow-wrap: anywhere; }
.qc-code { position: relative; width: 148px; padding: 10px; border-radius: 14px; background: #fff; box-sizing: content-box; }
.qr-card.story .qc-code { width: 170px; }
.qc-code svg { display: block; width: 100%; height: auto; }
/* Logo in the middle: about 22% of the code, on a white disc; needs high error correction in the real code. */
.qc-badge { position: absolute; top: 50%; left: 50%; width: 22%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: #fff; border: 3px solid #fff; overflow: hidden; display: grid; place-items: center; background-clip: padding-box; font-size: 11px; font-weight: 800; color: #0b0b0c; box-shadow: 0 0 0 3px #fff; }
.qc-badge:not(:has(img)) { background: var(--qc-accent); }
.qc-foot { display: flex; align-items: baseline; justify-content: center; gap: 8px; font-size: 12px; color: var(--qc-dim); }
.qc-word { font-weight: 800; letter-spacing: 0.1em; color: var(--qc-fg); }
.qc-word b { color: var(--qc-accent); }
.seg button.seg-ic { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; padding: 0 10px; }
.switch { position: relative; width: 46px; height: 28px; border-radius: 999px; background: var(--overlay); border: 0; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--knob); box-shadow: var(--shadow); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--on-accent); }
.pay-card.partial .switch[aria-checked="true"] { background: var(--warn); }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); }
.check input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.choice { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--bg); cursor: pointer; min-width: 0; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-subtle); }

/* Console */

function financeCalc(f, courtsN, durMins, players) {
  const hours = durMins / 60;
  const court = (+f.courtFee || 0) * courtsN * hours;
  const lines = (f.shuttles || []).map((x) => { const it = S.inventory.find((i) => i.id === x.itemId); return it ? { it, tubes: +x.tubes || 0, cost: (+x.tubes || 0) * it.cost } : null; }).filter(Boolean);
  const shuttle = lines.reduce((t, l) => t + l.cost, 0);
  const n = Math.max(1, players || 1);
  // The entrance fee is a misc per-head cost some venues charge, listed for transparency; it is part of the cost, not the payment.
  const entryFee = f.entryFee === '' || f.entryFee == null ? 0 : +f.entryFee || 0, entry = entryFee * n;
  const total = court + shuttle + entry;
  const share = Math.ceil(total / n);
  // Players pay the full amount per head: the break-even share by default, or a custom amount the club sets.
  const custom = !!f.custom, perHead = custom ? (+f.payFee || 0) : share, collect = perHead * n;
  return { hours, court, shuttle, entryFee, entry, total, share, custom, perHead, collect, diff: collect - total, lines, n };
}

  if (!c.custom && c.diff > 0) return `Breaks even <span class="small muted">· ${peso(c.diff)} extra from rounding up</span>`;
  if (c.diff > 0) return `<span style="color:var(--accent)">${peso(c.diff)} profit</span>`;
  if (c.diff < 0) return `<span style="color:var(--warn)">${peso(-c.diff)} loss</span>`;
  return 'Breaks even';
}

  const tubes = s ? Math.max(1, Math.round((s.courts.length * ((s.end - s.start) / 3600e3)) / 1.5)) : 3;

}

      <div class="row acts">${live ? '<button class="btn sm hdr-x" data-act="go" data-to="console">Back to live session</button>' : '<button class="btn sm hdr-x" data-act="editSetup">Edit preparation</button>'}<button class="btn sm hdr-x" data-act="copyLink">Copy invite link</button><button class="btn sm" data-act="openSessionQr">Session QR</button><button class="btn sm" data-act="openPost">Copy Facebook post</button>${live ? '' : '<button class="btn sm danger hdr-x" data-act="openDeleteSession">Delete session</button><button class="btn sm danger hdr-x" data-act="openCancelSession">Cancel session</button>'}<button class="btn sm hdr-more" data-act="openPrepMore" aria-haspopup="dialog">More options</button></div></div>
    ${live ? notice('', 'Preparation values are read-only during play. Mode, formats, minimum and playing levels are fixed after start. Use the live controls in Overview to manage courts, time, arrivals, requests and payments.') : pendingReqs(s).length ? requestsPanel(s) : ''}
    ${(() => {
      const tab = ['overview', 'roster', 'waitlist', 'payments'].includes(S.ui.prepTab) ? S.ui.prepTab : 'overview';
      const paidN = Object.keys(s.payments || {}).filter((pid) => R(s, pid)).length;
      const tabs = [['overview', 'Overview', null], ['roster', 'Roster and levels', `${s.roster.length}/${capacityOf(s)}`], ['waitlist', 'Waitlist', (s.waitlist || []).length], ['payments', 'Payments', `${paidN}/${s.roster.length} paid`]];
      return `${tabMenu('dd-prep', live ? 'Session settings section' : 'Preparation section', tabs, tab)}
      <div class="tabs has-dd" role="tablist" aria-label="${live ? 'Session settings' : 'Preparation'}">${tabs.map(([k, l, n]) => `<button role="tab" id="ptb-${k}" aria-selected="${tab === k}" aria-controls="prep-panel" data-act="prepTab" data-k="${k}">${l}${n != null ? ` <span class="chip">${n}</span>` : ''}</button>`).join('')}</div>
      <div id="prep-panel" role="tabpanel" aria-labelledby="ptb-${tab}" class="stack">${tab === 'overview' ? prepOverview(s) : tab === 'waitlist' ? waitlistPanel(s) : tab === 'payments' ? paymentsPanel(s) : rosterPanel(s, live, missing)}</div>`;
    })()}
  </main>
  ${!live ? `<div class="footer-bar ${cantStart ? 'dock-note' : 'dock-dup'}"><div class="in">
    <span class="small ${cantStart ? 'start-why' : 'muted'}">${other ? `${esc(other.title)} is already running. One session at a time. <button class="btn xs" data-act="go" data-to="console" data-id="${other.id}">Open ${esc(other.title)}</button>`
      : S.licenseExpired ? 'Your license has ended, so new sessions can’t start.'
      : !S.online && s.download !== 'ready' ? 'No downloaded copy on this device. Connect, or download first.'
      : missing ? `${missing} player${missing > 1 ? 's need' : ' needs'} a level before you can start.`
      : `${s.roster.length} players · ${present} present. Starting locks levels; no match starts by itself.`}</span>
    <button class="btn primary" data-act="openStart" ${cantStart ? 'disabled' : ''}>Start session</button>
  </div></div>` : ''}`;
}

    <div class="row">${!S.online ? '<span class="small muted">Connect to finish and sync this session.</span>' : ''}<button class="btn sm" data-act="openSessionDone" ${!S.online ? 'disabled' : ''}>Session done</button></div>

// Badminton court drawn to real proportions (13.4 m × 6.1 m), net in the middle. n courts stack so a
// two-court 5v5 reads as one merged playing area with a single long net.
function courtSVG(n) {
  const one = (y) => `<g transform="translate(0 ${y})"><rect width="134" height="61" fill="var(--court-c)"/>
    <g fill="none" stroke="var(--court-l)" stroke-width="1.5" vector-effect="non-scaling-stroke"><rect x="0.75" y="0.75" width="132.5" height="59.5" vector-effect="non-scaling-stroke"/><path d="M0 4.6H134M0 56.4H134M7.6 0V61M126.4 0V61M47.2 0V61M86.8 0V61M0 30.5H47.2M86.8 30.5H134" vector-effect="non-scaling-stroke"/></g></g>`;
  return `<svg class="court-svg" viewBox="0 0 134 ${61 * n}" preserveAspectRatio="none" aria-hidden="true">${Array.from({ length: n }, (_, i) => one(i * 61)).join('')}
    <path d="M67 0V${61 * n}" stroke="var(--court-l)" stroke-width="3" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/></svg>`;
}
function courtSides(s, m) {
  // Players stack down each side of the net (P1 over P2 | P3 over P4); bigger fun teams wrap into a second column.
  // Each face carries the player's completed games this session.
  const side = (ids, team) => `<div class="side n${Math.min(ids.length, 5)}" style="--rows:${ids.length <= 2 ? ids.length : ids.length <= 4 ? 2 : 3}" role="group" aria-label="Team ${team}">${ids.map((pid) => {
    const p = P(pid), r = R(s, pid);
    const g = gamesOf(s, pid);
    return `<button class="pf" data-act="openProfile" data-id="${pid}" title="${esc(p.name)} · ${esc(lvLabel(r ? r.level : null))} · ${g}/${s.minimum} games" aria-label="${esc(p.name)}, Team ${team}, ${g} of ${s.minimum} games. View profile"><span class="pf-face">${avatar(p)}<span class="pf-g tnum" aria-hidden="true">${g}</span></span><span class="pf-n">${esc(short(pid))}</span></button>`;
  }).join('')}</div>`;
  return `<div class="sides">${side(m.teamA, 'A')}${side(m.teamB, 'B')}</div>`;
}
// The court card's ⋯ menu. The card itself shows only the action for its state (Start anyway, or the match action).
// Phone replacement for a tab row: a full-width button showing the current tab that opens a list of the tabs (reuses the court menu's open state and outside-click close).
function tabMenu(id, label, opts, cur) {
  const open = S.ui.courtMenu === id, now = opts.find(([k]) => k === cur) || opts[0];
  const text = ([, l, n]) => `<span>${l}</span>${n != null ? `<span class="chip">${n}</span>` : ''}`;
  return `<div class="cmenu tabs-dd"><button class="tabmenu-btn" data-act="toggleCourtMenu" data-id="${id}" aria-haspopup="listbox" aria-expanded="${open}" aria-label="${label}: ${esc(now[1])}"><span class="tm-cur">${text(now)}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>${open ? `<div class="cmenu-list tabmenu-list" role="listbox" aria-label="${label}">${opts.map(([k, l, n]) => `<button role="option" aria-selected="${k === now[0]}" class="${k === now[0] ? 'on' : ''}" data-act="ddPick" data-menu="${id}" data-v="${k}"><span class="tm-cur">${text([k, l, n])}</span>${k === now[0] ? I.check : ''}</button>`).join('')}</div>` : ''}</div>`;
}
function courtMenu(s, c, busy) {
  const open = S.ui.courtMenu === c.id;
  const last = s.courts.length <= 1;
  const item = (act, label, why, cls = '') => `<button role="menuitem" class="${cls}" data-act="${act}" data-id="${c.id}" ${why ? 'disabled' : ''}><span>${label}</span>${why ? `<span class="why">${why}</span>` : ''}</button>`;
  return `<div class="cmenu"><button class="btn xs ghost icon-btn" data-act="toggleCourtMenu" data-id="${c.id}" aria-haspopup="menu" aria-expanded="${open}" aria-label="More for ${esc(c.label)}">${I.more}</button>${open ? `<div class="cmenu-list" role="menu" aria-label="${esc(c.label)}">
    ${(() => { const m = courtMatches(s).find((x) => x.status === 'oncourt' && x.courts.includes(c.id)); if (!m) return ''; const n = swapCandidate(s, m); return item('openSwap', n ? `Swap with #${waiting(s).indexOf(n) + 1} · Match ${n.seq}` : 'Swap with the queue', n ? '' : 'No other waiting match is ready'); })()}
    ${item('editCourt', 'Edit', busy ? 'A match is on this court' : '')}
    ${openedEarly(s, c) ? item('undoEarly', 'Undo early open', busy ? 'A match is on this court' : '') : ''}
    ${item('removeCourt', 'Remove', busy ? 'Only a free court can be removed' : last ? 'A session needs at least one court' : '', 'danger')}
  </div>` : ''}</div>`;
}
// A court card's booking line. Once its end has passed it reads "Booking ended" in the warning style, with or without a match on it.
function courtTimeLine(s, c) {
  const over = Date.now() > courtUntil(s, c);
  return `<span class="small ${over ? '' : 'muted'}" style="${over ? 'color:var(--warn)' : ''}">${over ? 'Booking ended' : openedEarly(s, c) ? `Opened early · planned ${fmtWhen(courtStart(s, c), { lower: true })} –` : 'Until'} ${fmtWhen(courtUntil(s, c), { lower: true })}</span>`;
}
// Short on players: the present players who aren't busy can't fill every free open court with the session's
// standard format (doubles 4 a court, singles 2; doubles first when both are on). The banner counts all present
// players against the open courts, so it says how many courts can run and how many sit out each game.
const freePresent = (s) => s.roster.filter((r) => r.present && !busyOf(s, r.pid)).length;
const perMatchOf = (s) => (s.doubles ? 4 : s.singles ? 2 : 0);
function shortOfPlayers(s) {
  const per = perMatchOf(s), open = s.courts.filter((c) => courtOpen(s, c)).length;
  const n = s.roster.filter((r) => r.present).length;
  const freeOpen = freeCourts(s).length;
  if (!per || !n || n >= open * per || !freeOpen || freePresent(s) >= freeOpen * per) return null;
  const d = s.doubles ? Math.min(open, Math.floor(n / 4)) : 0;
  const sg = s.singles ? Math.min(open - d, Math.floor((n - 4 * d) / 2)) : 0;
  const courts = [d && `${d} doubles court${d > 1 ? 's' : ''}`, sg && `${sg} singles court${sg > 1 ? 's' : ''}`].filter(Boolean).join(' and ');
  const out = n - 4 * d - 2 * sg;
  return `${n} player${n === 1 ? '' : 's'} present: ${courts ? `enough for ${courts}.${out ? ` ${out} sit${out === 1 ? 's' : ''} out each game.` : ''}` : `not enough for a ${s.doubles ? 'doubles' : 'singles'} game.`}`;
}
function courtsPane(s) {
  const list = waiting(s);
  const need = s.singles ? 2 : perMatchOf(s), freeN = freePresent(s);
  const skip = new Set();
  const cards = s.courts.map((c) => {
    if (skip.has(c.id)) return '';
    const m = courtMatches(s).find((x) => x.courts.includes(c.id));
    if (m) {
      const merged = m.courts.length > 1;
      m.courts.forEach((x) => { if (x !== c.id) skip.add(x); });
      const head = (label) => `<div class="ct"><div><h3>${esc(merged ? courtsOf(s, m) : c.label)}</h3>${courtTimeLine(s, c)}</div><div class="row" style="gap:6px;flex-wrap:nowrap">${label}${courtMenu(s, c, true)}</div></div>
        <div class="pitch ${merged ? 'tall' : ''}" role="img" aria-label="${esc(`Team A ${listNames(m.teamA)} versus Team B ${listNames(m.teamB)}`)}">${courtSVG(merged ? 2 : 1)}${courtSides(s, m)}</div>`;
      if (m.status === 'oncourt') {
        // On court: placed, getting ready. Normal border; the Queue Master starts it.
        const b = blockOf(s, m);
        return `<div class="court oncourt ${merged ? 'merged' : ''}">${head(chip(merged ? 'Merged · Getting ready' : 'Getting ready'))}
        <p class="small muted">${FORMAT_LABEL[m.format]} · Match ${m.seq} · waiting to start</p>
        ${b ? `<span class="status-line warn">${I.alert} ${esc(b.text)}</span>` : ''}
        <div class="row" style="margin-top:auto"><button class="btn sm primary" data-act="startOnCourt" data-id="${m.id}" ${b ? `disabled title="${esc(b.text)}"` : ''}>Start match</button><button class="btn sm" data-act="openMatch" data-id="${m.id}">Open match</button></div></div>`;
      }
      const mins = Math.max(0, Math.round((Date.now() - m.startedAt) / 60000));
      const subs = (m.subs || []).length;
      return `<div class="court busy ${merged ? 'merged' : ''}">${head(chip(merged ? 'Merged · Playing' : 'Playing', 'ok'))}
        <p class="small muted">${FORMAT_LABEL[m.format]} · Match ${m.seq} · ${mins} min${subs ? ` · ${subs} substitution${subs > 1 ? 's' : ''}` : ''}</p>
        <div class="row" style="margin-top:auto"><button class="btn sm primary" data-act="openMatch" data-id="${m.id}">Open match</button></div></div>`;
    }
    const notStarted = !courtOpen(s, c);
    const eligible = notStarted ? null : list.find((x) => !blockOf(s, x));
    const first = list[0];
    let body;
    if (notStarted) {
      body = `<p class="small muted">Opens ${atWhen(courtStart(s, c))}. The court is unavailable before this time.</p>
        <div class="row" style="margin-top:auto"><button class="btn sm primary" data-act="openEarly" data-id="${c.id}">Start anyway</button></div>`;
    } else if (eligible) {
      // 5v5 needs a second court, so it goes through the Put on court sheet.
      const put = courtsNeeded(eligible) === 2 ? `data-act="openDispatch" data-id="${eligible.id}" data-court="${c.id}"` : `data-act="placeOnCourt" data-id="${eligible.id}" data-court="${c.id}"`;
      body = `${first && first.id !== eligible.id ? `<p class="small muted">Skipped #1: ${esc(blockOf(s, first).text)}.</p>` : ''}
        <p class="small"><span class="muted">Next eligible:</span> #${list.indexOf(eligible) + 1} · ${FORMAT_LABEL[eligible.format]}</p>
        <p class="small">${esc(listNames(eligible.teamA))} <span class="muted">vs</span> ${esc(listNames(eligible.teamB))}</p>
        <div class="row" style="margin-top:auto"><button class="btn sm primary" ${put}>Put on court</button>${list.length > 1 ? `<button class="btn sm" data-act="openChooseMatch" data-court="${c.id}">Pick another</button>` : ''}</div>`;
    } else {
      body = `<p class="small muted">${need && freeN < need ? 'Not enough free players.' : list.length ? `No waiting match can go on: ${esc(blockOf(s, first).text)}.` : 'The queue is empty.'}</p>
        <div class="row" style="margin-top:auto"><button class="btn sm" data-act="openEditor">Add match</button></div>`;
    }
    return `<div class="court"><div class="ct"><div><h3>${esc(c.label)}</h3>${courtTimeLine(s, c)}</div><div class="row" style="gap:6px;flex-wrap:nowrap">${chip(notStarted ? 'Not open yet' : 'Free')}${courtMenu(s, c, false)}</div></div><div class="pitch empty">${courtSVG(1)}<span class="free-lbl">${notStarted ? 'Not open yet' : 'Free'}</span></div>${body}</div>`;
  }).join('');
  const closed = s.courts.filter((c) => !courtOpen(s, c));
  const fill = courtFill(s);
  return `<div class="between"><h2>Courts</h2><div class="row" style="gap:10px">${closed.length ? '<button class="btn xs" data-act="openAllEarly">Open all courts now</button>' : ''}<span class="small muted">${freeCourts(s).length} of ${s.courts.length} free</span></div></div>
    <div class="stack tight"><div class="seg" role="group" aria-label="Court filling">${[['manual', 'Manual Queue'], ['auto', 'Auto Queue']].map(([k, l]) => `<button aria-pressed="${fill === k}" data-act="setCourtFill" data-k="${k}">${l}</button>`).join('')}</div>
      <p class="small muted" aria-live="polite">${fill === 'auto' ? 'Free courts get the next ready match. You still start each one.' : 'You put each match on a court.'}</p></div>
    <div class="courts">${cards}<button class="court add-court" data-act="quickAddCourt" aria-label="Add Court ${s.courts.length + 1}"><span class="plus" aria-hidden="true">+</span><span>Add court</span><span class="small muted" style="font-weight:500">Set a planned court window</span></button></div>
    <p class="small muted">A match never starts by itself when a court frees up. You start each one.</p>`;
}

function queuePane(s) {
  const list = waiting(s);
  const att = attention(s).length;
  if (S.ui.queueWorkspace === 'auto') return autoWorkspace(s);
  return `<div class="seg" role="group" aria-label="Queue workspace"><button aria-pressed="true">Main Queue</button><button data-act="queueWorkspace" data-k="auto">Generate matches</button></div><div class="between"><h2>Queued matches</h2><div class="row acts"><button class="btn sm" data-act="openEditor">Add match</button><button class="btn sm" data-act="openSuggest">Suggest</button><button class="btn sm" data-act="queueWorkspace" data-k="auto">Generate matches</button><button class="btn sm ${att ? 'primary' : ''}" data-act="openRegen" ${list.length ? '' : 'disabled'}>Regenerate</button></div></div>
    ${att ? notice('warn', `${att} waiting match${att > 1 ? 'es need' : ' needs'} attention. Edit the lineup to swap the player, or regenerate.`) : ''}
    <p class="small muted">One waiting list for every court. ${MODES[s.mode].label} mode guides suggestions; you can override any of it.</p>
    ${list.length ? `<p class="small muted">Order runs in a snake: left to right, then back right to left on the next row. Drag a card by ⠿ to reorder (arrow keys work on the handle too). Drag a player onto someone on the other team to switch sides. Any card marked ready can go on a court now, whatever its place.</p>
    <div class="qgrid" style="grid-template-columns:repeat(${queueCols()}, minmax(0, 1fr))">${list.map((m, i) => queueCard(s, m, i, list.length, queueCols())).join('')}</div>`
      : `<div class="card empty">No waiting matches. Use Generate matches to create a few, or add one yourself.</div>`}`;
}

const AUTO_MODES = { available: 'Available Players', ahead: 'Plan Ahead', wait: 'Longest Wait', fewest: 'Fewest Games', catchup: 'Catch Up' };
function autoState(s) {
  if (!S.ui.autoDraft || S.ui.autoDraft.sid !== s.id) S.ui.autoDraft = { sid: s.id, tab: 'available', batches: {}, selected: [], count: null, target: '', next: 1 };
  return S.ui.autoDraft;
}
function queueFingerprint(s) { return JSON.stringify([s.status, s.singles, s.doubles, s.roster, s.courts, s.matches]); }
const AUTO_DESCRIPTIONS = {
  available: 'Matches from players who are here and not on a court right now.',
  ahead: 'Also uses players who are on court or mid-game. Their matches wait until their current game ends.',
  wait: 'Puts the players who have waited longest since their last game first.',
  fewest: 'Puts the players with the fewest games (played + already queued) first.',
  catchup: 'Helps players who are behind reach a number of games you choose.'
};
function autoWorkspace(s) {
  const a = autoState(s), tab = a.tab, batch = a.batches[tab] || { cards: [] };
  const stale = batch.fingerprint && batch.fingerprint !== queueFingerprint(s);
  const validTarget = Number.isSafeInteger(+a.target) && +a.target > 0;
  const generationHint = !a.count ? 'Choose how many matches first.' : tab === 'catchup' && !validTarget ? (a.target === '' ? 'Choose a game target first.' : 'Enter a whole number of games, 1 or more.') : '';
  const draftsHint = !batch.cards.length ? 'Generate matches in this tab first to replace or remove drafts, or add them to the Main Queue.' : '';
  const selectionHint = !a.selected.length ? 'Select one or more drafts first to add a selection to the Main Queue.' : '';
  const disabled = (reason, id) => reason ? `disabled title="${esc(reason)}" aria-describedby="${id}"` : '';
  const eligible = s.roster.some((r) => r.present && (tab === 'ahead' || !busyOf(s, r.pid)));

function generateDrafts(s, tab, count, target, fixed) {
  const players = s.roster.filter((r) => r.present && (tab === 'ahead' || !busyOf(s, r.pid))).map((r) => r.pid);
  const formats = [...(s.doubles ? ['doubles'] : []), ...(s.singles ? ['singles'] : [])];
  if (!formats.length) return { error: 'Enable Singles or Doubles before generating.' };
  if (tab === 'catchup' && (!Number.isInteger(+target) || +target < 1 || target === '')) return { error: 'Enter a whole number of games, 1 or more.' };
  const load = Object.fromEntries(players.map((p) => [p, gamesOf(s,p) + queuedCount(s,p)]));
  fixed.forEach((m) => all(m).forEach((p) => { if (p in load) load[p]++; }));
  const out = []; let stop = '';
  for (let i=0; i<count; i++) {
    if (tab === 'catchup' && players.every((p) => load[p] >= +target)) { stop = players.length ? `Everyone available reaches ${target} game${+target === 1 ? '' : 's'} with these matches.` : `Made 0 of ${count}: not enough free players for another match.`; break; }
    const fmt = formats.length === 2 ? (players.length >= 4 && i % 3 !== 2 ? 'doubles' : 'singles') : formats[0];
    const size = fmt === 'doubles' ? 4 : 2;
    if (players.length < size) { stop = `Made ${out.length} of ${count}: not enough ${tab === 'ahead' ? 'present' : 'free'} players for another match.`; break; }
    const sorted = players.slice().sort((x,y) => {
      const wait = restInfo(s,y).mins - restInfo(s,x).mins;
      const priority = tab === 'catchup' ? ((load[x] < +target ? 0 : 1) - (load[y] < +target ? 0 : 1)) || load[x]-load[y] : tab === 'wait' ? (load[x]-gamesOf(s,x))-(load[y]-gamesOf(s,y)) || wait : tab === 'ahead' ? Number(!!busyOf(s,x))-Number(!!busyOf(s,y)) || load[x]-load[y] : load[x]-load[y];
      return priority || wait || players.indexOf(x)-players.indexOf(y);

    out.push({ format: fmt, ...splitTeams(s,pick,fmt) }); pick.forEach((p) => load[p]++);

    if (players.length && remaining === 0) stop = `Everyone available reaches ${target} game${+target === 1 ? '' : 's'} with these matches.`;
    else if (remaining > 0) stop += ` ${remaining} more game${remaining === 1 ? ' is' : 's are'} still needed to reach ${target}.`;
  }
  return { matches: out, stop };
}

  const lv = (p) => (R(s, p).level != null ? R(s, p).level : 4);
  const sum = (ids) => ids.reduce((t, p) => t + lv(p), 0);
  if (fmt === 'doubles') {
    return [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]]
      .map(([a, b]) => ({ teamA: a.map((i) => sel[i]), teamB: b.map((i) => sel[i]) }))
      .sort((x, y) => Math.abs(sum(x.teamA) - sum(x.teamB)) - Math.abs(sum(y.teamA) - sum(y.teamB)))[0];
  }
  const sorted = sel.slice().sort((a, b) => lv(b) - lv(a));
  if (fmt === 'singles') return { teamA: [sorted[0]], teamB: [sorted[1]] };
  if (fmt === '1v2') return { teamA: [sorted[0]], teamB: [sorted[1], sorted[2]] };
  const teamA = [], teamB = [];
  sorted.forEach((p, i) => { (i % 4 === 0 || i % 4 === 3 ? teamA : teamB).push(p); });
  return { teamA, teamB };
}

// Available players: present and off court. Resting time runs from their last game ending (or from
// when they became present); "times waited" counts matches that started while they were free.
function restInfo(s, pid) {
  const r = R(s, pid);
  const ends = s.matches.filter((m) => (m.status === 'done' || m.status === 'invalid') && (all(m).includes(pid) || (m.subs || []).some((x) => x.out === pid))).map((m) => m.endedAt || 0);
  const since = Math.max(r.presentAt || s.startedAt || Date.now(), ...ends);
  const waits = s.matches.filter((m) => m.startedAt && m.startedAt > since && !all(m).includes(pid)).length;
  return { mins: Math.max(0, Math.floor((Date.now() - since) / 60000)), waits };
}

// ---------- Results (Q-RESULTS) ----------
function standings(s) {
  const done = s.matches.filter((m) => m.status === 'done');
  const rows = s.roster.map((r) => {
    let w = 0, l = 0;
    done.forEach((m) => { if (counted(m, r.pid)) { const onA = sideOf(m, r.pid) === 'A'; if ((m.winner === 'A') === onA) w++; else l++; } });
    return { pid: r.pid, name: nm(r.pid), w, l, g: w + l };
  }).filter((x) => x.g > 0);
  const h2h = (a, b) => {
    let aw = 0, bw = 0;
    done.forEach((m) => {
      const aA = sideOf(m, a.pid) === 'A', bA = sideOf(m, b.pid) === 'A';
      if (!counted(m, a.pid) || !counted(m, b.pid) || aA === bA) return;
      if ((m.winner === 'A') === aA) aw++; else bw++;
    });
    return bw - aw;
  };
  rows.sort((a, b) => b.w - a.w || a.l - b.l || h2h(a, b) || a.name.localeCompare(b.name));
  return rows;
}
function awards(s) {
  const done = s.matches.filter((m) => m.status === 'done');
  const lv = (p) => (R(s, p) && R(s, p).level != null ? R(s, p).level : 4);
  const avg = (ids) => ids.reduce((t, p) => t + lv(p), 0) / ids.length;
  const perf = s.roster.map((r) => {
    let score = 0, g = 0, w = 0;
    done.forEach((m) => {
      if (!counted(m, r.pid)) return;
      const onA = sideOf(m, r.pid) === 'A';
      const mine = avg(onA ? m.teamA : m.teamB), opp = avg(onA ? m.teamB : m.teamA);
      const expected = 1 / (1 + Math.pow(10, (opp - mine) / 2));
      const won = (m.winner === 'A') === onA;
      score += (won ? 1 : 0) - expected; g++; if (won) w++;
    });
    return { pid: r.pid, score, g, rate: g ? w / g : 0, p: P(r.pid) };
  }).filter((x) => x.g >= 2);
  const mvp = perf.slice().sort((a, b) => b.score - a.score)[0] || null;
  const hist = perf.filter((x) => x.p.prior >= 5 && x.p.base != null).map((x) => ({ ...x, delta: x.rate - x.p.base }));
  const improved = hist.filter((x) => x.delta >= 0.15).sort((a, b) => b.delta - a.delta)[0] || null;
  const offDay = hist.filter((x) => x.delta <= -0.3).sort((a, b) => a.delta - b.delta);
  return { mvp, improved, offDay };
}

  const status = note || (a ? `${a.status === 'oncourt' ? 'On court' : 'Playing'} · ${courtsOf(s, a)}` : !r.present ? 'Not present' : `Resting ${restInfo(s, pid).mins} min`);

}
function pickerSheet(s, sh) {
  const pk = sh.picking;
  const current = sh[pk.team][pk.i];
  const others = sh.teamA.concat(sh.teamB).filter((p, idx) => p && p !== current);
  const f = sh.pf || 'avail';
  const q = (sh.pq || '').trim().toLowerCase();
  let list = s.roster.filter((r) => !q || nm(r.pid).toLowerCase().includes(q) || short(r.pid).toLowerCase().includes(q));
  if (f === 'avail') list = list.filter((r) => r.present && !busyOf(s, r.pid));
  if (f === 'present') list = list.filter((r) => r.present);
  list.sort((a, b) => (busyOf(s, a.pid) ? 1 : 0) - (busyOf(s, b.pid) ? 1 : 0) || (b.present ? 1 : 0) - (a.present ? 1 : 0) || gamesOf(s, a.pid) - gamesOf(s, b.pid) || restInfo(s, b.pid).mins - restInfo(s, a.pid).mins);
  const title = `Choose Team ${pk.team === 'teamA' ? 'A' : 'B'} · player ${pk.i + 1}`;
  return sheetShell(title, `
    <label class="field"><span>Search players</span><input class="input" id="pick-q" data-bind="ui.sheet.pq" data-rerender value="${esc(sh.pq || '')}" placeholder="Name or nickname" data-autofocus></label>

    ${list.length ? `<div class="pick-grid">${list.map((r) => playerTile(s, r.pid, { attrs: `data-act="choosePick" data-id="${r.pid}"`, pressed: r.pid === current, disabled: others.includes(r.pid), note: others.includes(r.pid) ? 'Already in this match' : '' })).join('')}</div>`

}

// ---------- Matchmaking (prototype heuristics) ----------
function splitTeams(s, pick, fmt) {
  if (fmt === 'singles') return { teamA: [pick[0]], teamB: [pick[1]] };
  const lv = (p) => (R(s, p).level != null ? R(s, p).level : 4);
  const opts = [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]]
    .map(([a, b]) => { const A = a.map((i) => pick[i]), B = b.map((i) => pick[i]); return { A, B, diff: Math.abs(A.reduce((t, p) => t + lv(p), 0) - B.reduce((t, p) => t + lv(p), 0)) }; })
    .sort((x, y) => x.diff - y.diff);
  const easy = s.mode === 'chill' ? Math.random() < 0.3 : s.mode === 'fair' ? Math.random() < 0.1 : false;
  const o = easy ? opts[opts.length - 1] : opts[0];
  return { teamA: o.A, teamB: o.B };
}
function generate(s, n) {
  const present = s.roster.filter((r) => r.present).map((r) => r.pid);
  const fmts = [...(s.doubles ? ['doubles'] : []), ...(s.singles ? ['singles'] : [])];
  if (!fmts.length) return { error: 'Singles and doubles are both off for this session, so there is nothing to generate. Add a fun game manually instead.' };
  const load = {};
  present.forEach((p) => { load[p] = gamesOf(s, p) + (s.mode === 'hard' ? 0 : 0.9 * queuedCount(s, p)) + Math.random() * 0.4; });
  const out = [];
  for (let i = 0; i < n; i++) {
    const fmt = fmts.length === 2 ? (present.length >= 4 && i % 3 !== 2 ? 'doubles' : 'singles') : fmts[0];
    const size = fmt === 'doubles' ? 4 : 2;
    if (present.length < size) {
      if (!out.length) return { error: `Only ${present.length} player${present.length === 1 ? ' is' : 's are'} present. ${fmt === 'doubles' ? 'Doubles' : 'Singles'} needs ${size}. Mark arrivals present in Players.` };
      break;
    }
    const pick = present.slice().sort((a, b) => load[a] - load[b]).slice(0, size);
    out.push({ format: fmt, ...splitTeams(s, pick, fmt) });
    pick.forEach((p) => { load[p] += 1; });
  }
  return { matches: out };
}
function addMatch(s, m, origin, prot, pos) {
  s.seq += 1;
  const maxPos = Math.max(0, ...s.matches.map((x) => x.pos || 0));
  const rec = { id: `m${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`, seq: s.seq, format: m.format, teamA: m.teamA.slice(), teamB: m.teamB.slice(), status: 'waiting', origin, protected: prot, courts: [], subs: [], pos: pos ?? maxPos + 1 };
  s.matches.push(rec);
  return rec;
}

}
document.addEventListener('input', onBind);
document.addEventListener('change', onBind);
document.addEventListener('submit', (e) => {
  if (e.target.dataset.form !== 'login') return;
  e.preventDefault();
  const L = S.ui.login;
  if (!L.user.trim() || !L.pass) { L.err = 'Enter your club username and password.'; render(); return; }
  if (!S.online) { L.err = "Signing in needs an internet connection. Try again when you're connected."; render(); return; }
  L.err = ''; L.pending = true; render();
  setTimeout(() => { L.pending = false; S.club.password = L.pass; S.screen = 'home'; save(); render(); }, 700);
});
document.addEventListener('submit', (e) => {
  if (e.target.dataset.form !== 'password') return;
  e.preventDefault();
  const pw = S.ui.pw, err = {};
  if (!S.online) { toast('Changing your password needs an internet connection'); return; }
  // Prototype stand-in: the password typed at sign-in is the current one.
  if (pw.cur !== (S.club.password ?? pw.cur)) err.cur = 'That isn\'t your current password.';
  if (pw.next.length < 8) err.next = 'Use at least 8 characters.';
  else if (pw.next === pw.cur) err.next = 'Choose a password different from your current one.';
  if (!err.next && pw.confirm !== pw.next) err.confirm = "Passwords don't match.";
  pw.err = err;
  if (Object.keys(err).length) { render(); const f = document.getElementById(`pw-${Object.keys(err)[0]}`); if (f) f.focus(); return; }
  S.club.password = pw.next; S.ui.pw = { cur: '', next: '', confirm: '', show: false, err: {} };
  save(); render(); toast('Password changed. Use the new one next time you sign in.');
});

// Drag to reorder queued matches (pointer events, so mouse and touch both work).
let drag = null;
function moveTo(id, targetId) {
  const s = cur(); const w = waiting(s);
  const from = w.findIndex((m) => m.id === id), to = w.findIndex((m) => m.id === targetId);
  if (from < 0 || to < 0 || from === to) return;
  const [item] = w.splice(from, 1); w.splice(to, 0, item);
  w.forEach((m, i) => { m.pos = i + 1; });
  curAct = 'moveTo'; commit(`Match ${item.seq} moved to #${to + 1}`); render();
}
document.addEventListener('pointerdown', (e) => {
  const h = e.target.closest('[data-drag-handle]');
  if (!h) return;
  const card = h.closest('[data-qid]');
  e.preventDefault();
  drag = { id: card.dataset.qid, card, target: null, x: e.clientX, y: e.clientY };
  card.classList.add('dragging');
  try { h.setPointerCapture(e.pointerId); } catch (err) { /* capture unsupported */ }
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  drag.card.style.transform = `translate(${e.clientX - drag.x}px, ${e.clientY - drag.y}px)`;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const t = el && el.closest('[data-qid]');
  document.querySelectorAll('.qtile.drop').forEach((x) => x.classList.remove('drop'));
  drag.target = t && t.dataset.qid !== drag.id ? t.dataset.qid : null;
  if (drag.target) t.classList.add('drop');
});
function endDrag(apply) {
  if (!drag) return;
  const { id, target, card } = drag;
  drag = null;
  card.classList.remove('dragging'); card.style.transform = '';
  document.querySelectorAll('.qtile.drop').forEach((x) => x.classList.remove('drop'));
  if (apply && target) moveTo(id, target);
}
document.addEventListener('pointerup', () => endDrag(true));
document.addEventListener('pointercancel', () => endDrag(false));

// Drag a player onto someone on the other team to switch sides: queue tiles, Start match, Suggested match and Edit lineup.
// A mouse or pen drag starts after a few pixels; on touch, press and hold first so the page still scrolls.
let pdrag = null, swallowClick = false;
const swapEl = (el) => (el && el.closest ? el.closest('[data-swap]') : null);
const slotOf = (el) => ({ team: el.dataset.team, i: +el.dataset.i });
function swapObj(scope) { const sh = S.ui.sheet; return scope === 'sg' ? sh.lineup : scope === 'ed' ? sh : cur().matches.find((m) => m.id === scope.slice(2)); }
function swapSides(scope, a, b) {
  const o = swapObj(scope);
  if (!o || a.team === b.team) return;
  const x = o[a.team][a.i], y = o[b.team][b.i];
  o[a.team][a.i] = y; o[b.team][b.i] = x;
  const what = y ? `${short(x)} and ${short(y)} switched sides` : `${short(x)} moved to Team ${b.team === 'teamA' ? 'A' : 'B'}`;
  curAct = 'swapSides';
  if (scope.startsWith('m:')) { o.protected = true; commit(`Match ${o.seq}: ${what} · protected from regeneration`); }
  else { if (scope === 'sg') S.ui.sheet.edited = true; toast(what); }
  render();
}
function pdLift() {
  const d = pdrag, r = d.el.getBoundingClientRect(), g = d.el.cloneNode(true);
  g.classList.add('swap-ghost'); g.removeAttribute('id'); g.setAttribute('aria-hidden', 'true');
  Object.assign(g.style, { left: `${r.left}px`, top: `${r.top}px`, width: `${r.width}px`, height: `${r.height}px` });
  document.body.appendChild(g);
  d.g = g; d.on = true; d.el.classList.add('swap-src'); document.body.classList.add('swapping');
  if (d.touch && navigator.vibrate) navigator.vibrate(10);
}
function pdMove(x, y) {
  const d = pdrag;
  d.g.style.transform = `translate(${x - d.x}px, ${y - d.y}px)`;
  const t = swapEl(document.elementFromPoint(x, y));
  const ok = t && t.dataset.swap === d.el.dataset.swap && t.dataset.team !== d.el.dataset.team;
  if (d.over && d.over !== t) d.over.classList.remove('swap-over');
  d.over = ok ? t : null;
  if (d.over) d.over.classList.add('swap-over');
}
function pdEnd(apply) {
  const d = pdrag;

  pdrag = null; clearTimeout(d.timer);
  if (!d.on) return;
  d.g.remove(); d.el.classList.remove('swap-src'); document.body.classList.remove('swapping');
  if (d.over) d.over.classList.remove('swap-over');
  swallowClick = true; setTimeout(() => { swallowClick = false; }, 400);
  if (apply && d.over) swapSides(d.el.dataset.swap, slotOf(d.el), slotOf(d.over));
}
// The click that ends a drag must not open the profile or the slot picker.
window.addEventListener('click', (e) => { if (swallowClick) { swallowClick = false; e.preventDefault(); e.stopPropagation(); } }, true);
document.addEventListener('dragstart', (e) => { if (swapEl(e.target)) e.preventDefault(); });
document.addEventListener('contextmenu', (e) => { if (pdrag) e.preventDefault(); });
document.addEventListener('pointerdown', (e) => {
  if (e.pointerType === 'touch' || e.button !== 0) return;
  const el = swapEl(e.target);
  if (el && el.dataset.pid) pdrag = { el, x: e.clientX, y: e.clientY, on: false };
});
document.addEventListener('pointermove', (e) => {
  if (!pdrag || pdrag.touch) return;
  if (!pdrag.on) { if (Math.hypot(e.clientX - pdrag.x, e.clientY - pdrag.y) < 6) return; pdLift(); }
  pdMove(e.clientX, e.clientY);
});
document.addEventListener('pointerup', () => { if (pdrag && !pdrag.touch) pdEnd(true); });
document.addEventListener('pointercancel', () => { if (pdrag && !pdrag.touch) pdEnd(false); });
document.addEventListener('touchstart', (e) => {
  const el = swapEl(e.target);
  if (!el || !el.dataset.pid || e.touches.length > 1) return;
  const p = e.touches[0];
  pdrag = { el, x: p.clientX, y: p.clientY, on: false, touch: true };
  pdrag.timer = setTimeout(() => { if (pdrag && pdrag.el === el) pdLift(); }, 280);
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  if (!pdrag || !pdrag.touch) return;
  const p = e.touches[0];
  if (!pdrag.on) { if (Math.hypot(p.clientX - pdrag.x, p.clientY - pdrag.y) > 8) pdEnd(false); return; }
  e.preventDefault(); pdMove(p.clientX, p.clientY);
}, { passive: false });
document.addEventListener('touchend', () => { if (pdrag && pdrag.touch) pdEnd(true); });
document.addEventListener('touchcancel', () => { if (pdrag && pdrag.touch) pdEnd(false); });
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (S.screen === 'console' && S.ui.pane !== 'roster' && !drag && !pdrag && !S.ui.sheet) render(); }, 150);
});

// ---------- Prototype routes (same paths as apps/queue, under /queue) ----------
let prototypeRouter;
const queuePaths = { home: '', login: '/login', venues: '/venues', inventory: '/inventory', players: '/saved-players' };
const settingsSlugs = { identity: 'club-identity', defaults: 'session-defaults', post: 'facebook-post', license: 'license', payments: 'license', device: 'this-device', account: 'account' };
const sessionSuffixes = { prepare: '/preparation', console: '', history: '/record', finalizing: '/finishing', results: '/results' };
function prototypePath() {
  let path = queuePaths[S.screen];
  let tab;
  if (S.screen === 'club') path = `/club-settings/${settingsSlugs[S.ui.clubTab] || 'club-identity'}`;
  if (S.screen === 'setup') path = S.ui.draft?.id ? `/sessions/${encodeURIComponent(S.ui.draft.id)}/edit` : '/sessions/new';
  if (S.screen in sessionSuffixes) path = `/sessions/${encodeURIComponent(S.currentId)}${sessionSuffixes[S.screen]}`;
  if (S.screen === 'prepare') tab = S.ui.prepTab && S.ui.prepTab !== 'overview' ? S.ui.prepTab : null;
  if (S.screen === 'console') tab = ['queue', 'roster', 'board'].includes(S.ui.pane) ? S.ui.pane : null;
  if (S.screen === 'history') tab = S.ui.histTab && S.ui.histTab !== 'results' ? S.ui.histTab : null;
  if (S.screen === 'results') tab = S.ui.slide ? String(S.ui.slide) : null;
  if (S.screen === 'public') { path = S.ui.guest ? `/s/${encodeURIComponent(S.currentId)}` : `/sessions/${encodeURIComponent(S.currentId)}/public-page`; tab = S.ui.pubTab === 'participants' ? 'participants' : null; }
  return `/queue${path ?? ''}${tab ? `?tab=${encodeURIComponent(tab)}` : ''}`;
}
function applyPrototypeRoute(url) {
  flushPresence();
  flushPayments();
  const path = url.pathname.slice('/queue'.length);
  let screen = Object.entries(queuePaths).find(([, value]) => value === path)?.[0];
  let session = null;
  const setting = path.match(/^\/club-settings(?:\/([^/]+))?$/);
  const match = path.match(/^\/sessions\/([^/]+)(?:\/(preparation|edit|record|finishing|results|public-page|recovery))?$/);
  const guest = path.match(/^\/s\/([^/]+)$/);
  const tab = url.searchParams.get('tab');
  if (setting) {
    const entry = Object.entries(settingsSlugs).find(([, slug]) => slug === (setting[1] || 'club-identity'));
    if (!entry) return false;
    screen = 'club'; S.ui.clubTab = entry[0];
  }
  if (path === '/sessions/new') { screen = 'setup'; if (S.screen !== 'setup' || !S.ui.draft || S.ui.draft.id) S.ui.draft = draftFrom(null); S.ui.errors = {}; }
  else if (match || guest) {
    const id = decodeURIComponent((match || guest)[1]);
    session = S.sessions.find((s) => s.id === id);
    if (!session) return false;
    S.currentId = session.id;
    if (guest || match[2] === 'public-page') { screen = 'public'; S.ui.guest = !!guest; }
    else if (match[2] === 'edit') { screen = 'setup'; if (S.screen !== 'setup' || S.ui.draft?.id !== session.id) S.ui.draft = draftFrom(session); S.ui.errors = {}; }
    else screen = Object.entries(sessionSuffixes).find(([, suffix]) => suffix === (match[2] ? `/${match[2]}` : ''))?.[0];
    // Re-entry only selects an available view; it must never restart finalization.
    if (match?.[2] === 'recovery' || screen === 'finalizing' || (screen === 'console' && session.status !== 'active')) screen = session.status === 'active' ? 'console' : session.status === 'prepared' ? 'prepare' : 'history';
    if (screen === 'setup' && session.status !== 'prepared') screen = session.status === 'active' ? 'console' : 'history';
    if (screen === 'prepare' && !['prepared', 'active'].includes(session.status)) screen = 'history';
    if (screen === 'results' && session.status !== 'finalized') screen = session.status === 'prepared' ? 'prepare' : session.status === 'active' ? 'console' : 'history';
  }
  if (!screen) return false;
  S.screen = screen; S.ui.sheet = null; S.ui.navOpen = false; S.ui.setOpen = false;
  if (screen !== 'public') S.ui.guest = false;
  S.ui.prepTab = ['roster', 'waitlist', 'payments'].includes(tab) ? tab : 'overview';
  S.ui.pane = ['queue', 'roster', 'board'].includes(tab) ? tab : 'live';
  S.ui.histTab = HIST_TABS.some(([key]) => key === tab) ? tab : 'results';
  S.ui.slide = ['1', '2'].includes(tab) ? Number(tab) : 0;
  S.ui.pubTab = tab === 'participants' ? tab : 'details';
  return true;
}

// ---------- Render ----------
let lastSheetKey = null;
function render() {
  if (prototypeRouter?.unavailable) return;
  const a = document.activeElement;
  const focusId = a && a.id && a !== document.body ? a.id : null;
  let selStart = null;
  try { selStart = a && typeof a.selectionStart === 'number' ? a.selectionStart : null; } catch (e) { selStart = null; }
  const views = { login: viewLogin, home: viewHome, venues: viewVenues, club: viewClub, inventory: viewInventory, history: viewHistory, players: viewPlayers, setup: viewSetup, prepare: viewPrepare, console: viewConsole, finalizing: viewFinalizing, results: viewResults, public: viewPublic };
  const sh = S.ui.sheet;
  const page = (views[S.screen] || viewHome)();
  const html = topBar() + (hasShell() ? `<div class="shell ${navMin ? 'rail-min' : ''} ${S.ui.navOpen ? 'nav-open' : ''}">${navRail()}<div class="nav-scrim" data-act="toggleNav" aria-hidden="true"></div><div class="shell-main">${page}</div>${mobileDock()}</div>` : page) + (S.screen === 'setup' ? setupCourtDialog : '') + (sh ? SHEETS[sh.type](sh) : '');
  document.getElementById('app').innerHTML = html;
  setupSavedPlayerStats();
  document.body.style.overflow = sh ? 'hidden' : '';
  const key = sh ? `${sh.type}|${sh.step || ''}|${sh.pick ? 'p' : ''}|${sh.tab || ''}|${sh.picking ? 'k' : ''}` : null;
  if (sh && key !== lastSheetKey) {
    const t = document.querySelector('.sheet [data-autofocus]') || document.getElementById('sheet-title');
    if (t) t.focus();
  } else if (focusId && document.getElementById(focusId)) {
    const el = document.getElementById(focusId);
    el.focus();
    if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selStart); } catch (e) { /* not a text field */ } }
    // Number fields can't report or set the caret, and a fresh one puts it at the start, so typing "450" came out "054".
    // Re-assigning the value moves the caret to the end, where the person was typing.
    else if (el.type === 'number') { const v = el.value; el.value = ''; el.value = v; }
  } else if (!sh && lastSheetKey && lastTrigger) {
    const sel = `[data-act="${lastTrigger.act}"]` + (lastTrigger.id ? `[data-id="${lastTrigger.id}"]` : '');
    const t = document.querySelector(sel) || document.querySelector(`[data-act="${lastTrigger.act}"]`);
    if (t) t.focus();
  }
  lastSheetKey = key;
  const rp = document.getElementById('rp-range');
  if (rp) replayTo(+rp.value);
  save();
  prototypeRouter?.sync();
}
if (!S.inventory) { S.inventory = seedInventory(); save(); }
if (!S.venues) { S.venues = seedVenues(); save(); }
ensureHistory();
// Re-draw the dashboard calendar when the screen crosses a month / week / day breakpoint.
let lastCalView = calView();
window.addEventListener('resize', () => { const v = calView(); if (v !== lastCalView) { lastCalView = v; if (S.screen === 'home' && !S.ui.sheet) render(); } });
// Sessions saved before the budget was enforced on edit may hold more slots than courts × players; settle them first come, first served.
S.sessions.forEach((x) => { if (x.status === 'prepared' && x.roster.length > capacityOf(x)) rebalanceSlots(x); });
// Auto Queue also fills a court when it reaches its planned opening time (checked on the console's 30-second refresh).
let openSeen = null;
function autoFillOpened() {
  const s = liveSession(); if (!s) return;
  const open = s.courts.filter((c) => courtOpen(s, c)).map((c) => c.id);
  const fresh = openSeen && openSeen.sid === s.id ? open.filter((id) => !openSeen.ids.includes(id)) : [];
  openSeen = { sid: s.id, ids: open };
  const placed = fresh.length ? autoFill(s, { only: fresh }) : [];
  if (placed.length) { const prev = curAct; curAct = 'setCourtFill'; commit(`Court open${autoNote(s, placed)}`); curAct = prev; }
}
setInterval(() => { if (S.screen === 'console' && !S.ui.sheet && !drag && !pdrag &&!(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) { autoFillOpened(); render(); } }, 30000);
prototypeRouter = window.mountPrototypeRouter?.({ read: prototypePath, apply: applyPrototypeRoute, render, home: '/queue' });
if (!prototypeRouter) render();
})();
</script>
