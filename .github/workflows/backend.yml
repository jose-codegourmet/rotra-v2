# Backend CI (D-2026-11-13-01). Railway's "Wait for CI" watches this run before it deploys the Go
# API, and Railway's watch paths skip any commit that doesn't touch the backend. Frontend commits
# never reach Railway; backend-only commits don't run the frontend CI (ci.yml paths-ignore).
# Setup and rules: docs/backend/infrastructure.md#backend-ci-and-railway-deploys
name: Backend CI

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'packages/rule-cases/**'
      - '.railway/**'
      - '.github/workflows/backend.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/rule-cases/**'
      - '.railway/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A backend change ships alone: backend paths plus docs and conductor plans only, never app or frontend package code.
  # A failure here makes Railway skip the deploy.
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Only backend files and docs changed
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          allowed='^(apps/api/|packages/rule-cases/|\.railway/|docs/|conductor/|\.github/workflows/backend\.yml$|[^/]+\.md$)'
          backend='^(apps/api/|packages/rule-cases/|\.railway/|\.github/workflows/backend\.yml$)'
          # A PR is squash-merged, so its whole diff is one change. A push may carry several commits:
          # each commit that touches backend paths must be backend-only on its own.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changes="origin/${BASE_REF}...HEAD"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            changes="$AFTER"
          else
            changes=$(git rev-list --reverse "${BEFORE}..${AFTER}")
          fi
          failed=0
          for change in $changes; do
            case "$change" in
              *...*) files=$(git diff --name-only "$change") ;;
              *) files=$(git diff-tree --no-commit-id --name-only -r "$change") ;;
            esac
            echo "$files" | grep -Eq "$backend" || continue
            outside=$(echo "$files" | grep -Ev "$allowed" || true)
            if [ -n "$outside" ]; then
              echo "::error::$change mixes backend and frontend files. Split it; outside the backend:"
              echo "$outside"
              failed=1
            fi
          done
          [ "$failed" = 0 ] && echo "Backend changes contain only backend files and docs."
          exit "$failed"

  go:
    needs: scope
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Go API present
        id: present
        working-directory: .
        run: |
          if [ -f apps/api/go.mod ]; then echo "yes=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::apps/api/go.mod not found yet; Go checks skipped."; fi
      - uses: actions/setup-go@v5
        if: steps.present.outputs.yes == 'true'
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - name: Vet
        if: steps.present.outputs.yes == 'true'
        run: go vet ./...
      - name: Test (race, coverage)
        if: steps.present.outputs.yes == 'true'
        run: go test ./... -race -cover
      - name: Build
        if: steps.present.outputs.yes == 'true'
        run: go build ./...
      - name: Lint
        if: steps.present.outputs.yes == 'true'
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: apps/api
      - name: Vulnerabilities
        if: steps.present.outputs.yes == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
