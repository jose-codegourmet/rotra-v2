<title>ROTRA Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: internal workspace for the platform owner. A left rail with the five places Admin goes (clubs, players,
   requests, settings); lists are tables that turn into stacked rows on phones; details put the working column beside
   account facts on wide screens. Tokens and base components are copied from the Queue and Player prototypes
   (apps/client globals.css: dark default, light toggleable). */
:root {
  --bg: #0b0b0c; --surface: #1a1a1d; --elev: #2a2a2e; --overlay: #3a3a3f;
  --fg: #f0f0f2; --fg2: #9090a0; --fg3: #5a5a66;
  --accent: #00ff88; --accent-dim: #00cc6a; --accent-subtle: rgba(0, 255, 136, 0.13); --on-accent: #0b0b0c;
  --error: #ff4d4d; --error-subtle: rgba(255, 77, 77, 0.12); --warn: #ffb800; --warn-subtle: rgba(255, 184, 0, 0.12);
  --border: #2a2a2e; --border-strong: #404048; --scrim: rgba(0, 0, 0, 0.6);
  --font: "Satoshi", "Manrope", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  --r: 10px; --r-sm: 6px;
  --shadow: none; --knob: var(--fg); --field: var(--bg);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  /* Light: white cards on a soft off-white page, a deeper green that reads as text and carries white labels (AA). */
  --bg: #f4f5f2; --surface: #ffffff; --elev: #eef0ec; --overlay: #dfe3dc;
  --fg: #121513; --fg2: #535a54; --fg3: #7a817b;
  --accent: #0a7d44; --accent-dim: #086a39; --accent-subtle: rgba(10, 125, 68, 0.09); --on-accent: #ffffff;
  --error: #c62828; --error-subtle: rgba(198, 40, 40, 0.07); --warn: #a35600; --warn-subtle: rgba(217, 119, 6, 0.09);
  --border: #e2e5df; --border-strong: #cdd2c9; --scrim: rgba(18, 21, 19, 0.4);
  --shadow: 0 1px 2px rgba(18, 24, 20, 0.05), 0 2px 8px rgba(18, 24, 20, 0.04); --knob: #ffffff; --field: #ffffff;
  color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #f4f5f2; --surface: #ffffff; --elev: #eef0ec; --overlay: #dfe3dc;
  --fg: #121513; --fg2: #535a54; --fg3: #7a817b;
  --accent: #0a7d44; --accent-dim: #086a39; --accent-subtle: rgba(10, 125, 68, 0.09); --on-accent: #ffffff;
  --error: #c62828; --error-subtle: rgba(198, 40, 40, 0.07); --warn: #a35600; --warn-subtle: rgba(217, 119, 6, 0.09);
  --border: #e2e5df; --border-strong: #cdd2c9; --scrim: rgba(18, 21, 19, 0.4);
  --shadow: 0 1px 2px rgba(18, 24, 20, 0.05), 0 2px 8px rgba(18, 24, 20, 0.04); --knob: #ffffff; --field: #ffffff;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.3px; }
h1 { font-size: 26px; font-weight: 800; line-height: 1.2; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.mono { font-family: var(--mono); font-size: 0.92em; }
.muted { color: var(--fg2); }
.small { font-size: 13px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--fg2); }
.tnum { font-variant-numeric: tabular-nums; }
.wrapw { overflow-wrap: anywhere; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.top-in { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
button.brand { display: flex; align-items: baseline; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font-weight: 800; letter-spacing: 1.5px; font-size: 17px; }
.brand b { color: var(--accent); }
.brand .sub { font-weight: 600; letter-spacing: 0; color: var(--fg2); font-size: 14px; }
.top .grow { flex: 1; }
.acct { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg2); min-width: 0; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; }
.acct span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 30vw; }
@media (max-width: 560px) { .acct span { display: none; } .acct { padding: 6px; } }
.btn.burger { display: none; }
.band-off { background: var(--warn-subtle); border-bottom: 1px solid var(--warn); font-size: 13px; }
.band-off .in { display: flex; gap: 10px; align-items: flex-start; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.band-off svg { color: var(--warn); flex: none; margin-top: 2px; }
@keyframes pulse { 50% { opacity: .3; } }

/* Shell: rail + main column */
.shell { --rail: 236px; --topbar: 57px; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); align-items: start; }
.shell-main { min-width: 0; }
.rail { position: sticky; top: calc(var(--topbar) + env(safe-area-inset-top, 0px)); height: calc(100dvh - var(--topbar) - env(safe-area-inset-top, 0px)); overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding: 12px 10px; border-right: 1px solid var(--border); background: var(--surface); }
.rail-label { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--fg3); padding: 14px 12px 4px; }
.rail-link { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 42px; padding: 9px 12px; border: 0; border-radius: var(--r-sm); background: none; color: var(--fg2); font-weight: 600; text-align: left; white-space: nowrap; cursor: pointer; }
.rail-link svg { flex: none; }
.rail-link:hover { background: var(--elev); color: var(--fg); }
.rail-link.on { background: var(--accent-subtle); color: var(--accent); }
.rail-link .count { margin-left: auto; font-size: 12px; color: var(--fg3); font-variant-numeric: tabular-nums; }
.rail-link .count.hot { color: var(--on-accent); background: var(--warn); border-radius: 999px; padding: 0 7px; font-weight: 700; }
.rail-end { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }
.rail-who { padding: 6px 12px 8px; font-size: 12px; color: var(--fg2); overflow-wrap: anywhere; }
.nav-scrim { display: none; }
@media (max-width: 900px) {
  .btn.burger { display: inline-flex; margin-left: -6px; }
  .shell { --rail: 0px; grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; z-index: 46; top: 0; bottom: 0; left: 0; width: min(280px, 84vw); height: auto; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-left: max(10px, env(safe-area-inset-left, 0px)); transform: translateX(-102%); transition: transform .2s ease; box-shadow: 0 0 40px rgba(0, 0, 0, .25); }
  .nav-open .rail { transform: none; }
  .nav-open .nav-scrim { display: block; position: fixed; inset: 0; z-index: 45; background: var(--scrim); }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } }

.wrap { max-width: 1180px; margin: 0 auto; padding-block: 24px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; flex-direction: column; gap: 6px; }
.page-head p { max-width: 68ch; }
.back { align-self: flex-start; margin-left: -10px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-weight: 600; text-align: center; }
.btn:hover:not(:disabled) { background: var(--elev); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-dim); }
.btn.danger { border-color: var(--error); color: var(--error); background: transparent; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--elev); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.xs { min-height: 32px; padding: 0 10px; font-size: 13px; border-radius: var(--r-sm); }
.icon-btn { min-width: 36px; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.tight { gap: 6px; }
.link { background: none; border: 0; padding: 0; color: var(--fg); font-weight: 700; cursor: pointer; text-align: left; overflow-wrap: anywhere; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.link.acc { color: var(--accent); font-weight: 600; }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; min-width: 0; box-shadow: var(--shadow); }
.card.warnc { border-color: color-mix(in srgb, var(--warn) 60%, transparent); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--fg2); white-space: nowrap; }
.chip.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-subtle); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-subtle); }
.chip.bad { color: var(--error); border-color: color-mix(in srgb, var(--error) 45%, transparent); background: var(--error-subtle); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--elev); color: var(--fg2); flex: none; }
.avatar.lg { width: 56px; height: 56px; font-size: 18px; border-radius: 16px; background: var(--accent); color: var(--on-accent); font-weight: 800; }
.logo { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 12px; letter-spacing: .5px; background: var(--elev); color: var(--fg); flex: none; border: 1px solid var(--border-strong); }
.logo.lg { width: 56px; height: 56px; font-size: 17px; border-radius: 14px; }
.logo.acc { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.who .main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--surface); font-size: 14px; }
.notice.warn { border-color: var(--warn); background: var(--warn-subtle); }
.notice.bad { border-color: var(--error); background: var(--error-subtle); }
.notice.ok { border-color: var(--accent); background: var(--accent-subtle); }
.notice svg { flex: none; margin-top: 2px; }
.notice > div { min-width: 0; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--fg2); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 420px) { .kv { grid-template-columns: minmax(0, 1fr); gap: 0; } .kv dd { margin-bottom: 8px; } }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; align-items: start; }
.empty { padding: 28px 12px; text-align: center; color: var(--fg2); font-size: 14px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty b { color: var(--fg); font-size: 15px; }
.bul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.detail { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.detail > div { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
@media (min-width: 1040px) { .detail { grid-template-columns: minmax(0, 1fr) 340px; } }
.hero { display: flex; gap: 14px; align-items: center; min-width: 0; }
.hero .main { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.hero h1 { overflow-wrap: anywhere; }
.sec-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.sec-head > div { min-width: 0; display: flex; flex-direction: column; gap: 2px; }

/* Tables: rows become stacked label/value blocks on phones */
.tbl-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--fg2); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border-strong); white-space: nowrap; }
.tbl td { padding: 11px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--elev); }
.tbl .n { text-align: right; }
.tbl .nw { white-space: nowrap; }
@media (max-width: 760px) {
  .tbl-wrap { margin: 0; padding: 0; overflow: visible; }
  .tbl.cards thead { display: none; }
  .tbl.cards, .tbl.cards tbody, .tbl.cards tr, .tbl.cards td { display: block; width: 100%; }
  .tbl.cards tr { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .tbl.cards tbody tr:last-child { border-bottom: 0; }
  .tbl.cards td { border: 0; padding: 3px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: right; }
  .tbl.cards td::before { content: attr(data-label); color: var(--fg2); font-size: 13px; text-align: left; flex: none; }
  .tbl.cards td.lead { text-align: left; padding-bottom: 6px; }
  .tbl.cards td.lead::before { display: none; }
  .tbl.cards td:empty { display: none; }
  .tbl .n { text-align: right; }
}
.live { display: inline-flex; align-items: center; gap: 6px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s infinite; flex: none; }
@media (prefers-reduced-motion: reduce) { .live i { animation: none; } }
.more { display: flex; justify-content: center; padding-top: 12px; }

/* Forms */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.toolbar .search { flex: 1 1 260px; min-width: 0; position: relative; }
.toolbar .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--fg2); pointer-events: none; }
.toolbar .search .input { padding-left: 36px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--fg2); }
.hint { font-size: 12px; color: var(--fg2); font-weight: 400; }
.err { font-size: 13px; color: var(--error); font-weight: 600; }
.input { width: 100%; min-height: 44px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--field); padding: 8px 12px; }
.input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.input.bad { border-color: var(--error); }
.affix { display: flex; align-items: stretch; }
.affix .input { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.affix .input.suf { border-radius: var(--r-sm) 0 0 var(--r-sm); }
.affix > b { display: grid; place-items: center; padding: 0 12px; border: 1px solid var(--border-strong); background: var(--elev); color: var(--fg2); font-weight: 600; }
.affix > b:first-child { border-right: 0; border-radius: var(--r-sm) 0 0 var(--r-sm); }
.affix > b:last-child { border-left: 0; border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; }
.pass { position: relative; }
.pass .input { padding-right: 76px; }
.pass button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r); padding: 3px; gap: 3px; flex-wrap: wrap; align-self: flex-start; }
.seg button { border: 0; background: transparent; min-height: 36px; padding: 0 12px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--fg2); display: inline-flex; align-items: center; gap: 6px; }
.seg button[aria-pressed="true"] { background: var(--elev); color: var(--fg); }
.seg button .c { font-size: 12px; color: var(--fg3); font-variant-numeric: tabular-nums; }
.switch { position: relative; width: 46px; height: 28px; border-radius: 999px; background: var(--overlay); border: 0; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--knob); box-shadow: var(--shadow); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--on-accent); }
.switch:disabled { opacity: .45; cursor: not-allowed; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 10px; }
.choice { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--bg); cursor: pointer; min-width: 0; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-subtle); }
.setting { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.setting .main { min-width: 0; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 700; color: var(--fg2); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tabs button:hover { color: var(--fg); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabs button .c { font-size: 12px; color: var(--fg3); font-variant-numeric: tabular-nums; }

/* Admin specifics */
.change { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: center; }
.change > div { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); padding: 10px 12px; min-width: 0; overflow-wrap: anywhere; }
.change > div.to { border-color: var(--accent); background: var(--accent-subtle); }
.change > svg { color: var(--fg2); }
@media (max-width: 520px) { .change { grid-template-columns: minmax(0, 1fr); } .change > svg { transform: rotate(90deg); justify-self: center; } }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.checks li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.checks li svg { flex: none; margin-top: 3px; }
.checks li.ok svg { color: var(--accent); }
.checks li.bad svg { color: var(--error); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.log li { display: flex; flex-direction: column; gap: 1px; padding: 9px 0; border-top: 1px solid var(--border); font-size: 13px; }
.log li:first-child { border-top: 0; padding-top: 0; }
.log li span { color: var(--fg2); font-size: 12px; }
.prog { height: 8px; background: var(--elev); border-radius: 999px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--warn); border-radius: 999px; }
.timeline { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--fg2); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
.tile { border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile b { font-size: 17px; overflow-wrap: anywhere; }
.tile .mono { font-size: 20px; font-weight: 600; }
.total { font-family: var(--mono); font-weight: 600; }
.total.bad { color: var(--error); }
.split { display: flex; height: 12px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--elev); }
.split .a { background: var(--accent); }
.split .b { background: color-mix(in srgb, var(--accent) 35%, var(--elev)); }
.steps { display: flex; gap: 8px; align-items: center; font-size: 12px; font-weight: 700; color: var(--fg3); letter-spacing: .3px; text-transform: uppercase; }
.steps .on { color: var(--accent); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; display: inline-block; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }

// ---------- License and retention ----------
function access(c) {
  const t = todayYmd(), T = c.terms;
  if (!T.length) return { state: 'none' };
  const cur = T.find((x) => x.from <= t && t <= x.to);
  if (cur) {
    // Follow back-to-back terms so a renewal that starts the day after shows as one continuous period.
    let until = cur.to, moved = true;
    while (moved) { moved = false; T.forEach((x) => { if (x.from <= addDays(until, 1) && x.to > until) { until = x.to; moved = true; } }); }
    return { state: 'active', until, days: diffDays(t, until), plan: cur.plan };
  }
  const past = T.filter((x) => x.to < t);
  const next = T.filter((x) => x.from > t).sort((a, b) => (a.from < b.from ? -1 : 1))[0];
  if (!past.length) return { state: 'scheduled', starts: next.from, plan: next.plan };
  const last = past.reduce((m, x) => (x.to > m.to ? x : m));
  return { state: 'expired', since: addDays(last.to, 1), ended: last.to, next: next ? next.from : null, plan: last.plan };
}
const filterKey = (a) => (a.state === 'scheduled' ? 'none' : a.state);
function accessChip(a) {
  if (a.state === 'active') return a.days <= 7 ? chip(a.days === 0 ? 'Ends today' : `Ends in ${a.days} day${a.days === 1 ? '' : 's'}`, 'warn') : chip('Active', 'ok');
  if (a.state === 'expired') return chip('Expired', 'bad');
  if (a.state === 'scheduled') return chip(`Starts ${fmtYmd(a.starts)}`, 'warn');
  return chip('No license yet');
}
function retention(c) {
  const a = access(c), t = todayYmd(), r = c.ret;
  if (r.deletedOn) return { k: 'deleted', on: r.deletedOn };
  if (a.state !== 'expired') {
    const last = r.cycles.filter((x) => x.cancelled).slice(-1)[0];
    return last ? { k: 'restored', cycle: last } : { k: 'none' };
  }
  const deleteOn = addMonths(a.since, RETENTION_MONTHS);
  const total = diffDays(a.since, deleteOn), elapsed = Math.min(total, Math.max(0, diffDays(a.since, t)));
  if (r.failedOn) return { k: 'failed', deleteOn, failedOn: r.failedOn, since: a.since };
  if (t >= deleteOn) return { k: 'due', deleteOn, since: a.since };
  return { k: 'stale', deleteOn, since: a.since, left: diffDays(t, deleteOn), elapsed, total };
}

// ---------- Ranks (read-only context; uses the configuration in effect, never a draft) ----------
function rankOf(p) {
  if (p.level == null) return { k: 'none', text: 'No rank yet', chip: chip('No rank yet') };
  const T = eff().threshold;
  if (p.recent < T) return { k: 'below', text: `${LEVELS[p.level]} · ${p.recent} of ${T} recent matches`, chip: chip('Below requirement') };
  return { k: 'board', text: `${LEVELS[p.level]} · on the overall leaderboard`, chip: chip('On leaderboard', 'ok') };
}

const REQ = {
  submitted: { chip: 'Waiting for review', k: 'warn' },
  applying: { chip: 'Approved · applying', k: 'warn' },

};

function checks(r) {
  const p = playerOf(r.pid), f = FIELD[r.field];
  const other = S.players.find((x) => x.id !== p.id && norm(x[r.field]) === norm(r.to));
  const newer = S.requests.find((x) => x.id !== r.id && x.pid === r.pid && x.field === r.field && x.at > r.at && ['submitted', 'applying'].includes(x.status));
  const busy = S.requests.find((x) => x.id !== r.id && x.pid === r.pid && x.status === 'applying');
  const cur = p[r.field] || '';
  return [
    other ? { ok: false, html: `This ${f} is already linked to <button class="link acc" data-act="openPlayer" data-id="${other.id}">${esc(other.name)}</button> (<span class="mono">${esc(other.rtr)}</span>). Approving would put two players on one ${f}, and Admin never merges players.` } : { ok: true, html: `Not linked to any other player` },
    newer ? { ok: false, html: `A newer request for this ${f} was sent ${ago(newer.at)}. <button class="link acc" data-act="openReview" data-id="${newer.id}">Review that one instead</button>.` } : { ok: true, html: `No newer request for this ${f}` },
    norm(cur) === norm(r.from) ? { ok: true, html: `Their current ${f} still matches the request` } : { ok: false, html: `Their ${f} has changed since this was sent. It's now <span class="mono">${esc(cur || 'not set')}</span>.` },
    busy ? { ok: false, html: 'Another contact change for this player is still being applied.' } : { ok: true, html: 'No other change is being applied for this player' },
  ];
}
const blocked = (r) => r.status === 'submitted' && checks(r).some((c) => !c.ok);
function nextAction(r) {
  if (r.status === 'submitted') return blocked(r) ? 'Review · blocked' : 'Review';

}

      : S.clubs.length ? `<div class="empty"><b>No clubs match.</b><span>Check the spelling, or search by the club's username.</span>${q || F !== 'all' ? '<button class="btn sm" data-act="clearClubs">Clear search and filter</button>' : ''}</div>`
      : '<div class="empty"><b>No clubs yet.</b><span>Add a club to give it a Queue app sign-in.</span><button class="btn sm primary" data-act="openAddClub">Add club</button></div>'}</section>`);
}

// ---------- A-CLUB-DETAIL + A-RETENTION ----------
function retentionCard(c) {
  const r = retention(c);
  const head = {
    none: chip('Pages live', 'ok'), restored: chip('Pages live', 'ok'), stale: chip('Pages stale', 'warn'), due: chip('Deletion due', 'warn'), failed: chip('Deletion failed', 'bad'), deleted: chip('Pages deleted'),
  }[r.k];
  let body = '';
  if (r.k === 'none') body = `<p>No deletion countdown. If the license ends, the club's public session pages go stale and are deleted after six months of continuous expiry.</p>`;
  if (r.k === 'restored') body = `<p>No deletion countdown. The license ended on ${fmtYmd(addDays(r.cycle.expired, -1))}; the renewal on ${fmtYmd(r.cycle.cancelled)} restored the public pages and cancelled that countdown. If the license ends again, a new six-month countdown starts.</p>`;
  if (r.k === 'stale') body = `<div class="stack tight"><div class="prog" role="img" aria-label="${r.elapsed} of ${r.total} days of the countdown have passed"><i style="width:${Math.round((r.elapsed / r.total) * 100)}%"></i></div>
      <div class="timeline"><span>Expired ${fmtYmd(r.since)}</span><span>Deleted ${fmtYmd(r.deleteOn)}</span></div></div>
    <dl class="kv"><dt>Expired for</dt><dd>${plural(r.elapsed, 'day')}</dd><dt>Pages deleted on</dt><dd>${fmtYmd(r.deleteOn)} · in ${plural(r.left, 'day')}</dd></dl>
    <p>The public session pages are stale. Renewing before ${fmtYmd(r.deleteOn)} restores them and cancels the deletion.</p>`;
  if (r.k === 'due') body = `<p>Six months of continuous expiry ended on ${fmtYmd(r.deleteOn)}. Deleting the public pages is in progress; this changes to Pages deleted once it has actually finished.</p>`;
  if (r.k === 'failed') body = `<dl class="kv"><dt>Expired since</dt><dd>${fmtYmd(r.since)}</dd><dt>Deletion was due</dt><dd>${fmtYmd(r.deleteOn)}</dd><dt>Last attempt</dt><dd>Failed on ${fmtYmd(r.failedOn)} · will be retried</dd></dl>
    <p>The pages are still online as stale pages; they haven't been deleted. Renewing now restores them and cancels the retry.</p>`;
  if (r.k === 'deleted') body = `<p>The public session pages were deleted on ${fmtYmd(r.on)} after six months of continuous expiry. Renewing gives the club Queue access again but doesn't bring these pages back.</p>`;
  return `<section class="card stack"><div class="sec-head"><div><h2>Public pages and retention</h2></div>${head}</div>${body}
    <div class="grid2" style="gap:12px"><div class="stack tight"><span class="label">Ends with the license</span><p class="small">Queue app access, saved players and past reports. Later, the public session pages.</p></div>
    <div class="stack tight"><span class="label">Always kept</span><p class="small">Players' match history and earned ranks, still under the normal three-month leaderboard window.</p></div></div>
    <p class="small muted">Nothing here deletes a club or its players.</p></section>`;
}

        <dt>City code</dt><dd><span class="mono">${c.code}</span> · used in new players' RTR IDs</dd>

    <div class="hero">${logo(c, 'lg')}<div class="main"><h1>${esc(c.name)}</h1><div class="row">${accessChip(a)}${a.plan ? chip(a.plan) : ''}${c.live ? `<span class="small live"><i></i>Session running</span>` : ''}</div></div></div>

// ---------- A-PLAYERS ----------
function playerMatches() {
  const q = S.ui.playersQ.trim(), F = S.ui.playersF;
  const qp = plain(q), qd = q.replace(/\D/g, '');
  return S.players.filter((p) => (F === 'all' || (F === 'registered' ? p.claimed : !p.claimed))
    && (!q || plain(`${p.name} ${p.nick} ${p.rtr} ${p.email}`).includes(qp) || (qd.length >= 4 && (p.phone.replace(/\D/g, '').includes(qd) || p.phone.replace(/\D/g, '').includes(qd.replace(/^0/, '63'))))));
}
function viewPlayers() {
  const all = playerMatches(), shown = all.slice(0, S.ui.shown);
  const F = S.ui.playersF;
  const reg = S.players.filter((p) => p.claimed).length;
  const byName = {};
  all.forEach((p) => { byName[p.name] = (byName[p.name] || 0) + 1; });
  const dupes = Object.entries(byName).filter(([, n]) => n > 1);
  return shell(`<div class="page-head"><h1>Players</h1><p class="muted">Every player identity with a permanent RTR ID. Guests a club only typed a name for stay in that club's records and aren't listed.</p></div>
    <div class="toolbar"><div class="search">${I.search}<input class="input" id="players-q" type="search" placeholder="Search by name, RTR ID, phone or email" aria-label="Search players" data-bind="ui.playersQ" data-live value="${esc(S.ui.playersQ)}"></div>
      ${seg('playersF', F, [['all', 'All', S.players.length], ['registered', 'Registered', reg], ['unclaimed', 'Unclaimed', S.players.length - reg]], 'Filter by account')}</div>
    <p class="hint">Phone and email search is only available in Admin. Public search on Player Information never matches them.</p>
    ${dupes.length && S.ui.playersQ.trim() ? notice('warn', dupes.map(([name, n]) => `<b>${n} players are named ${esc(name)}.</b> They're separate people with separate histories. Check the RTR ID before acting.`).join('<br>')) : ''}
    <section class="card">${all.length ? `<div class="tbl-wrap"><table class="tbl cards"><thead><tr><th>Player</th><th>RTR ID</th><th>Account</th><th>Rank</th><th>Created by</th></tr></thead><tbody>
      ${shown.map((p) => { const rk = rankOf(p); return `<tr class="click" data-act="openPlayer" data-id="${p.id}">
        <td class="lead" data-label="Player"><div class="who">${avatar(p)}<div class="main"><button class="link" data-act="openPlayer" data-id="${p.id}">${esc(p.name)}</button>${p.nick ? `<span class="small muted">“${esc(p.nick)}”</span>` : ''}</div></div></td>
        <td data-label="RTR ID" class="mono small nw">${esc(p.rtr)}</td>
        <td data-label="Account">${p.claimed ? chip('Registered', 'ok') : chip('Unclaimed')}</td>
        <td data-label="Rank">${rk.chip}</td>
        <td data-label="Created by" class="small">${esc(p.club)}</td></tr>`; }).join('')}
      </tbody></table></div>
      <div class="more"><span class="small muted">Showing ${num(shown.length)} of ${num(all.length)}</span>${all.length > shown.length ? `<button class="btn sm" data-act="morePlayers" style="margin-left:12px">Show 25 more</button>` : ''}</div>`
      : `<div class="empty"><b>No players match “${esc(S.ui.playersQ.trim())}”.</b><span>Check the spelling, try the full RTR ID, or type at least four digits of a phone number.</span><button class="btn sm" data-act="clearPlayers">Clear search</button></div>`}</section>`);
}

// ---------- A-PLAYER-DETAIL ----------

    ${twin.length ? notice('warn', `<b>Another player has the same name.</b> ${twin.map((x) => `<button class="link acc" data-act="openPlayer" data-id="${x.id}">${esc(x.name)}</button> (<span class="mono">${esc(x.rtr)}</span>)`).join(', ')} is a separate identity. Admin doesn't merge players.`) : ''}

    </div><div>
      <section class="card stack"><h2>Account</h2><dl class="kv">
        <dt>Status</dt><dd>${p.claimed ? `Registered ${fmtYmd(p.registered)}` : 'Unclaimed. The club created this profile; the player hasn\'t finished registering.'}</dd></dl></section>
      <section class="card stack"><h2>Rank and games</h2><dl class="kv">
        <dt>Rank</dt><dd>${esc(rk.text)}</dd>

    </div></div>`);
}

// ---------- A-CONTACT-REQUESTS ----------

// ---------- A-CONTACT-REVIEW ----------
function viewReview() {
  const r = reqOf(S.viewId);
  if (!r) return shell(`${backBtn('contacts', 'Contact changes')}<div class="card empty"><b>Request not found.</b></div>`);
  const p = playerOf(r.pid), f = FIELD[r.field], F = f[0].toUpperCase() + f.slice(1);
  const ch = r.status === 'submitted' ? checks(r) : null, isBlocked = ch && ch.some((c) => !c.ok);
  const status = {
    submitted: '',
    applying: notice('warn', `<div class="row"><span class="spin" aria-hidden="true"></span><b>Approved${r.approvedAt ? ` ${ago(r.approvedAt)}` : ''}. Applying the change.</b></div><p>${esc(firstName(p))} keeps signing in with <span class="mono">${esc(r.from)}</span> until this finishes.</p>`),

function cfgCheck(d) {
  const e = {};

  if (!int(d.perf) || +d.perf > 100) e.perf = 'Use a whole number from 0 to 100.';
  if (!e.assess && !e.perf && +d.assess + +d.perf !== 100) e.total = `The two weights add up to ${+d.assess + +d.perf}%. They must total exactly 100%.`;

}

      `<button class="btn" data-act="closeSheet" ${sh.pending ? 'disabled' : ''}>Back</button><button class="btn danger" data-act="doNameReject" ${sh.pending ? 'disabled' : ''}>${sh.pending ? 'Rejecting…' : 'Reject request'}</button>`, !sh.pending);

      <p>After you approve, ROTRA applies the change to the account. ${esc(firstName(p))} signs in with the new ${f} once it shows as Applied.</p>

  config: (sh) => {

    const x = S.flags.find((f) => f.id === sh.id);
    return sheetWrap(`Turn ${x.on ? 'off' : 'on'} ${esc(x.name)}?`, `<dl class="kv"><dt>Now</dt><dd>${x.on ? 'On' : 'Off'}</dd><dt>After saving</dt><dd>${x.on ? 'Off' : 'On'}</dd></dl>
      <p class="small muted">Saving here doesn't prove an offline Queue device has the change. When devices pick it up hasn't been decided.</p>${errLine(sh.err)}`,
    `<button class="btn" data-act="closeSheet" ${sh.pending ? 'disabled' : ''}>Back</button><button class="btn primary" data-act="doFlag" ${sh.pending ? 'disabled' : ''}>${sh.pending ? 'Saving…' : `Turn ${x.on ? 'off' : 'on'}`}</button>`, !sh.pending);

    const toggle = (key, title, sub, on, act = 'demoToggle') => `<div class="demo-sec"><div class="setting"><div class="main"><b>${title}</b><p class="small muted">${sub}</p></div>${sw(on, act, title, `data-k="${key}"`)}</div></div>`;
    return sheetWrap('Prototype', `<p class="small muted">Try the states Admin has to handle. None of these controls are part of the real app.</p>
      <div class="demo-sec"><span class="label">Account</span><div class="row">${S.me && !S.denied ? `<span class="small">Signed in as <b>${OWNER}</b></span><button class="btn xs" data-act="signOut">Sign out</button><button class="btn xs" data-act="endSession">End the session</button>`
        : `<button class="btn xs" data-act="demoSignIn">Sign in as the platform owner</button><button class="btn xs" data-act="demoDenied">Sign in with a club account</button>`}</div>
        <span class="hint">The sign-in screen is a mock: anything you type signs in as the platform owner.</span></div>

      ${toggle('timeoutNext', 'Next license save gets no reply', 'The term is saved, but the reply is lost. Check status finds it instead of adding a second one.', S.demo.timeoutNext)}
      ${toggle('failApply', 'Next contact change fails to apply', 'Approval saves; applying it to the account fails and needs a retry.', S.demo.failApply)}
      ${toggle('failConfig', 'Next settings save fails', 'The values in effect stay; the draft is kept.', S.demo.failConfig)}
      ${toggle('conflictConfig', 'Someone else saves settings first', 'Your next settings save meets a newer version.', S.demo.conflictConfig)}
      ${toggle('flag', 'Show a placeholder flag', 'Shows how a defined flag looks. It isn\'t a real flag.', S.flags.some((x) => x.id === 'placeholder'), 'demoFlag')}
      <div class="demo-sec"><button class="btn sm danger" data-act="resetDemo">${S.ui.resetArmed ? 'Tap again to reset everything' : 'Reset demo data'}</button></div>`,
    '<button class="btn" data-act="closeSheet">Done</button>');

// ---------- Actions ----------
function go(to, id, anchor) {
  if (S.screen === 'config' && to !== 'config' && cfgDirty()) { S.ui.pendingGo = { to, id }; S.ui.sheet = { type: 'discard' }; S.ui.nav = false; render(); return; }
  if (S.screen === 'config' && to !== 'config') { S.ui.cfg = null; S.ui.cfgErr = ''; S.ui.cfgConflict = false; }
  S.screen = to;
  if (id !== undefined) S.viewId = id;
  S.ui.sheet = null; S.ui.nav = false; S.ui.checking = null;
  render();
  const el = anchor && document.getElementById(anchor);
  if (el) el.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
}
function signOutAll(ended = false) {
  S.me = null; S.denied = null; S.ended = ended; S.screen = 'clubs'; S.viewId = null;
  S.ui = { ...freshUi(), login: { email: '', pass: '', show: false, err: '', pending: false } };
  render(); window.scrollTo(0, 0);
}
function offlineBlock(target) { if (S.online) return false; target.err = OFFLINE_ERR; target.pending = false; render(); return true; }
function runApply(id, ms = 1800) {
  later(ms, () => {
    const r = reqOf(id);
    if (!r || r.status !== 'applying') return;
    S.ui.checking = null;
    const p = playerOf(r.pid);
    if (S.demo.failApply) {
      S.demo.failApply = false;
      r.status = 'failed'; r.error = "The sign-in provider didn't accept the change.";
      log('req', r.id, `Applying ${FIELD[r.field]} change for ${p.name} failed at the sign-in provider.`);
      toast(`Not applied. ${firstName(p)} still signs in with the old ${FIELD[r.field]}.`);
    } else {
      p[r.field] = r.to; r.status = 'applied'; r.appliedAt = Date.now(); r.error = '';
      log('req', r.id, `Applied ${FIELD[r.field]} change for ${p.name}.`);
      toast(`Applied. ${firstName(p)} now signs in with ${r.to}.`);
    }
  });
}
function licStart(c) {
  const a = access(c), t = todayYmd();
  const last = [...c.terms].sort((x, y) => (x.from < y.from ? 1 : -1))[0];
  const plan = last ? last.plan : '';
  const L = { club: c.id, step: 'form', plan, from: a.state === 'active' ? addDays(a.until, 1) : t, paid: t, amount: c.price.free ? '0' : plan ? String(plan === 'Yearly' ? c.price.yearly : c.price.monthly) : '', ref: '', err: '', showErr: false };
  L.init = licFields(L);
  S.ui.lic = L; S.ui.sheet = { type: 'license' };
  render();
}
function licCommit() {
  const L = S.ui.lic, c = clubOf(L.club), a = access(c), t = todayYmd(), verb = c.terms.length ? 'Renewed' : 'Activated';
  const x = { ...term(L.paid, L.plan, L.from, termEnd(L.from, L.plan), +String(L.amount).replace(/,/g, ''), L.ref.trim()), op: L.op };
  c.terms.push(x);
  let extra = '';
  if (a.state === 'expired' && L.from <= t && x.to >= t) {
    if (c.ret.deletedOn) extra = ' Public pages were already deleted and were not restored.';
    else { c.ret.cycles.push({ expired: a.since, cancelled: t }); c.ret.failedOn = null; extra = ` Public pages restored; deletion countdown from ${fmtYmd(a.since)} cancelled.`; }
  }
  log('club', c.id, `${verb} license: ${x.plan}, ${fmtYmd(x.from)} – ${fmtYmd(x.to)} · ${amountText(x.amount)}${x.ref ? ` · ${x.ref}` : ''}.${extra}`);
  return { c, x, verb };
}
function licDone(r, found) {
  S.ui.sheet = null; S.ui.lic = null;
  toast(`${found ? 'Found it: license' : 'License'} ${r.verb.toLowerCase()} until ${fmtYmd(r.x.to)}.${found ? ' Nothing was added twice.' : ''}`);
}

const ACT = {
  go: (el) => go(el.dataset.to, undefined),
  openClub: (el) => { S.ui.clubTab = 'overview'; go('club', el.dataset.id, el.dataset.anchor); },
  clubTab: (el) => { S.ui.clubTab = el.dataset.v; render(); },
  openPlayer: (el) => go('player', el.dataset.id),
  openReview: (el) => go('review', el.dataset.id),
  toggleNav: () => { S.ui.nav = !S.ui.nav; render(); },
  toggleTheme: () => {
    const t = isDark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem(THEME_KEY, t); } catch (e) { /* not remembered */ }
    render();
  },
  togglePass: () => { S.ui.login.show = !S.ui.login.show; render(); },
  signOut: () => signOutAll(false),
  endSession: () => signOutAll(true),
  demoSignIn: () => { S.me = OWNER; S.denied = null; S.ended = false; S.ui.sheet = null; S.screen = 'clubs'; render(); },
  demoDenied: () => { S.me = 'lahug.smash'; S.denied = NON_ADMIN['lahug.smash']; S.ui.sheet = null; render(); },
  clubsF: (el) => { S.ui.clubsF = el.dataset.v; render(); },
  clearClubs: () => { S.ui.clubsQ = ''; S.ui.clubsF = 'all'; render(); },
  playersF: (el) => { S.ui.playersF = el.dataset.v; S.ui.shown = 25; render(); },
  clearPlayers: () => { S.ui.playersQ = ''; S.ui.playersF = 'all'; S.ui.shown = 25; render(); },
  morePlayers: () => { S.ui.shown += 25; render(); },
  reqF: (el) => { S.ui.reqF = el.dataset.v; render(); },
  closeSheet: () => {
    const sh = S.ui.sheet;
    if (!sh || sh.pending) return;
    if (sh.type === 'license') {
      const L = S.ui.lic;
      if (['saving', 'timeout', 'checking'].includes(L.step)) return;
      if (L.step !== 'leave' && licDirty()) { L.prev = L.step; L.step = 'leave'; render(); return; }
      S.ui.lic = null;
    }
    if (sh.type === 'addClub') {
      const A = S.ui.add;
      if (A.step === 'saving') return;
      if (A.step !== 'leave' && [A.name, A.founding, A.code, A.username, A.pass, A.monthly, A.yearly].some((v) => String(v).trim())) { A.step = 'leave'; render(); return; }
      S.ui.add = null;
    }
    if (sh.type === 'addFlag') {
      const F = S.ui.flag;
      if (F.step === 'saving') return;
      if (F.step !== 'leave' && [F.name, F.key, F.desc].some((v) => String(v).trim())) { F.step = 'leave'; render(); return; }
      S.ui.flag = null;
    }
    if (sh.type === 'discard') S.ui.pendingGo = null;
    S.ui.sheet = null; render();
  },
  // License
  openLicense: (el) => licStart(clubOf(el.dataset.id)),
  licPlan: (el) => {
    // Switching plans fills in that plan's price, unless the amount was typed in by hand.
    const L = S.ui.lic, p = clubOf(L.club).price, priceFor = (plan) => (p.free ? 0 : plan === 'Yearly' ? p.yearly : plan === 'Monthly' ? p.monthly : null);
    if (!String(L.amount).trim() || toNum(L.amount) === priceFor(L.plan)) L.amount = String(priceFor(el.dataset.v));
    L.plan = el.dataset.v; render();
  },
  // Add club
  openAddClub: () => {
    S.ui.add = { step: 'form', name: '', founding: '', code: '', username: '', userTouched: false, pass: '', show: false, monthly: '', yearly: '', showErr: false, err: '' };
    S.ui.sheet = { type: 'addClub' }; S.ui.nav = false; render();
  },
  addShow: () => { S.ui.add.show = !S.ui.add.show; render(); },
  addGen: () => { S.ui.add.pass = genPass(); S.ui.add.show = true; render(); },
  addReview: () => { const A = S.ui.add; A.showErr = true; A.err = ''; if (Object.keys(addErrors(A)).length) { render(); return; } A.step = 'review'; render(); },
  addEdit: () => { S.ui.add.step = 'form'; S.ui.add.err = ''; render(); },
  addBack: () => { S.ui.add.step = 'form'; render(); },
  addDiscard: () => { S.ui.add = null; S.ui.sheet = null; render(); },
  addCreate: () => {
    const A = S.ui.add;
    if (A.step === 'saving') return;
    if (offlineBlock(A)) return;
    if (Object.keys(addErrors(A)).length) { A.step = 'form'; render(); return; }
    A.step = 'saving'; A.err = ''; render();
    later(1000, () => {
      const name = A.name.trim();
      const c = { id: `c${Date.now()}`, name, initials: initials(name), username: A.username.trim(), setUp: todayYmd(), founding: A.founding.trim(), city: CITY_LIST.find(([k]) => k === A.code)[1], code: A.code,
        terms: [], nameRequest: null, live: null, ret: { cycles: [] }, oldNames: [], price: { monthly: posInt(A.monthly) ? toNum(A.monthly) : 0, yearly: posInt(A.yearly) ? toNum(A.yearly) : 0, free: !!A.free } };
      S.clubs.push(c);
      log('club', c.id, `Set up the club account ${c.username}. Price: ${priceLine(c.price)}.`);
      S.ui.add = null; S.ui.clubTab = 'license';
      go('club', c.id);
      toast(`${name} added. Activate a license so it can run sessions.`);
    });
  },
  // Add feature flag
  openAddFlag: () => { S.ui.flag = { step: 'form', name: '', key: '', keyTouched: false, desc: '', on: false, showErr: false, err: '' }; S.ui.sheet = { type: 'addFlag' }; S.ui.nav = false; render(); },
  flagOn: () => { S.ui.flag.on = !S.ui.flag.on; render(); },
  flagBack: () => { S.ui.flag.step = 'form'; render(); },
  flagDiscard: () => { S.ui.flag = null; S.ui.sheet = null; render(); },
  flagCreate: () => {
    const F = S.ui.flag;
    if (F.step === 'saving') return;
    F.showErr = true; F.err = '';
    if (Object.keys(flagErrors(F)).length) { render(); return; }
    if (offlineBlock(F)) return;
    F.step = 'saving'; render();
    later(800, () => {
      const x = { id: `f${Date.now()}`, key: F.key.trim(), name: F.name.trim(), desc: F.desc.trim(), on: F.on, changed: Date.now() };
      S.flags.push(x);
      log('flag', x.id, `Added feature flag ${x.key} (${x.on ? 'on' : 'off'}).`);
      S.ui.flag = null; S.ui.sheet = null;
      toast(`${x.name} added. It's ${x.on ? 'on' : 'off'}.`);
    });
  },
  // Price
  priceMode: (el) => { const d = el.dataset.k === 'add' ? S.ui.add : S.ui.price; d.free = el.dataset.v === 'free'; render(); },
  openPrice: (el) => { const c = clubOf(el.dataset.id); S.ui.price = { monthly: c.price.monthly ? String(c.price.monthly) : '', yearly: c.price.yearly ? String(c.price.yearly) : '', free: !!c.price.free, showErr: false }; S.ui.sheet = { type: 'price', id: c.id }; render(); },
  doPrice: () => {
    const sh = S.ui.sheet, d = S.ui.price;
    if (sh.pending) return;
    d.showErr = true;
    if (!d.free && Object.keys(priceErrors(d.monthly, d.yearly)).length) { render(); return; }
    // Switching to free keeps the last paid price so it can be restored later.
    const c = clubOf(sh.id), next = d.free ? { ...c.price, free: true } : { monthly: toNum(d.monthly), yearly: toNum(d.yearly), free: false };
    if (next.monthly === c.price.monthly && next.yearly === c.price.yearly && next.free === !!c.price.free) { S.ui.sheet = null; render(); return; }
    if (offlineBlock(sh)) return;
    sh.pending = true; sh.err = ''; render();
    later(800, () => {
      log('club', c.id, `Changed price from ${priceLine(c.price)} to ${priceLine(next)}.`);
      c.price = next; S.ui.sheet = null; toast(`Price saved: ${priceLine(next)}.`);
    });
  },
  licReview: () => { const L = S.ui.lic; L.showErr = true; L.err = ''; if (Object.keys(licErrors(L)).length) { render(); return; } L.step = 'review'; render(); },
  licEdit: () => { S.ui.lic.step = 'form'; S.ui.lic.err = ''; render(); },
  licBack: () => { const L = S.ui.lic; L.step = L.prev || 'form'; render(); },
  licDiscard: () => { S.ui.lic = null; S.ui.sheet = null; render(); },
  licSave: () => {
    const L = S.ui.lic;
    if (L.step === 'saving') return;
    if (offlineBlock(L)) return;
    L.step = 'saving'; L.err = ''; L.op = `op-${Date.now()}`; render();
    later(1200, () => {
      if (S.demo.timeoutNext) { S.demo.timeoutNext = false; licCommit(); L.step = 'timeout'; return; }
      licDone(licCommit(), false);
    });
  },
  licCheck: () => {
    const L = S.ui.lic;
    if (!S.online) { toast("You're offline. Check the status once you're connected."); return; }
    L.step = 'checking'; render();
    later(900, () => {
      const c = clubOf(L.club), x = c.terms.find((t) => t.op === L.op);
      if (x) licDone({ c, x, verb: c.terms.length > 1 ? 'Renewed' : 'Activated' }, true);
      else { L.step = 'review'; L.err = "It wasn't saved. You can save it again."; }
    });
  },
  // Club names
  openNameApprove: (el) => { S.ui.sheet = { type: 'nameApprove', id: el.dataset.id }; render(); },
  openNameReject: (el) => { S.ui.sheet = { type: 'nameReject', id: el.dataset.id }; render(); },
  doNameApprove: () => {
    const sh = S.ui.sheet;
    if (offlineBlock(sh)) return;
    sh.pending = true; sh.err = ''; render();
    later(900, () => {
      const c = clubOf(sh.id), old = c.name;
      c.oldNames.push(old); c.name = c.nameRequest.name; c.initials = initials(c.name); c.nameRequest = null;
      log('club', c.id, `Approved name change: ${old} → ${c.name}.`);
      S.ui.sheet = null; toast(`Name changed to ${c.name}.`);
    });
  },
  doNameReject: () => {
    const sh = S.ui.sheet;
    if (offlineBlock(sh)) return;
    sh.pending = true; sh.err = ''; render();
    later(800, () => {
      const c = clubOf(sh.id);
      log('club', c.id, `Rejected name change to ${c.nameRequest.name}. Kept ${c.name}.`);
      c.nameRequest = null; S.ui.sheet = null; toast(`Rejected. The club keeps ${c.name}.`);
    });
  },
  // Contact changes
  openApprove: (el) => { const r = reqOf(el.dataset.id); if (blocked(r)) return; S.ui.sheet = { type: 'approve', id: r.id }; render(); },
  openDecline: (el) => { S.ui.sheet = { type: 'decline', id: el.dataset.id }; render(); },
  doApprove: () => {
    const sh = S.ui.sheet;
    if (offlineBlock(sh)) return;
    sh.pending = true; sh.err = ''; render();
    later(900, () => {
      const r = reqOf(sh.id), p = playerOf(r.pid);
      if (blocked(r)) { sh.pending = false; sh.err = 'Something changed while you were reviewing. Check the request again.'; return; }
      r.status = 'applying'; r.approvedAt = Date.now();
      log('req', r.id, `Approved ${FIELD[r.field]} change for ${p.name}.`);
      S.ui.sheet = null; toast('Approved. Applying the change…');
      runApply(r.id);
    });
  },
  doDecline: () => {
    const sh = S.ui.sheet;
    if (offlineBlock(sh)) return;
    sh.pending = true; sh.err = ''; render();
    later(800, () => {
      const r = reqOf(sh.id), p = playerOf(r.pid);
      r.status = 'rejected'; r.decidedAt = Date.now();
      log('req', r.id, `Declined ${FIELD[r.field]} change for ${p.name}.`);
      S.ui.sheet = null; toast(`Declined. ${firstName(p)} keeps the current ${FIELD[r.field]}.`);
    });
  },
  checkApply: (el) => { if (!S.online) { toast("You're offline. Check the status once you're connected."); return; } S.ui.checking = el.dataset.id; render(); runApply(el.dataset.id, 900); },
  retryApply: (el) => {
    if (!S.online) { toast(OFFLINE_ERR); return; }
    const r = reqOf(el.dataset.id);
    r.status = 'applying'; r.error = '';
    log('req', r.id, `Retried applying ${FIELD[r.field]} change for ${playerOf(r.pid).name}.`);
    render(); runApply(r.id);
  },
  // Ranking settings
  cfgBalance: () => { const d = cfgDraft(); if (/^\d+$/.test(String(d.assess).trim()) && +d.assess <= 100) d.perf = String(100 - +d.assess); render(); },
  cfgDiscard: () => { S.ui.cfg = null; S.ui.cfgErr = ''; S.ui.cfgConflict = false; render(); },
  cfgRebase: () => { S.ui.cfg.base = eff().v; S.ui.cfgConflict = false; render(); },
  discardGo: () => { const g = S.ui.pendingGo; S.ui.cfg = null; S.ui.cfgErr = ''; S.ui.cfgConflict = false; S.ui.pendingGo = null; S.ui.sheet = null; if (g) go(g.to, g.id); else render(); },
  doConfig: () => {
    const sh = S.ui.sheet;
    if (offlineBlock(sh)) return;
    sh.pending = true; sh.err = ''; render();
    later(1000, () => {
      const d = S.ui.cfg;
      if (S.demo.conflictConfig) {
        S.demo.conflictConfig = false;
        const e = eff();
        S.config.push({ v: e.v + 1, assess: e.assess, perf: e.perf, threshold: e.threshold + 2, at: Date.now() - 4 * 6e4, by: `${OWNER} (another browser)` });
        S.ui.cfgConflict = true; S.ui.sheet = null; return;
      }
      if (S.demo.failConfig) { S.demo.failConfig = false; S.ui.sheet = null; S.ui.cfgErr = `<b>Couldn't save.</b> Version ${eff().v} is still in effect. Your draft is kept, so you can try again.`; return; }
      if (d.base !== eff().v) { S.ui.cfgConflict = true; S.ui.sheet = null; return; }
      const v = { v: eff().v + 1, assess: +d.assess, perf: +d.perf, threshold: +d.threshold, at: Date.now(), by: OWNER };
      S.config.push(v); S.ui.cfg = null; S.ui.cfgErr = ''; S.ui.sheet = null;
      toast(`Saved. Version ${v.v} is in effect.`);
    });
  },
  // Feature flags
  openFlag: (el) => { S.ui.sheet = { type: 'flag', id: el.dataset.id }; render(); },
  doFlag: () => {
    const sh = S.ui.sheet;
    if (offlineBlock(sh)) return;
    sh.pending = true; sh.err = ''; render();
    later(800, () => { const x = S.flags.find((f) => f.id === sh.id); x.on = !x.on; x.changed = Date.now(); S.ui.sheet = null; toast(`${x.name} is ${x.on ? 'on' : 'off'}.`); });
  },
  // Prototype
  openDemo: () => { S.ui.sheet = { type: 'demo' }; S.ui.resetArmed = false; render(); },
  toggleOnline: () => { S.online = !S.online; S.offlineAt = S.online ? null : Date.now(); render(); },
  demoToggle: (el) => { const k = el.dataset.k; S.demo[k] = !S.demo[k]; render(); },
  demoFlag: () => {
    if (S.flags.some((x) => x.id === 'placeholder')) S.flags = S.flags.filter((x) => x.id !== 'placeholder');
    else S.flags.unshift({ id: 'placeholder', name: 'Placeholder flag', desc: 'Shows how a defined flag will look in Admin. It is not a real flag and controls nothing.', on: false, changed: null });
    render();
  },
  resetDemo: () => {
    if (!S.ui.resetArmed) { S.ui.resetArmed = true; render(); return; }
    S = freshState(); toast('Demo data reset.'); render();
  },
};

const FORM = {
  login: () => {
    // Mock sign-in: whatever is typed signs in as the platform owner. Access denied stays in the Prototype menu.
    const L = S.ui.login;
    if (L.pending) return;
    L.pending = true; L.err = ''; render();
    later(400, () => { L.pending = false; L.pass = ''; S.me = OWNER; S.denied = null; S.ended = false; S.screen = 'clubs'; });
  },
  license: () => ACT.licReview(),
  addClub: () => ACT.addReview(),
  addFlag: () => ACT.flagCreate(),
  price: () => ACT.doPrice(),
  config: () => {
    const d = cfgDraft();
    if (!cfgDirty() || Object.keys(cfgCheck(d)).length || S.ui.cfgConflict) return;
    S.ui.cfgErr = ''; S.ui.sheet = { type: 'config' }; render();
  },
};

const setPath = (path, v) => { const ks = path.split('.'); let o = S; ks.slice(0, -1).forEach((k) => { o = o[k]; }); o[ks[ks.length - 1]] = v; };
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  // A button inside a clickable row handles the click itself.
  if (el.tagName === 'TR' && ev.target.closest('button, a, input') && ev.target.closest('button, a, input') !== el) return;
  const fn = ACT[el.dataset.act];
  if (fn) { ev.preventDefault(); fn(el); }
});
document.addEventListener('submit', (ev) => {
  const f = ev.target.closest('[data-form]');
  if (!f) return;
  ev.preventDefault();
  const fn = FORM[f.dataset.form];
  if (fn) fn();
});
document.addEventListener('input', (ev) => {
  const el = ev.target;
  if (!el.dataset.bind) return;
  setPath(el.dataset.bind, el.value);
  if (el.dataset.bind === 'ui.playersQ') S.ui.shown = 25;
  // The username follows the club name until it's edited by hand.
  if (el.dataset.bind === 'ui.add.username') S.ui.add.userTouched = true;
  if (el.dataset.bind === 'ui.add.name' && !S.ui.add.userTouched) S.ui.add.username = slugOf(el.value);
  if (el.dataset.bind === 'ui.flag.key') S.ui.flag.keyTouched = true;
  if (el.dataset.bind === 'ui.flag.name' && !S.ui.flag.keyTouched) S.ui.flag.key = flagKeyOf(el.value);
  if (el.dataset.live !== undefined) render(); else save();
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') { if (S.ui.sheet) ACT.closeSheet(); else if (S.ui.nav) ACT.toggleNav(); }
});

// ---------- Render ----------
let lastSheet = null;
function render() {
  const a = document.activeElement;
  const focusId = a && a.id && a !== document.body ? a.id : null;
  let sel = null;
  try { sel = a && typeof a.selectionStart === 'number' ? a.selectionStart : null; } catch (e) { sel = null; }
  let page;
  if (!S.me) page = viewLogin();
  else if (S.denied) page = viewDenied();
  else page = ({ clubs: viewClubs, club: viewClub, players: viewPlayers, player: viewPlayer, contacts: viewContacts, review: viewReview, names: viewNames, config: viewConfig, flags: viewFlags }[S.screen] || viewClubs)();
  const sh = S.ui.sheet;
  // Privileged sheets only render inside a signed-in owner session; the Prototype sheet is always available.
  const showSheet = sh && (sh.type === 'demo' || (S.me && !S.denied));
  const key = showSheet ? `${sh.type}:${sh.type === 'license' ? S.ui.lic.step : sh.type === 'addClub' ? S.ui.add.step : sh.type === 'addFlag' ? (S.ui.flag.step === 'leave' ? 'leave' : 'form') : ''}` : null;
  // Re-rendering an open sheet (typing, validation) must not replay its opening animation or lose its scroll position.
  const same = showSheet && key === lastSheet;
  const sbTop = same ? document.querySelector('.sheet .sb')?.scrollTop || 0 : 0;
  let sheetHtml = showSheet ? SHEETS[sh.type](sh) : '';
  if (same) sheetHtml = sheetHtml.replace('class="scrim"', 'class="scrim still"').replace('class="sheet', 'class="sheet still');
  document.getElementById('app').innerHTML = topBar() + page + sheetHtml;
  if (same) { const sb = document.querySelector('.sheet .sb'); if (sb) sb.scrollTop = sbTop; }
  document.body.style.overflow = showSheet || S.ui.nav ? 'hidden' : '';
  if (showSheet && key !== lastSheet && !(focusId && document.getElementById(focusId)?.closest('.sheet'))) {
    const t = document.getElementById('sheet-title');
    if (t) t.focus();
  } else if (focusId && document.getElementById(focusId)) {
    const el = document.getElementById(focusId);
    el.focus({ preventScroll: true });
    if (sel != null && el.setSelectionRange) { try { el.setSelectionRange(sel, sel); } catch (e) { /* not a text field */ } }
  }
  lastSheet = key;
  save();
}
render();
})();
</script>
