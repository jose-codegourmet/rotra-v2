// ---------- Account verification (proposal, owner November 16, 2026) ----------
// A player is verified when all three are true: a Google account is connected, a phone number is on the account,
// and the ROTRA email is the Google account's email. ROTRA Admin can set the status by hand (Verified by Admin), which skips the checks.
function verifyOf(a) {
  const steps = [
    { k: 'google', done: !!a.google },
    { k: 'phone', done: !!a.phone },
    { k: 'email', done: !!a.google && !!a.email && a.google.toLowerCase() === a.email.toLowerCase() },
  ];
  const n = steps.filter((x) => x.done).length;
  const admin = a.adminStatus === 'verified';
  return { steps, n, admin, ok: admin || n === 3 };
}
const verifyChip = (a) => { const v = verifyOf(a); return v.admin ? chip(`${I.check} Verified by Admin`, 'ok') : v.ok ? chip(`${I.check} Verified`, 'ok') : chip(`Not verified · ${v.n} of 3`, 'warn'); };
function verifyCard(a) {
  const v = verifyOf(a), r = S.requests[a.id];
  const pendingEmail = r && r.field === 'email' && ['submitted', 'applying'].includes(r.status) && a.google && r.to.toLowerCase() === a.google.toLowerCase();
  const step = (x, i) => {
    const t = {
      google: ['Connect your Google account', x.done ? `Connected · ${esc(a.google)}` : 'You sign in with it from now on.',
        x.done ? '' : '<button class="btn sm primary" data-act="google" data-ctx="connect">Connect Google</button>'],
      phone: ['Add your mobile number', x.done ? `On your account · ${esc(maskPhone(a.phone))}` : 'Clubs use it to find you. Hide it from clubs any time.',
        x.done ? '' : '<button class="btn sm" data-act="openRequestPhone">Add phone number</button>'],
      email: ['Use your Google email as your ROTRA email', x.done ? `Both are ${esc(a.email)}` : !a.google ? 'Connect Google first.'
        : `Your ROTRA email is ${esc(a.email)}, but your Google account is ${esc(a.google)}.`,
        x.done || !a.google ? '' : pendingEmail ? chip('Change sent for Admin review', 'warn')
          : `<button class="btn sm" data-act="reqGoogleEmail">Change my ROTRA email to ${esc(a.google)}</button><button class="btn sm ghost" data-act="google" data-ctx="connect">Connect the Google account for ${esc(a.email)}</button>`],
    }[x.k];
    return `<div class="vstep${x.done ? ' done' : ''}"><span class="vic">${x.done ? I.check : i + 1}</span><div class="vmain"><b>${t[0]}</b><span class="small muted">${t[1]}</span>${t[2] ? `<div class="row">${t[2]}</div>` : ''}</div></div>`;
  };
  return `<section class="card stack" id="verify"><div class="between"><h2>Your status</h2>${verifyChip(a)}</div>
    ${v.admin ? notice('ok', 'ROTRA Admin verified your account. You don\'t need to do anything else.')
      : v.ok ? '<p class="small muted" style="margin:0">Your account is verified: Google is connected, your phone is on file and your email matches Google.</p>'
      : `<p class="small muted" style="margin:0">Finish these by <b>${G_DEADLINE}</b>. ${v.n} of 3 done.</p><div class="vbar" aria-hidden="true"><i style="width:${Math.round(v.n / 3 * 100)}%"></i></div>`}
    ${v.admin ? '' : `<div class="vsteps">${v.steps.map(step).join('')}</div>`}
    <p class="small muted" style="margin:0">Can't finish a step? Contact ROTRA. Admin can verify your account by hand.</p></section>`;
}

// ---------- P-ONBOARD (owner, November 19, 2026) ----------
// After a player accepts an invite link (the club-created profile's registration link, or a session game link), registering is a
// fullscreen, four-step onboarding: 1 Your details (the registration form, prefilled from what the club saved), 2 Where you play,
// 3 Shots you know, 4 Favorite badminton player. Details are required; steps 2 to 4 each have Skip and can be changed later in
// Edit profile. The account is created when step 1 is sent, so leaving after it keeps the account.
function startOnboard(id, next) {
  const a = S.accounts[id];
  S.ui.ob = { id, next, step: 1, err: '', d: { courtPos: a.courtPos || '', skills: [...(a.skills || [])], skillsOther: [...(a.skillsOther || [])], fav: a.fav || '', favOther: a.favOther || '' } };
  S.screen = 'onboard'; S.ui.sheet = null; render(); window.scrollTo(0, 0);
}
function finishOnboard() {
  const o = S.ui.ob, a = S.accounts[o.id];
  Object.assign(a, gameOf(o.d));
  S.ui.ob = null; go(o.next);
}
const OB_STEPS = ['Your details', 'Where you play', 'Shots you know', 'Favorite player'];

    { heading: 'People saved by a club before they register', blocks: [

    { heading: 'Why we use your information', blocks: [
      { kind: 'paragraph', text: 'The Data Privacy Act asks us to have a lawful reason, called a legal basis, for each use of your information. These are ours.' },

function viewLegal(doc) {
  const block = (b) => b.kind === 'list' ? `<ul>${b.items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : `<p>${esc(b.text)}</p>`;
  return `<main class="wrap legal"><div class="page-head"><h1>${esc(doc.title)}</h1><p class="muted">${LEGAL_EFFECTIVE}</p></div>
    ${doc.sections.map((s) => `<section class="legal-sec"><h2>${esc(s.heading)}</h2>${s.blocks.map(block).join('')}</section>`).join('')}</main>`;
}
const viewPrivacy = () => viewLegal(LEGAL.privacy);

function go(to, id) {
  if (S.screen === 'edit' && to !== 'edit' && editDirty()) { S.ui.pendingGo = { to, id }; S.ui.sheet = { type: 'discard' }; render(); return; }
  if (S.screen === 'edit') { S.ui.edit = null; S.ui.editErr = {}; S.ui.editFail = ''; }
  S.screen = to;
  if (id !== undefined) S.viewId = id;
  S.ui.sheet = null; S.ui.findErr = '';
  render();
  window.scrollTo(0, 0);
}
function signIn(uid) {
  S.me = uid;
  S.ui.login = { id: '', pass: '', show: false, err: '', pending: false, note: '' };
  const to = S.ui.after || { to: 'home' };
  S.ui.after = null;
  go(to.to, to.id);
}
const digits = (v) => String(v).replace(/\D/g, '');
const normPhone = (v) => { const d = digits(v); if (/^09\d{9}$/.test(d)) return `63${d.slice(1)}`; if (/^639\d{9}$/.test(d)) return d; return null; };
// Owner, November 16, 2026: a phone is kept the way the database holds it, E.164 with no spaces ('+639175550142').
// Every phone typed is converted to that; every phone shown is grouped the same way and masked.
const toE164 = (v) => { const n = normPhone(v || ''); return n ? `+${n}` : ''; };
const maskPhone = (v) => { const d = digits(toE164(v)); return d ? `+${d.slice(0, 2)} ${d.slice(2, 5)} ••• ••${d.slice(-2)}` : v; };
const validEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
function accountFor(email) {
  const v = email.trim().toLowerCase();
  return Object.values(S.accounts).find((a) => a.claimed && a.email && a.email.toLowerCase() === v);
}
function validatePersonal(d) {
  const e = {};
  if (!d.name.trim()) e.name = 'Enter your full name.';
  else if (d.name.trim().length > 60) e.name = 'Keep your name to 60 characters or fewer.';
  if (d.nick.trim().length > 24) e.nick = 'Keep your nickname to 24 characters or fewer.';
  if (d.fav === 'other' && !String(d.favOther || '').trim()) e.favOther = 'Type the player\'s name, or pick another answer.';
  else if (String(d.favOther || '').trim().length > 40) e.favOther = 'Keep the name to 40 characters or fewer.';
  const y = String(d.expY).trim(), m = String(d.expM).trim();
  if (y && (!/^\d+$/.test(y) || +y > 80)) e.expY = 'Enter whole years from 0 to 80.';
  if (m && (!/^\d+$/.test(m) || +m > 11)) e.expM = 'Enter months from 0 to 11.';
  if (d.sinceM && d.sinceY && (+d.sinceY * 12 + (+d.sinceM - 1)) > new Date().getFullYear() * 12 + new Date().getMonth()) e.since = "Playing since can't be in the future.";
  Object.entries(SOCIAL).forEach(([k, s]) => {
    const v = String(d[k] || '').trim();
    if (!v) return;
    let ok = false;
    try { const u = new URL(v); ok = /^https?:$/.test(u.protocol) && s.hosts.some((h) => u.hostname === h || u.hostname.endsWith(`.${h}`)); } catch (err) { ok = false; }
    if (!ok) e[k] = `Enter a full ${s.label} link, like ${s.eg}.`;
  });
  return e;
}
const applyPersonal = (a, d) => Object.assign(a, { name: d.name.trim(), nick: d.nick.trim(), gender: d.gender || null, style: (d.style || '').trim(), ...gameOf(d), expY: String(d.expY).trim(), expM: String(d.expM).trim(), sinceM: d.sinceM || '', sinceY: String(d.sinceY || '').trim(), social: { facebook: d.facebook.trim(), instagram: d.instagram.trim(), youtube: d.youtube.trim(), linkedin: d.linkedin.trim() } });

function copyText(text, el) {
  const fallback = () => {
    if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast('ID selected. Copy it from your device menu.');
  };
  try { navigator.clipboard.writeText(text).then(() => toast('Player ID copied'), fallback); } catch (e) { fallback(); }
}

// The link a person opened decides the context of the registration form: a club, a session of that club, or neither (Admin link).
function setRegCtx(club, session, invite = null) {
  const x = S.ui.regCtx || {};
  if (x.club !== club || x.session !== session) S.ui.claim = null;
  S.ui.regCtx = { club, session, invite: invite && INVITES[invite] && INVITES[invite].session === session ? invite : null };
}
// What happens after the person picks an account in Google's window.
// Existing players keep email and password. Google is an extra way in, never a replacement.
// 1. Google already connected: sign in.
// 2. Not connected, but the Google email is the player's ROTRA email: ask once before connecting (P-GOOGLE-LINK).
// 3. Not connected and a different email: we can't tell whose account it is, so they sign in with their password first and connect it then.
function googleDone(ctx, g) {
  const linked = Object.values(S.accounts).find((a) => a.claimed && a.google && a.google.toLowerCase() === g.email);
  const owner = linked || Object.values(S.accounts).find((a) => a.claimed && a.email && a.email.toLowerCase() === g.email);
  if (ctx === 'connect') {
    const a = S.accounts[S.me];
    if (owner && owner.id !== a.id) { toast(`${g.email} is already used by another ROTRA account.`); return; }
    a.google = g.email; S.ui.gNudge = null; toast('Google connected'); return;
  }
  if (ctx === 'login' || ctx === 'register') {
    const x = S.ui.regCtx;
    const next = ctx === 'register' ? (x.session ? { to: 'joinSession' } : x.club ? { to: 'joinClub' } : null) : S.ui.after;
    if (linked) {
      S.ui.after = next; signIn(linked.id); toast(`Signed in with Google`); return;
    }
    if (owner) { S.ui.gLink = { id: owner.id, email: g.email, name: g.name, next }; go('gLink'); return; }
    if (ctx === 'login') { S.ui.login.gMiss = g.email; return; }
  }
  if (ctx === 'register') {
