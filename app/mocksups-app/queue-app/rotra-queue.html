<style>
/* Layout: courtside operator app. One top bar, one content column on phones; courts beside the shared queue on wide screens.
   Tokens follow apps/client globals.css (dark default, light toggleable). */
:root {
  --bg: #0b0b0c; --surface: #1a1a1d; --elev: #2a2a2e; --overlay: #3a3a3f;

  --font: "Satoshi", "Manrope", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  --r: 10px; --r-sm: 6px;
  --court: #14603f; --court-line: rgba(255, 255, 255, 0.85); --court-free: #232328; --court-free-line: rgba(255, 255, 255, 0.16);
  --shadow: none; --knob: var(--fg); --field: var(--bg);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  /* Light: white cards on a soft off-white page, a deeper green that reads as text and carries white labels (AA). */
  --bg: #f4f5f2; --surface: #ffffff; --elev: #eef0ec; --overlay: #dfe3dc;
  --fg: #121513; --fg2: #535a54; --fg3: #7a817b;
  --accent: #0a7d44; --accent-dim: #086a39; --accent-subtle: rgba(10, 125, 68, 0.09); --on-accent: #ffffff;
  --error: #c62828; --error-subtle: rgba(198, 40, 40, 0.07); --warn: #a35600; --warn-subtle: rgba(217, 119, 6, 0.09);
  --border: #e2e5df; --border-strong: #cdd2c9; --scrim: rgba(18, 21, 19, 0.4);
  --court: #2e8b57; --court-line: #ffffff; --court-free: #e8ebe5; --court-free-line: rgba(18, 21, 19, 0.14);
  --shadow: 0 1px 2px rgba(18, 24, 20, 0.05), 0 2px 8px rgba(18, 24, 20, 0.04); --knob: #ffffff; --field: #ffffff;
  color-scheme: light;
} }
:root[data-theme="light"] {
  /* Light: white cards on a soft off-white page, a deeper green that reads as text and carries white labels (AA). */
  --bg: #f4f5f2; --surface: #ffffff; --elev: #eef0ec; --overlay: #dfe3dc;
  --fg: #121513; --fg2: #535a54; --fg3: #7a817b;
  --accent: #0a7d44; --accent-dim: #086a39; --accent-subtle: rgba(10, 125, 68, 0.09); --on-accent: #ffffff;
  --error: #c62828; --error-subtle: rgba(198, 40, 40, 0.07); --warn: #a35600; --warn-subtle: rgba(217, 119, 6, 0.09);
  --border: #e2e5df; --border-strong: #cdd2c9; --scrim: rgba(18, 21, 19, 0.4);
  --court: #2e8b57; --court-line: #ffffff; --court-free: #e8ebe5; --court-free-line: rgba(18, 21, 19, 0.14);
  --shadow: 0 1px 2px rgba(18, 24, 20, 0.05), 0 2px 8px rgba(18, 24, 20, 0.04); --knob: #ffffff; --field: #ffffff;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.narrow { max-width: 760px; }

.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; min-width: 0; box-shadow: var(--shadow); }

.list { display: flex; flex-direction: column; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--fg2); white-space: nowrap; }
.chip.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-subtle); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-subtle); }

.chip.solid { background: var(--elev); color: var(--fg); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--elev); color: var(--fg2); flex: none; }

.avatar.xl { width: 64px; height: 64px; font-size: 20px; }
.avatar.xl.photo { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--border-strong); }

/* Console player grid */
.pgrid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 156px), 1fr)); gap: 12px; }

.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--surface); font-size: 14px; }
.notice.warn { border-color: var(--warn); background: var(--warn-subtle); }

.kv dt { color: var(--fg2); }

.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.empty { padding: 24px 12px; text-align: center; color: var(--fg2); font-size: 14px; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--fg2); }

.err { font-size: 13px; color: var(--error); font-weight: 600; }
.input, select.input, textarea.input { width: 100%; min-height: 44px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--field); padding: 8px 12px; }

.switch { position: relative; width: 46px; height: 28px; border-radius: 999px; background: var(--overlay); border: 0; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--knob); box-shadow: var(--shadow); transition: transform .15s; }

.choice { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--bg); cursor: pointer; min-width: 0; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-subtle); }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px; }

/* Console */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 700; color: var(--fg2); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.conn-short, .tw-short { display: none; }
.field-row { flex-wrap: nowrap; }
.field-row > .btn { white-space: nowrap; }
/* Phones: nothing scrolls sideways. Tabs share the width, action rows become tidy two-column grids, long lines stack. */
@media (max-width: 640px) {
  .tabs { display: grid; grid-template-columns: repeat(auto-fit, minmax(64px, 1fr)); overflow: visible; gap: 0; }
  .tabs button { flex-direction: column; justify-content: center; gap: 3px; padding: 9px 4px; font-size: 13px; white-space: normal; text-align: center; line-height: 1.2; }

  .acts > .btn { width: 100%; }

  .past-li { flex-wrap: wrap; row-gap: 8px; }

}
@media (max-width: 480px) {

  .brand span { display: none; }
  .conn-full { display: none; }
  .conn-short { display: inline; }
  .conn { max-width: none; }
}
.console { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.console > [data-pane]:not(.on) { display: none; }
.live-sec + .live-sec { border-top: 1px solid var(--border); padding-top: 20px; }
.pcard2.long { border-color: var(--warn); }
.pcard2 .rest { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
.pcard2 .rest b { font-size: 26px; font-weight: 800; }

.pcard2 .stats > div { display: flex; flex-direction: column; padding: 6px 8px; border-radius: var(--r-sm); background: var(--bg); }
.pcard2 .stats b { font-size: 16px; font-weight: 700; }
.pcard2 .stats span { font-size: 11px; color: var(--fg2); }
select.input.inline { width: auto; min-height: 42px; }
.courts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 12px; }
.court { display: flex; flex-direction: column; gap: 10px; border-radius: var(--r); padding: 14px; border: 1px solid var(--border-strong); background: var(--surface); min-height: 180px; min-width: 0; box-shadow: var(--shadow); }
.court.busy { border-color: var(--accent); background: linear-gradient(180deg, var(--accent-subtle), transparent 70%), var(--surface); }
.court .ct { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.court.add-court:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-subtle); }

const perCourtOf = (s) => s.perCourt || S.club.perCourt || 8;

// First come, first served when a prepared session's slot budget changes: if it shrinks, the most recently

function rebalanceSlots(s) {

    s.roster = s.roster.slice(0, cap);
    s.waitlist = [...out.map((r, i) => ({ pid: r.pid, level: r.level, at: first - (out.length - i) })), ...(s.waitlist || [])];
    return { moved: out.length, filled: 0 };
  }
  const take = waitOf(s).slice(0, openSlots(s));
  take.forEach((w) => { s.roster.push({ pid: w.pid, level: w.level, present: false, locked: false, presentAt: Date.now() }); });

// Minimum-games estimate: courts that can actually be filled × games that fit in the time (15–20 min each)
// × players per game, shared across the roster. The 20-minute end becomes the minimum so it stays reachable.
// Players on court per game: doubles 4, singles 2. With both on, generation runs about 2 doubles to 1 singles.
const perGameOf = (o) => (o.doubles && o.singles ? 10 / 3 : o.singles ? 2 : 4);

function estimateGames(courts, minutes, players, perGame) {
  const n = Math.max(1, players || 1);
  const usable = Math.max(1, Math.min(courts, Math.floor(n / perGame)));
  const at = (len) => Math.floor((usable * Math.floor(minutes / len) * perGame) / n);
  return { low: at(20), high: at(15), usable };
}

// Dashboard "now" card: one unmistakable state. Live gets a filled pulsing LIVE NOW badge, an accent edge and
// live numbers; upcoming gets an outlined UPCOMING badge with a countdown and preparation numbers.
const untilText = (t) => {
  const m = Math.round((t - Date.now()) / 60000);
  if (m <= 0) return m > -15 ? 'Starting now' : `Was due ${fmtTime(t)} · not started`;
  if (m < 60) return `Starts in ${m} min`;
  const d = new Date(t), today = new Date(); const days = Math.round((new Date(d).setHours(0, 0, 0, 0) - today.setHours(0, 0, 0, 0)) / 864e5);
  if (days === 0) return `Starts in ${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ''}`;
  return days === 1 ? `Tomorrow, ${fmtTime(t)}` : `In ${days} days · ${fmtDate(t)}`;
};
function nowCard(act, prepared) {

  if (act) {

    const left = act.end - Date.now();
    const nextUp = soon[0];

        <div class="now-stats">${stat(`${inUse}/${act.courts.length}`, 'courts in use')}${stat(act.matches.filter((m) => m.status === 'done').length, 'games played')}${stat(`${act.roster.filter((r) => r.present).length}/${act.roster.length}`, 'players present')}${stat(waiting(act).length, 'queued')}</div></div>
      <div class="now-actions"><button class="btn primary" data-act="go" data-to="console" data-id="${act.id}">Continue session</button>${nextUp ? `<span class="small muted">Up next: ${esc(nextUp.title)} · ${fmtDate(nextUp.start)}</span>` : ''}</div>

  return `<section class="now-card next" aria-label="Upcoming session">

const peso = (v) => `₱${Math.round(v || 0).toLocaleString()}`;
function financeCalc(f, courtsN, durMins, players) {
  const hours = durMins / 60;
  const court = (+f.courtFee || 0) * courtsN * hours;
  const lines = (f.shuttles || []).map((x) => { const it = S.inventory.find((i) => i.id === x.itemId); return it ? { it, tubes: +x.tubes || 0, cost: (+x.tubes || 0) * it.cost } : null; }).filter(Boolean);
  const shuttle = lines.reduce((t, l) => t + l.cost, 0);
  const n = Math.max(1, players || 1);
  // The entrance fee is a misc per-head cost some venues charge, listed for transparency; it is part of the cost, not the payment.
  const entryFee = f.entryFee === '' || f.entryFee == null ? 0 : +f.entryFee || 0, entry = entryFee * n;
  const total = court + shuttle + entry;
  const share = Math.ceil(total / n);
  // Players pay the full amount per head: the break-even share by default, or a custom amount the club sets.
  const custom = !!f.custom, perHead = custom ? (+f.payFee || 0) : share, collect = perHead * n;
  return { hours, court, shuttle, entryFee, entry, total, share, custom, perHead, collect, diff: collect - total, lines, n };
}
function resultText(c) {
  if (!c.total) return 'No costs entered';
  if (!c.custom && c.diff > 0) return `Breaks even <span class="small muted">· ${peso(c.diff)} extra from rounding up</span>`;
  if (c.diff > 0) return `<span style="color:var(--accent)">${peso(c.diff)} profit</span>`;
  if (c.diff < 0) return `<span style="color:var(--warn)">${peso(-c.diff)} loss</span>`;
  return 'Breaks even';
}

  const f = s && s.finance;

  const tubes = s ? Math.max(1, Math.round((s.courts.length * ((s.end - s.start) / 3600e3)) / 1.5)) : 3;
  // A club default entrance fee per head fills in new sessions; it stays editable per session. Payment starts at break-even.
  const fee = S.club.entranceFee;
  return { courtFee: '', entryFee: fee != null ? fee : '', custom: false, payFee: '', shuttles: first ? [{ itemId: first, tubes }] : [] };
}

// The club writes one template with {{ keys }}; each session fills it in. Unknown keys are left as typed.
const DEFAULT_POST = `@everyone

{{ club_name }} {{ day }} queue
{{ club_description }}

where: {{ where }}
when: {{ when }}

{{ x_courts }} courts:
{{ courts }}

{{ tube_count }} tubes and brand
{{ x_tubes }}

Players
{{ players }}

Waitlist:
{{ waitlist }}

{{ court_rules }}`;
const DEFAULT_RULES = 'Court rules:\n• Non-marking shoes only\n• Be ready within 2 minutes when your match is called\n• Winner-only scoring is fine; tell the Queue Master the result';
const POST_KEYS = [
  ['club_name', 'Club name'], ['club_description', 'Club description'], ['title', 'Session title'], ['day', 'Weekday, e.g. Sunday'], ['date', 'Date'],
  ['where', 'Venue and address'], ['when', 'Date and time'], ['x_courts', 'Courts reserved (number)'], ['courts', 'Court names, one per line'],
  ['tube_count', 'Total tubes'], ['x_tubes', 'Tubes per brand'], ['player_count', 'Number of players'], ['players', 'Numbered player list'],
  ['waitlist', 'Waitlist'], ['mode', 'Mode'], ['minimum', 'Minimum games'], ['fee_per_head', 'Payment per player'], ['entrance_fee', 'Entrance fee'], ['court_rules', 'Court rules'],
];
const POST_TABS = [['tpl', 'Template'], ['desc', 'Club description'], ['rules', 'Court rules']];
const postTemplate = () => (S.club.postTemplate != null ? S.club.postTemplate : DEFAULT_POST);
function postValues(s) {
  const lines = (s.finance && s.finance.shuttles || []).map((x) => ({ x, it: S.inventory.find((i) => i.id === x.itemId) })).filter((l) => l.it);
  const tubes = lines.reduce((t, l) => t + (+l.x.tubes || 0), 0);
  const start = new Date(s.start);
  return {
    club_name: S.club.name,
    club_description: S.club.description != null ? S.club.description : '',
    title: s.title,
    day: start.toLocaleDateString([], { weekday: 'long' }),
    date: start.toLocaleDateString([], { month: 'long', day: 'numeric', year: 'numeric' }),
    where: `${s.venue}${s.address ? `, ${s.address}` : ''}`,
    when: `${start.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' })} · ${fmtTime(s.start)}–${fmtTime(s.end)}`,
    x_courts: String(s.courts.length),
    courts: s.courts.map((c) => c.label).join('\n'),
    court_count: String(s.courts.length), // older name for x_courts, still filled in
    tube_count: String(tubes),
    x_tubes: lines.length ? lines.map((l) => `${l.x.tubes} × ${l.it.name}`).join('\n') : 'To be announced',
    player_count: String(s.roster.length),
    players: s.roster.length ? s.roster.map((r, i) => { const p = P(r.pid); return `${i + 1}. ${p.name}${p.nick ? ` (${p.nick})` : ''}`; }).join('\n') : 'No players yet',
    waitlist: (s.waitlist || []).length ? waitOf(s).map((w, i) => `${i + 1}. ${P(w.pid).name}`).join('\n') : `None yet. ${openSlots(s)} slot${openSlots(s) === 1 ? '' : 's'} left.`,
    mode: `${MODES[s.mode].label} (${MODES[s.mode].text.replace(/\.$/, '')})`,
    minimum: `${s.minimum} games per player`,
    fee_per_head: duePerHead(s) ? `${peso(duePerHead(s))} per head` : 'Free',
    entrance_fee: s.finance && s.finance.entryFee ? `${peso(s.finance.entryFee)} per head (included)` : 'None',
    court_rules: S.club.courtRules != null ? S.club.courtRules : DEFAULT_RULES,
  };
}
const fillPost = (tpl, s) => { const v = postValues(s); return tpl.replace(/\{\{\s*(\w+)\s*\}\}/g, (m, k) => (k in v ? v[k] : m)); };
const postSample = () => cur() && cur().status !== 'invalid' && cur().status !== 'finalized' ? cur() : S.sessions.filter((x) => x.status === 'prepared' || x.status === 'active').sort((a, b) => a.start - b.start)[0] || S.sessions[0];

// Waitlist panel, shared by preparation and the live Players view.
// Slots used against the budget, so the operator sees how many more fit before the waitlist starts.
// How the club's level compares with the Player Information suggestion: higher (may be too high), lower (may be too low), or the same.
function levelDiff(level, sugg, id) {
  if (level == null || level === '' || sugg == null) return '';
  const d = +level - sugg, n = Math.abs(d);
  if (!d) return `<span class="lv-diff same" id="${id}">${I.check} Matches suggestion</span>`;
  return `<span class="lv-diff ${d > 0 ? 'up' : 'down'}" id="${id}"><b aria-hidden="true">${d > 0 ? '▲' : '▼'}</b> ${d > 0 ? 'May be too high' : 'May be too low'} · ${n} level${n > 1 ? 's' : ''} ${d > 0 ? 'above' : 'below'} suggestion</span>`;
}
// Session link and guest join requests. The public session page doubles as the invite link: guests read the details

    <div class="invite-link"><input class="input" id="session-link-in" readonly value="${sessionLink(s)}" aria-label="Session link"><button class="btn sm primary" data-act="copyLink">Copy link</button></div>

    <div class="li" style="padding:0"><div class="main"><b>Accept join requests</b><p class="small muted">${on ? 'Guests can request a slot from the public page.' : 'The public page says to contact the Queue Master instead.'}</p></div>${sw(on, 'toggleAcceptReq', '', 'Accept join requests')}</div>
  </section>`;
}
function requestsPanel(s, inSheet) {
  const list = pendingReqs(s), done = (s.requests || []).filter((r) => r.status !== 'pending');
  const full = openSlots(s) === 0;
  if (!list.length) return `<section class="${inSheet ? '' : 'card '}stack" id="join-requests"><h2>Join requests</h2><p class="small muted">No requests waiting.${done.length ? ` ${done.filter((r) => r.status === 'confirmed').length} confirmed, ${done.filter((r) => r.status === 'declined').length} declined so far.` : ' Guests who open the session link can ask for a slot; they show up here.'}</p></section>`;
  return `<section class="${inSheet ? '' : 'card '}stack" id="join-requests"><div><h2>Join requests · ${list.length}</h2><p class="small muted">Check each one is a real person you expect (ask at the door, or match their name and phone) before confirming. Oldest first.${full ? ' Slots are full, so confirmed guests go on the waitlist.' : ''}</p></div>

function joinCard(s) {

      : ['ok', 'Confirmed · you have a slot', 'See you on court. Your name is now in Participants.'];

  return `<main class="wrap">
    <div class="crumb"><button class="btn sm ghost" data-act="go" data-to="home">${I.back} Home</button></div>
    <div class="between"><div class="stack tight"><span class="label">Preparation</span><h1>${esc(s.title)}</h1><p class="muted">${fmtDate(s.start)} · ${fmtTime(s.start)}–${fmtTime(s.end)} · ${esc(s.venue)}</p></div>
      <div class="row acts"><button class="btn sm" data-act="editSetup">Edit preparation</button><button class="btn sm" data-act="go" data-to="public">Preview public page</button><button class="btn sm" data-act="openPost">Copy Facebook post</button></div></div>
    ${pendingReqs(s).length ? requestsPanel(s) : ''}
    ${(() => {
      const tab = ['overview', 'roster', 'waitlist', 'payments'].includes(S.ui.prepTab) ? S.ui.prepTab : 'overview';
      const paidN = Object.keys(s.payments || {}).filter((pid) => R(s, pid)).length;
      const tabs = [['overview', 'Overview', null], ['roster', 'Roster and levels', `${s.roster.length}/${capacityOf(s)}`], ['waitlist', 'Waitlist', (s.waitlist || []).length], ['payments', 'Payments', `${paidN}/${s.roster.length} paid`]];
      return `<div class="tabs" role="tablist" aria-label="Preparation">${tabs.map(([k, l, n]) => `<button role="tab" id="ptb-${k}" aria-selected="${tab === k}" aria-controls="prep-panel" data-act="prepTab" data-k="${k}">${l}${n != null ? ` <span class="chip">${n}</span>` : ''}</button>`).join('')}</div>
      <div id="prep-panel" role="tabpanel" aria-labelledby="ptb-${tab}" class="stack">${tab === 'overview' ? prepOverview(s) : tab === 'waitlist' ? waitlistPanel(s) : tab === 'payments' ? paymentsPanel(s) : `<section class="card stack">
      <div class="between"><div><h2>Roster and levels</h2><p class="small muted">Confirm each player's slot and set their level for this club. Levels lock when the session starts.</p></div>
        <div class="row acts">${s.roster.some((r) => !r.present) ? '<button class="btn sm" data-act="allPresent">Mark all present</button>' : ''}${s.roster.some((r) => r.present) ? '<button class="btn sm" data-act="allAbsent">Mark all absent</button>' : ''}<button class="btn sm primary" data-act="openAdd">Add player</button></div></div>
      ${slotMeter(s)}
      ${missing ? notice('warn', `${missing} player${missing > 1 ? 's need' : ' needs'} a level before the session can start.`) : ''}
      ${s.roster.length ? `<div class="list">${s.roster.map((r) => { const p = P(r.pid); return `<div class="prow">
        <div class="li" style="padding:0">${faceBtn(p)}<div class="main"><div class="pn"><b>${esc(p.name)}</b></div><div class="row" style="gap:6px">${identChip(p)}<span class="small muted">${p.sugg != null ? `Suggestion: ${esc(lvLabel(p.sugg))}` : 'No suggestion'}</span></div></div></div>
        <div class="lvcol">${selectLevel(`lv-${r.pid}`, r.level, `data-act-change="setLevel" data-pid="${r.pid}" aria-label="Level for ${esc(p.name)} at this club" aria-describedby="lvd-${r.pid}"`, r.level == null)}${levelDiff(r.level, p.sugg, `lvd-${r.pid}`)}</div>
        <div class="row" style="flex-wrap:nowrap"><span class="small muted">Present</span>${sw(r.present, 'togglePresent', `data-pid="${r.pid}"`, `${p.name} present`)}<button class="btn xs ghost icon-btn" data-act="removeRoster" data-pid="${r.pid}" aria-label="Remove ${esc(p.name)} from roster">${I.x}</button></div>
      </div>`; }).join('')}</div>` : '<div class="empty">No players yet. Add players from your saved list or as new guests.</div>'}
    </section>`}</div>`;
    })()}
  </main>
  <div class="footer-bar ${cantStart ? 'dock-note' : 'dock-dup'}"><div class="in">
    <span class="small ${cantStart ? 'start-why' : 'muted'}">${other ? `${esc(other.title)} is already running. One session at a time. <button class="btn xs" data-act="go" data-to="console" data-id="${other.id}">Open ${esc(other.title)}</button>`
      : S.licenseExpired ? 'Your license has ended, so new sessions can’t start.'
      : !S.online && s.download !== 'ready' ? 'No downloaded copy on this device. Connect, or download first.'
      : missing ? `${missing} player${missing > 1 ? 's need' : ' needs'} a level before you can start.`
      : `${s.roster.length} players · ${present} present. Starting locks levels; no match starts by itself.`}</span>
    <button class="btn primary" data-act="openStart" ${cantStart ? 'disabled' : ''}>Start session</button>
  </div></div>`;
}

// ---------- Q-CONSOLE ----------
function viewConsole() {
  const s = cur();
  if (!s || s.status !== 'active') { S.screen = 'home'; return viewHome(); }
  const att = attention(s).length;
  const pane = S.ui.pane;
  return `<main class="wrap">
    <div class="between">
      <div class="stack tight"><div class="row"><span class="label">Live session</span>${chip(MODES[s.mode].label)}${chip(fmtFormats(s))}${chip(`Min ${s.minimum} games`)}</div>
        <h1>${esc(s.title)}</h1><p class="muted small">${esc(s.venue)} · Started ${fmtTime(s.startedAt)} · Ends ${fmtTime(s.end)}</p></div>
      <div class="row acts"><button class="btn sm" data-act="go" data-to="home">Home</button><button class="btn sm" data-act="go" data-to="public">Public page</button><button class="btn sm" data-act="openPost">Copy Facebook post</button><button class="btn sm" data-act="openPayments">Payments</button><button class="btn sm" data-act="openAdjust">Extend time</button>${pendingReqs(s).length ? `<button class="btn sm primary" data-act="openRequests">Join requests · ${pendingReqs(s).length}</button>` : ''}</div>
    </div>
    ${!S.online ? notice('warn', 'Working offline on this device. Matches, results and roster changes save here and sync when you reconnect. Session done needs internet.') : ''}
    <div class="tabs" role="tablist" aria-label="Console views">
      ${[
        ['live', `Session <span class="chip">${active(s).reduce((t, m) => t + m.courts.length, 0)}/${s.courts.length}<span class="tw"> courts in use</span></span>`],
        ['queue', `Queue <span class="chip">${waiting(s).length}<span class="tw"> waiting</span></span>${att ? ` <span class="chip warn">${att}<span class="tw"> need attention</span></span>` : ''}`],
        ['roster', `Players <span class="chip">${s.roster.filter((r) => r.present).length}/${s.roster.length}<span class="tw"> present</span></span>`],
        ['board', `<span class="tw-long">Leaderboard</span><span class="tw-short">Board</span>${s.matches.some((m) => m.status === 'done') ? ` <span class="chip">${esc(short((standings(s)[0] || {}).pid))} leads</span>` : ''}`],
      ].map(([k, l]) => `<button role="tab" aria-selected="${(['queue', 'roster', 'board'].includes(pane) ? pane : 'live') === k}" data-act="pane" data-k="${k}">${l}</button>`).join('')}
    </div>
    ${pane === 'roster' ? `<section class="stack" aria-label="Players">${playersPane(s)}</section>`
      : pane === 'queue' ? `<section class="stack" aria-label="Queued matches">${queuePane(s)}</section>`
      : pane === 'board' ? `<section class="stack" aria-label="Leaderboard">${boardPane(s)}</section>`
      : `<section class="stack live-sec" aria-label="Courts">${courtsPane(s)}</section>
      <section class="stack live-sec" aria-label="Upcoming queued matches">${upcomingPane(s)}</section>`}
  </main>
  <div class="footer-bar dock-dup"><div class="in">
    <span class="small muted tnum">${s.matches.filter((m) => m.status === 'done').length} games recorded · ${active(s).length} in play · ${waiting(s).length} waiting</span>
    <div class="row">${!S.online ? '<span class="small muted">Connect to finish and sync this session.</span>' : ''}<button class="btn sm" data-act="openSessionDone" ${!S.online ? 'disabled' : ''}>Session done</button></div>
  </div></div>`;
}

// Badminton court drawn to real proportions (13.4 m × 6.1 m), net in the middle. n courts stack so a
// two-court 5v5 reads as one merged playing area with a single long net.
function courtSVG(n) {
  const one = (y) => `<g transform="translate(0 ${y})"><rect width="134" height="61" fill="var(--court-c)"/>
    <g fill="none" stroke="var(--court-l)" stroke-width="1.5" vector-effect="non-scaling-stroke"><rect x="0.75" y="0.75" width="132.5" height="59.5" vector-effect="non-scaling-stroke"/><path d="M0 4.6H134M0 56.4H134M7.6 0V61M126.4 0V61M47.2 0V61M86.8 0V61M0 30.5H47.2M86.8 30.5H134" vector-effect="non-scaling-stroke"/></g></g>`;
  return `<svg class="court-svg" viewBox="0 0 134 ${61 * n}" preserveAspectRatio="none" aria-hidden="true">${Array.from({ length: n }, (_, i) => one(i * 61)).join('')}
    <path d="M67 0V${61 * n}" stroke="var(--court-l)" stroke-width="3" stroke-dasharray="4 3" vector-effect="non-scaling-stroke"/></svg>`;
}
function courtSides(s, m) {
  // Players stack down each side of the net (P1 over P2 | P3 over P4); bigger fun teams wrap into a second column.
  const side = (ids, team) => `<div class="side n${Math.min(ids.length, 5)}" style="--rows:${ids.length <= 2 ? ids.length : ids.length <= 4 ? 2 : 3}" role="group" aria-label="Team ${team}">${ids.map((pid) => {
    const p = P(pid), r = R(s, pid);
    return `<button class="pf" data-act="openProfile" data-id="${pid}" title="${esc(p.name)} · ${esc(lvLabel(r ? r.level : null))}" aria-label="${esc(p.name)}, Team ${team}. View profile">${avatar(p)}<span class="pf-n">${esc(short(pid))}</span></button>`;
  }).join('')}</div>`;
  return `<div class="sides">${side(m.teamA, 'A')}${side(m.teamB, 'B')}</div>`;
}
function courtsPane(s) {
  const list = waiting(s);
  const skip = new Set();
  const cards = s.courts.map((c) => {
    if (skip.has(c.id)) return '';
    const m = active(s).find((x) => x.courts.includes(c.id));
    if (m) {
      const mins = Math.max(0, Math.round((Date.now() - m.startedAt) / 60000));
      const merged = m.courts.length > 1;
      m.courts.forEach((x) => { if (x !== c.id) skip.add(x); });
      const subs = (m.subs || []).length;
      return `<div class="court busy ${merged ? 'merged' : ''}"><div class="ct"><div><h3>${esc(merged ? courtsOf(s, m) : c.label)}</h3><span class="small muted">Until ${fmtTime(courtUntil(s, c))}</span></div>${chip(merged ? 'Merged · in game' : 'In game', 'ok')}</div>
        <div class="pitch ${merged ? 'tall' : ''}" role="img" aria-label="${esc(`Team A ${listNames(m.teamA)} versus Team B ${listNames(m.teamB)}`)}">${courtSVG(merged ? 2 : 1)}${courtSides(s, m)}</div>
        <p class="small muted">${FORMAT_LABEL[m.format]} · Match ${m.seq} · ${mins} min${subs ? ` · ${subs} substitution${subs > 1 ? 's' : ''}` : ''}</p>
        <div class="row" style="margin-top:auto"><button class="btn sm primary" data-act="openMatch" data-id="${m.id}">Open match</button></div></div>`;
    }
    const eligible = list.find((x) => !blockOf(s, x));
    const first = list[0];
    let body;
    if (eligible) {
      body = `${first && first.id !== eligible.id ? `<p class="small muted">Skipped #1: ${esc(blockOf(s, first).text)}.</p>` : ''}
        <p class="small"><span class="muted">Next eligible:</span> #${list.indexOf(eligible) + 1} · ${FORMAT_LABEL[eligible.format]}</p>
        <p class="small">${esc(listNames(eligible.teamA))} <span class="muted">vs</span> ${esc(listNames(eligible.teamB))}</p>
        <div class="row" style="margin-top:auto"><button class="btn sm primary" data-act="openDispatch" data-id="${eligible.id}" data-court="${c.id}">Review and start</button>${list.length > 1 ? `<button class="btn sm" data-act="openChooseMatch" data-court="${c.id}">Pick another</button>` : ''}</div>`;
    } else {
      body = `<p class="small muted">${list.length ? `No waiting match can start: ${esc(blockOf(s, first).text)}.` : 'The queue is empty.'}</p>
        <div class="row" style="margin-top:auto"><button class="btn sm" data-act="openEditor">Add match</button></div>`;
    }
    const over = Date.now() > courtUntil(s, c);
    return `<div class="court"><div class="ct"><div><h3>${esc(c.label)}</h3><span class="small ${over ? '' : 'muted'}" style="${over ? 'color:var(--warn)' : ''}">${over ? 'Booking ended' : 'Until'} ${fmtTime(courtUntil(s, c))}</span></div><div class="row" style="gap:6px;flex-wrap:nowrap">${chip('Free')}<button class="btn xs ghost" data-act="removeCourt" data-id="${c.id}" aria-label="Remove ${esc(c.label)}" ${s.courts.length <= 1 ? 'disabled title="A session needs at least one court"' : ''}>${I.x} Remove</button></div></div><div class="pitch empty">${courtSVG(1)}<span class="free-lbl">Free</span></div>${body}</div>`;
  }).join('');
  return `<div class="between"><h2>Courts</h2><span class="small muted">${freeCourts(s).length} of ${s.courts.length} free</span></div>
    <div class="courts">${cards}<button class="court add-court" data-act="quickAddCourt" aria-label="Add Court ${s.courts.length + 1}"><span class="plus" aria-hidden="true">+</span><span>Add court</span><span class="small muted" style="font-weight:500">Becomes Court ${s.courts.length + 1}, free right away</span></button></div>
    <p class="small muted">A match never starts by itself when a court frees up. You start each one.</p>`;
}

function queuePane(s) {
  const list = waiting(s);
  const att = attention(s).length;
  return `<div class="between"><h2>Queued matches</h2><div class="row acts"><button class="btn sm" data-act="openEditor">Add match</button><button class="btn sm" data-act="openSuggest">Suggest</button><button class="btn sm" data-act="openAuto">Auto queue</button><button class="btn sm ${att ? 'primary' : ''}" data-act="openRegen" ${list.length ? '' : 'disabled'}>Regenerate</button></div></div>
    ${att ? notice('warn', `${att} waiting match${att > 1 ? 'es need' : ' needs'} attention. Edit the lineup to swap the player, or regenerate.`) : ''}
    <p class="small muted">One waiting list for every court. ${MODES[s.mode].label} mode guides suggestions; you can override any of it.</p>
    ${list.length ? `<p class="small muted">Order runs in a snake: left to right, then back right to left on the next row. Drag a card by ⠿ to reorder (arrow keys work on the handle too). Drag a player onto someone on the other team to switch sides. Any card marked ready can start now, whatever its place.</p>
    <div class="qgrid" style="grid-template-columns:repeat(${queueCols()}, minmax(0, 1fr))">${list.map((m, i) => queueCard(s, m, i, list.length, queueCols())).join('')}</div>`
      : `<div class="card empty">No waiting matches. Use Auto queue to generate a few, or add one yourself.</div>`}`;
}
// One row of the next queued matches on the Session tab; the last tile opens the full Queue tab.
function upcomingPane(s) {
  const list = waiting(s);
  const cols = queueCols();
  const shown = list.slice(0, Math.max(1, cols - 1));
  const rest = list.length - shown.length;
  const att = attention(s).length;
  return `<div class="between"><h2>Upcoming queued matches</h2><span class="small muted">${list.length} waiting${att ? ` · <span style="color:var(--warn)">${att} need attention</span>` : ''}</span></div>
    <div class="qgrid" style="grid-template-columns:repeat(${cols}, minmax(0, 1fr))">
      ${shown.length ? shown.map((m, i) => queueCard(s, m, i, list.length, cols)).join('') : `<div class="card empty" style="grid-column:span ${Math.max(1, cols - 1)}">No matches queued yet.</div>`}
      <button class="qtile qmore" data-act="pane" data-k="queue" aria-label="More queues: open the Queue tab"><span class="plus" aria-hidden="true">→</span><b>More queues</b><span class="small muted">${rest > 0 ? `+${rest} more waiting` : list.length ? 'Reorder, add or regenerate' : 'Add or generate matches'}</span></button>
    </div>`;
}
function queueCols() { const w = window.innerWidth; return w >= 1200 ? 5 : w >= 960 ? 4 : w >= 700 ? 3 : w >= 460 ? 2 : 1; }
function queueCard(s, m, i, n, cols) {
  const b = blockOf(s, m);
  const row = Math.floor(i / cols), k = i % cols, col = row % 2 === 0 ? k : cols - 1 - k;
  const flow = i === n - 1 ? '' : (k === cols - 1 ? '↓' : row % 2 === 0 ? '→' : '←');
  const status = !b ? `<span class="status-line ok">${I.check} Ready to start</span>`
    : b.kind === 'attention' ? `<span class="status-line warn">${I.alert} ${esc(b.text)}</span>`
    : `<span class="status-line muted">${I.info} ${esc(b.text)}</span>`;
  const faces = (ids, team) => `<div class="qfaces">${ids.map((p, j) => `<button class="qf" data-act="openProfile" data-id="${p}" data-swap="m:${m.id}" data-team="${team}" data-i="${j}" data-pid="${p}" title="${esc(nm(p))} · ${esc(lvLabel(R(s, p) ? R(s, p).level : null))} · drag onto the other team to switch sides" aria-label="${esc(nm(p))}. View profile. Left or right arrow switches sides">${avatar(P(p))}<span class="qf-n">${esc(short(p))}</span></button>`).join('')}</div>`;
  return `<article class="qtile ${b && b.kind === 'attention' ? 'attn' : ''} ${!b ? 'ready' : ''}" data-qid="${m.id}" style="grid-row:${row + 1};grid-column:${col + 1}" aria-label="Queue position ${i + 1}">
    <div class="qt-head"><span class="qt-pos">#${i + 1}</span>${chip(FORMAT_LABEL[m.format], 'solid')}${m.protected ? `<span class="muted" title="Manual · protected from regeneration">${I.lock}</span>` : `<span class="small muted">${m.origin === 'suggested' ? 'Suggested' : 'Auto'}</span>`}<span class="grow"></span><span class="qt-flow" aria-hidden="true">${flow}</span><button class="qt-grip" data-drag-handle data-id="${m.id}" aria-label="Reorder match ${i + 1}: drag, or use the arrow keys" title="Drag to reorder">⠿</button></div>
    ${faces(m.teamA, 'teamA')}<div class="vs">VS</div>${faces(m.teamB, 'teamB')}
    ${status}
    <div class="row qt-actions">
      <button class="btn xs ${!b ? 'primary' : ''}" data-act="openDispatch" data-id="${m.id}" ${b ? 'disabled' : ''}>Start</button>
      <button class="btn xs" data-act="openEditor" data-id="${m.id}">Edit</button>
      <span class="grow"></span>
      <button class="btn xs ghost icon-btn" data-act="removeWaiting" data-id="${m.id}" aria-label="Remove waiting match ${i + 1}" title="Remove">${I.x}</button>
    </div>
  </article>`;
}
function playersPane(s) {
  const f = { show: 'avail', sort: 'wait', ...(S.ui.pl || {}) };
  const sel = (S.ui.sel || []).filter((pid) => R(s, pid));
  const w = waiting(s);
  let rows = s.roster.map((r) => {
    const a = activeOf(s, r.pid);
    const qi = w.findIndex((m) => all(m).includes(r.pid));
    return { r, p: P(r.pid), a, g: gamesOf(s, r.pid), ...restInfo(s, r.pid), qpos: qi < 0 ? null : qi + 1 };
  });
  if (f.show === 'avail') rows = rows.filter((x) => x.r.present && !x.a);
  if (f.show === 'present') rows = rows.filter((x) => x.r.present);
  const sorters = {
    wait: (a, b) => (a.a ? 1 : 0) - (b.a ? 1 : 0) || (b.r.present ? 1 : 0) - (a.r.present ? 1 : 0) || b.mins - a.mins,
    least: (a, b) => a.g - b.g || b.mins - a.mins,
    most: (a, b) => b.g - a.g || a.p.name.localeCompare(b.p.name),
    level: (a, b) => (b.r.level ?? -1) - (a.r.level ?? -1) || a.p.name.localeCompare(b.p.name),
  };
  rows.sort(sorters[f.sort] || sorters.wait);
  const counts = { avail: s.roster.filter((r) => r.present && !activeOf(s, r.pid)).length, present: s.roster.filter((r) => r.present).length, all: s.roster.length };
  const plan = matchPlan(s, sel);
  return `<div class="between"><div><h2>Players</h2><p class="small muted">Tap players to pick them, then make a match. ${counts.present} present of ${counts.all}.</p></div><button class="btn sm" data-act="openAdd">Add late player</button></div>
    <div class="row" style="gap:10px">
      <div class="seg" role="group" aria-label="Show">${[['avail', `Available · ${counts.avail}`], ['present', `Present · ${counts.present}`], ['all', `Everyone · ${counts.all}`]].map(([k, l]) => `<button aria-pressed="${f.show === k}" data-act="plSet" data-k="show" data-v="${k}">${l}</button>`).join('')}</div>
      <select class="input inline" id="pl-sort" data-act-change="plSet" data-k="sort" aria-label="Sort players">${[['wait', 'Sort: longest wait'], ['least', 'Sort: least games'], ['most', 'Sort: most games'], ['level', 'Sort: level, high to low']].map(([v, l]) => `<option value="${v}" ${f.sort === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>
    ${rows.length ? `<div class="pgrid3">${rows.map((x) => {
      const i = sel.indexOf(x.r.pid);
      const st = x.a ? `On ${courtsOf(s, x.a)}` : !x.r.present ? 'Away' : x.qpos ? `Queued · #${x.qpos}` : 'Free';
      return `<article class="pc3 ${x.a ? 'playing' : ''} ${x.r.present ? '' : 'away'}" role="button" tabindex="0" data-act="selPlayer" data-pid="${x.r.pid}" aria-pressed="${i >= 0}" aria-label="${esc(x.p.name)}, ${esc(lvLabel(x.r.level))}, ${x.g} games">
        ${i >= 0 ? `<span class="sel-badge" aria-hidden="true">${i + 1}</span>` : ''}
        <div class="pc3-top">${avatar(x.p)}<div style="min-width:0"><div class="pc3-name">${esc(x.p.name)}</div><div class="pc3-lv">${esc(lvLabel(x.r.level))}</div></div></div>
        <div class="pc3-stats"><span class="tnum">${x.g}/${s.minimum} games</span>${x.a || !x.r.present ? '' : `<span class="tnum">${x.mins} min wait</span>`}</div>
        <div class="between" style="flex-wrap:nowrap"><span class="pc3-st small">${st}</span>${sw(x.r.present, 'togglePresent', `data-pid="${x.r.pid}"`, `${x.p.name} present`)}</div>
      </article>`;
    }).join('')}</div>` : `<div class="card empty">${f.show === 'avail' ? 'No one is free right now. Try Present or Everyone.' : 'No players yet.'}</div>`}
    ${sel.length ? `<div class="selbar" role="region" aria-label="Selected players">
      <div class="row" style="gap:6px;flex-wrap:nowrap;min-width:0"><span class="sel-faces">${sel.map((pid) => avatar(P(pid))).join('')}</span><span class="small"><b>${sel.length} selected</b> · ${esc(plan.label)}</span></div>
      <div class="row" style="flex-wrap:nowrap"><button class="btn sm ghost" data-act="selClear">Clear</button><button class="btn sm primary" data-act="makeMatch" ${plan.ok ? '' : 'disabled'}>Make match</button></div></div>` : ''}
    ${(s.waitlist || []).length || !openSlots(s) ? waitlistPanel(s) : ''}
    <p class="small muted">Make match splits the players into teams balanced by level and adds it to the end of the queue. Present controls who can be paired automatically; turning someone off never ends their current game.</p>`;
}
function boardPane(s) {
  const st = standings(s);
  return `<div><h2>Leaderboard</h2><p class="small muted">Tonight's standings from completed games: most wins, then fewest losses, then head-to-head. It updates each time you confirm a result. Partial and invalid games don't count.</p></div>

        <td><div class="lb-p">${faceBtn(p)}<div style="min-width:0"><b>${esc(p.name)}</b><div class="small muted">${esc(lvLabel(lv ? lv.level : null))}</div></div></div></td>

    </tbody></table></div>` : '<div class="card empty">No completed games yet. Standings appear after the first confirmed result.</div>'}`;
}
function matchPlan(s, sel) {
  const fmt = { 2: 'singles', 3: '1v2', 4: 'doubles', 6: '3v3', 8: '4v4', 10: '5v5' }[sel.length];
  if (!fmt) return { ok: false, label: 'pick 2, 3, 4, 6, 8 or 10 players' };
  if (fmt === 'singles' && !s.singles) return { ok: false, label: 'singles is off for this session' };
  if (fmt === 'doubles' && !s.doubles) return { ok: false, label: 'doubles is off for this session' };
  return { ok: true, fmt, label: `${FORMAT_LABEL[fmt]}${FUN.includes(fmt) ? ', counts toward session games only' : ''}` };
}
function balancedTeams(s, sel, fmt) {
  const lv = (p) => (R(s, p).level != null ? R(s, p).level : 4);
  const sum = (ids) => ids.reduce((t, p) => t + lv(p), 0);
  if (fmt === 'doubles') {
    return [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]]
      .map(([a, b]) => ({ teamA: a.map((i) => sel[i]), teamB: b.map((i) => sel[i]) }))
      .sort((x, y) => Math.abs(sum(x.teamA) - sum(x.teamB)) - Math.abs(sum(y.teamA) - sum(y.teamB)))[0];
  }
  const sorted = sel.slice().sort((a, b) => lv(b) - lv(a));
  if (fmt === 'singles') return { teamA: [sorted[0]], teamB: [sorted[1]] };
  if (fmt === '1v2') return { teamA: [sorted[0]], teamB: [sorted[1], sorted[2]] };
  const teamA = [], teamB = [];
  sorted.forEach((p, i) => { (i % 4 === 0 || i % 4 === 3 ? teamA : teamB).push(p); });
  return { teamA, teamB };
}

// Available players: present and off court. Resting time runs from their last game ending (or from
// when they became present); "times waited" counts matches that started while they were free.
function restInfo(s, pid) {
  const r = R(s, pid);
  const ends = s.matches.filter((m) => (m.status === 'done' || m.status === 'invalid') && (all(m).includes(pid) || (m.subs || []).some((x) => x.out === pid))).map((m) => m.endedAt || 0);
  const since = Math.max(r.presentAt || s.startedAt || Date.now(), ...ends);
  const waits = s.matches.filter((m) => m.startedAt && m.startedAt > since && !all(m).includes(pid)).length;
  return { mins: Math.max(0, Math.floor((Date.now() - since) / 60000)), waits };
}

// ---------- Results (Q-RESULTS) ----------
function standings(s) {
  const done = s.matches.filter((m) => m.status === 'done');
  const rows = s.roster.map((r) => {
    let w = 0, l = 0;
    done.forEach((m) => { if (counted(m, r.pid)) { const onA = m.teamA.includes(r.pid); if ((m.winner === 'A') === onA) w++; else l++; } });
    return { pid: r.pid, name: nm(r.pid), w, l, g: w + l };
  }).filter((x) => x.g > 0);
  const h2h = (a, b) => {
    let aw = 0, bw = 0;
    done.forEach((m) => {
      const aA = m.teamA.includes(a.pid), bA = m.teamA.includes(b.pid);
      if (!counted(m, a.pid) || !counted(m, b.pid) || aA === bA) return;
      if ((m.winner === 'A') === aA) aw++; else bw++;
    });
    return bw - aw;
  };
  rows.sort((a, b) => b.w - a.w || a.l - b.l || h2h(a, b) || a.name.localeCompare(b.name));
  return rows;
}
function awards(s) {
  const done = s.matches.filter((m) => m.status === 'done');
  const lv = (p) => (R(s, p) && R(s, p).level != null ? R(s, p).level : 4);
  const avg = (ids) => ids.reduce((t, p) => t + lv(p), 0) / ids.length;
  const perf = s.roster.map((r) => {
    let score = 0, g = 0, w = 0;
    done.forEach((m) => {
      if (!counted(m, r.pid)) return;
      const onA = m.teamA.includes(r.pid);
      const mine = avg(onA ? m.teamA : m.teamB), opp = avg(onA ? m.teamB : m.teamA);
      const expected = 1 / (1 + Math.pow(10, (opp - mine) / 2));
      const won = (m.winner === 'A') === onA;
      score += (won ? 1 : 0) - expected; g++; if (won) w++;
    });
    return { pid: r.pid, score, g, rate: g ? w / g : 0, p: P(r.pid) };
  }).filter((x) => x.g >= 2);
  const mvp = perf.slice().sort((a, b) => b.score - a.score)[0] || null;
  const hist = perf.filter((x) => x.p.prior >= 5 && x.p.base != null).map((x) => ({ ...x, delta: x.rate - x.p.base }));
  const improved = hist.filter((x) => x.delta >= 0.15).sort((a, b) => b.delta - a.delta)[0] || null;
  const offDay = hist.filter((x) => x.delta <= -0.3).sort((a, b) => a.delta - b.delta);
  return { mvp, improved, offDay };
}

function pickerSheet(s, sh) {
  const pk = sh.picking;
  const current = sh[pk.team][pk.i];
  const others = sh.teamA.concat(sh.teamB).filter((p, idx) => p && p !== current);
  const f = sh.pf || 'avail';
  const q = (sh.pq || '').trim().toLowerCase();
  let list = s.roster.filter((r) => !q || nm(r.pid).toLowerCase().includes(q) || short(r.pid).toLowerCase().includes(q));
  if (f === 'avail') list = list.filter((r) => r.present && !activeOf(s, r.pid));
  if (f === 'present') list = list.filter((r) => r.present);
  list.sort((a, b) => (activeOf(s, a.pid) ? 1 : 0) - (activeOf(s, b.pid) ? 1 : 0) || (b.present ? 1 : 0) - (a.present ? 1 : 0) || gamesOf(s, a.pid) - gamesOf(s, b.pid) || restInfo(s, b.pid).mins - restInfo(s, a.pid).mins);
  const title = `Choose Team ${pk.team === 'teamA' ? 'A' : 'B'} · player ${pk.i + 1}`;
  return sheetShell(title, `
    <label class="field"><span>Search players</span><input class="input" id="pick-q" data-bind="ui.sheet.pq" data-rerender value="${esc(sh.pq || '')}" placeholder="Name or nickname" data-autofocus></label>

      : `<div class="empty">${f === 'avail' ? 'No one is free right now. Try All present.' : 'No player matches.'}</div>`}

  sync() {
    const log = S.syncLog || [];
    const wait = log.filter((x) => !x.synced);
    const done = log.filter((x) => x.synced).slice(0, 15);
    const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
    const groups = (items, cls) => {
      const by = {};
      items.forEach((x) => { (by[x.area] = by[x.area] || []).push(x); });
      return Object.entries(by).map(([area, xs]) => `<div class="sync-grp ${cls}"><div class="between"><b>${esc(area)}</b><span class="small muted tnum">${plural(xs.length, 'change')}</span></div>
        <ul class="sync-list">${xs.map((x) => `<li><span>${esc(x.text)}</span><span class="small muted tnum">${fmtTime(x.at)}</span></li>`).join('')}</ul></div>`).join('');
    };
    const [cls, title, text] = S.syncing ? ['sync', 'Syncing…', `Uploading ${plural(wait.length, 'change')} from this device.`]
      : !S.online ? ['off', 'Working offline', wait.length ? `${plural(wait.length, 'change')} saved on this device, waiting for internet. They sync automatically when you reconnect.` : 'Nothing is waiting. New changes save on this device until you reconnect.']
      : ['', 'Online and synced', `Everything on this device synced. Last sync ${fmtTime(S.lastSync)}.`];
    return sheetShell('Sync status', `
      <div class="sync-head ${cls}"><i aria-hidden="true"></i><div><b>${title}</b><p class="small muted">${text}</p></div></div>
      ${wait.length ? `<section class="stack tight"><span class="label">Waiting to sync · ${wait.length}</span>${groups(wait, 'wait')}</section>` : ''}
      <section class="stack tight"><span class="label">Synced from this device</span>${done.length ? groups(done, '') : '<p class="small muted">Nothing has synced from this device yet. Changes you make appear here.</p>'}</section>
      <p class="small muted">Shows changes made on this device only. Another device's changes appear after it syncs, and the public session page updates only from synced data.</p>`,
      '<button class="btn" data-act="closeSheet">Close</button>');
  },
  datePicker(sh) {
    const today = new Date().setHours(0, 0, 0, 0);
    const view = new Date(sh.view);
    const lead = view.getDay();
    const daysIn = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
    const busy = new Set(S.sessions.filter((x) => x.id !== (S.ui.draft || {}).id).map((x) => dayKey(x.start)));
    const cells = [];
    // One day button is in the tab order: the selected day, or the first selectable day of another month.
    let tabStop = monthStart(sh.sel) === sh.view ? sh.sel : null;
    for (let i = 0; i < lead; i++) cells.push('<span class="dp-day other" aria-hidden="true"></span>');
    for (let n = 1; n <= daysIn; n++) {
      const t = new Date(view.getFullYear(), view.getMonth(), n).getTime();
      const sel = t === sh.sel, past = t < today && !sel;
      const has = busy.has(dayKey(t));
      if (tabStop == null && !past) tabStop = t;
      cells.push(`<button class="dp-day ${t === today ? 'today' : ''}" id="dp-${t}" data-act="dpPick" data-k="${t}" aria-pressed="${sel}" ${past ? 'disabled' : ''} tabindex="${t === tabStop ? 0 : -1}"
        aria-label="${esc(fmtLongDate(t))}${t === today ? ', today' : ''}${has ? ', your club has a session' : ''}">${n}${has ? '<i class="dp-dot" aria-hidden="true"></i>' : ''}</button>`);
    }
    const prevOff = monthStart(today) >= sh.view;
    return sheetShell('Choose a date', `
      <div class="dp-sel"><span class="label">Session date</span><b>${esc(fmtLongDate(sh.sel))}</b>${sh.sel === today ? '<span class="small muted">Today</span>' : ''}</div>
      <div class="dp-head">
        <button class="btn sm icon-btn" data-act="dpMove" data-d="-1" aria-label="Previous month" ${prevOff ? 'disabled' : ''}>${I.back}</button>
        <h3 aria-live="polite">${view.toLocaleDateString([], { month: 'long', year: 'numeric' })}</h3>
        <button class="btn sm icon-btn" data-act="dpMove" data-d="1" aria-label="Next month"><span style="display:inline-flex;transform:rotate(180deg)">${I.back}</span></button>
      </div>
      <div class="dp-grid" role="group" aria-label="Dates">${['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map((w) => `<span class="dp-wd" aria-hidden="true">${w}</span>`).join('')}${cells.join('')}</div>
      <div class="between small muted"><span><i class="cal-key prep"></i>Your club already has a session</span><button class="btn xs" data-act="dpToday">Today</button></div>
      <p class="small muted">Use the arrow keys to move between days.</p>`,
      `<button class="btn" data-act="closeSheet">Cancel</button><button class="btn primary" data-act="dpApply">Set date</button>`);
  },
  calDay(sh) {
    const k = dayKey(sh.t);

    const isToday = k === dayKey(Date.now());
    const past = sh.t < new Date(new Date().setHours(0, 0, 0, 0)).getTime();
    return sheetShell(`${esc(new Date(sh.t).toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }))}${isToday ? ' · Today' : ''}`,
      evs.length ? `<p class="small muted">${evs.length} session${evs.length > 1 ? 's' : ''} this day.</p>
        <div class="stack tight">${evs.map((e) => `<button class="opt" ${e.act}><i class="cal-key ${e.kind}" style="margin:0"></i><div class="main"><b>${esc(e.title)}</b><div class="small muted">${fmtTime(e.t)} · ${esc(e.venue)}</div></div>${chip(e.label, e.kind === 'live' ? 'ok' : e.kind === 'bad' ? 'bad' : '')}</button>`).join('')}</div>`
        : '<div class="empty">No sessions this day.</div>',
      `<button class="btn" data-act="closeSheet">Close</button>${past ? '' : `<button class="btn primary" data-act="newSession" data-k="${sh.t}">Create session${isToday ? ' today' : ' on this day'}</button>`}`);

        : `<dl class="kv"><dt>Games</dt><dd>${h.games}</dd><dt>Players</dt><dd>${h.players}</dd><dt>Results</dt><dd>${esc(h.results)}</dd></dl><p class="small muted">Older sessions open read-only. Their slides aren't part of this prototype. Finish tonight's session to see results.</p>`}`,
      '<button class="btn" data-act="closeSheet">Close</button>');

  add(sh) {
    const s = cur();
    const inRoster = new Set(s.roster.map((r) => r.pid).concat((s.waitlist || []).map((w) => w.pid)));

    let body = `${notice('', `Adding to <b>${esc(s.title)}</b>.${live ? ' Late players get a level now, and it locks for the rest of the session.' : ''}`)}${sh.last && !sh.pick ? `<div role="status">${notice('ok', `${esc(sh.last)}${sh.added > 1 ? ` <span class="small muted">· ${sh.added} added so far</span>` : ''}`)}</div>` : ''}${full ? notice('warn', `<b>All ${capacityOf(s)} slots are taken.</b> New players go on the waitlist as #${waitOf(s).length + 1}. You can give them a slot later.`) : ''}`;

        <div class="sel-list">${list.map((p) => `<button class="opt" data-act="pickPlayer" data-id="${p.id}">${avatar(p)}<div class="main"><b>${esc(p.name)}</b><div class="small muted">${p.rtr ? esc(p.rtr) : 'Guest'}</div></div>${identChip(p)}</button>`).join('') || (added && !q ? '<div class="empty">Every saved player is already in this session. Add someone new or search Player Information.</div>' : '<div class="empty">No saved player matches. Try Player Information or add a new player.</div>')}</div>`;

        ${sh.err ? `<span class="err">${esc(sh.err)}</span>` : ''}`;
      return sheetShell('Add player', body, `<button class="btn" data-act="closeSheet">${sh.added ? 'Done' : 'Cancel'}</button><button class="btn primary" data-act="confirmNew">${full ? 'Add to waitlist' : 'Confirm player slot'}</button>`);

  editor(sh) {

  suggest(sh) {

// ---------- Matchmaking (prototype heuristics) ----------
function splitTeams(s, pick, fmt) {
  if (fmt === 'singles') return { teamA: [pick[0]], teamB: [pick[1]] };
  const lv = (p) => (R(s, p).level != null ? R(s, p).level : 4);
  const opts = [[[0, 1], [2, 3]], [[0, 2], [1, 3]], [[0, 3], [1, 2]]]
    .map(([a, b]) => { const A = a.map((i) => pick[i]), B = b.map((i) => pick[i]); return { A, B, diff: Math.abs(A.reduce((t, p) => t + lv(p), 0) - B.reduce((t, p) => t + lv(p), 0)) }; })
    .sort((x, y) => x.diff - y.diff);
  const easy = s.mode === 'chill' ? Math.random() < 0.3 : s.mode === 'fair' ? Math.random() < 0.1 : false;
  const o = easy ? opts[opts.length - 1] : opts[0];
  return { teamA: o.A, teamB: o.B };
}
function generate(s, n) {
  const present = s.roster.filter((r) => r.present).map((r) => r.pid);
  const fmts = [...(s.doubles ? ['doubles'] : []), ...(s.singles ? ['singles'] : [])];
  if (!fmts.length) return { error: 'Singles and doubles are both off for this session, so there is nothing to generate. Add a fun game manually instead.' };
  const load = {};
  present.forEach((p) => { load[p] = gamesOf(s, p) + (s.mode === 'hard' ? 0 : 0.9 * queuedCount(s, p)) + Math.random() * 0.4; });
  const out = [];
  for (let i = 0; i < n; i++) {
    const fmt = fmts.length === 2 ? (present.length >= 4 && i % 3 !== 2 ? 'doubles' : 'singles') : fmts[0];
    const size = fmt === 'doubles' ? 4 : 2;
    if (present.length < size) {
      if (!out.length) return { error: `Only ${present.length} player${present.length === 1 ? ' is' : 's are'} present. ${fmt === 'doubles' ? 'Doubles' : 'Singles'} needs ${size}. Mark arrivals present in Players.` };
      break;
    }
    const pick = present.slice().sort((a, b) => load[a] - load[b]).slice(0, size);
    out.push({ format: fmt, ...splitTeams(s, pick, fmt) });
    pick.forEach((p) => { load[p] += 1; });
  }
  return { matches: out };
}
function addMatch(s, m, origin, prot, pos) {
  s.seq += 1;
  const maxPos = Math.max(0, ...s.matches.map((x) => x.pos || 0));
  const rec = { id: `m${Date.now().toString(36)}${Math.random().toString(36).slice(2, 7)}`, seq: s.seq, format: m.format, teamA: m.teamA.slice(), teamB: m.teamB.slice(), status: 'waiting', origin, protected: prot, courts: [], subs: [], pos: pos ?? maxPos + 1 };
  s.matches.push(rec);
  return rec;
}

  if (path === '/sessions/new') { screen = 'setup'; if (S.screen !== 'setup' || !S.ui.draft || S.ui.draft.id) S.ui.draft = draftFrom(null); S.ui.errors = {}; }
  else if (match || guest) {
    const id = decodeURIComponent((match || guest)[1]);
    session = S.sessions.find((s) => s.id === id);
    if (!session) return false;
    S.currentId = session.id;
    if (guest || match[2] === 'public-page') { screen = 'public'; S.ui.guest = !!guest; }
    else if (match[2] === 'edit') { screen = 'setup'; if (S.screen !== 'setup' || S.ui.draft?.id !== session.id) S.ui.draft = draftFrom(session); S.ui.errors = {}; }
    else screen = Object.entries(sessionSuffixes).find(([, suffix]) => suffix === (match[2] ? `/${match[2]}` : ''))?.[0];
    // Re-entry only selects an available view; it must never restart finalization.
    if (match?.[2] === 'recovery' || screen === 'finalizing' || (screen === 'console' && session.status !== 'active')) screen = session.status === 'active' ? 'console' : session.status === 'prepared' ? 'prepare' : 'history';
    if (['prepare', 'setup'].includes(screen) && session.status !== 'prepared') screen = session.status === 'active' ? 'console' : 'history';
    if (screen === 'results' && session.status !== 'finalized') screen = session.status === 'prepared' ? 'prepare' : session.status === 'active' ? 'console' : 'history';
  }
  if (!screen) return false;
  S.screen = screen; S.ui.sheet = null; S.ui.navOpen = false; S.ui.setOpen = false;
  if (screen !== 'public') S.ui.guest = false;
  S.ui.prepTab = ['roster', 'waitlist', 'payments'].includes(tab) ? tab : 'overview';
  S.ui.pane = ['queue', 'roster', 'board'].includes(tab) ? tab : 'live';
  S.ui.histTab = HIST_TABS.some(([key]) => key === tab) ? tab : 'results';
  S.ui.slide = ['1', '2'].includes(tab) ? Number(tab) : 0;
  S.ui.pubTab = tab === 'participants' ? tab : 'details';
  return true;
}

// ---------- Render ----------
let lastSheetKey = null;
function render() {
  if (prototypeRouter?.unavailable) return;
  const a = document.activeElement;
  const focusId = a && a.id && a !== document.body ? a.id : null;
  let selStart = null;
  try { selStart = a && typeof a.selectionStart === 'number' ? a.selectionStart : null; } catch (e) { selStart = null; }
  const views = { login: viewLogin, home: viewHome, venues: viewVenues, club: viewClub, inventory: viewInventory, history: viewHistory, players: viewPlayers, setup: viewSetup, prepare: viewPrepare, console: viewConsole, finalizing: viewFinalizing, results: viewResults, public: viewPublic };
  const sh = S.ui.sheet;
  const page = (views[S.screen] || viewHome)();
  const html = topBar() + (hasShell() ? `<div class="shell ${navMin ? 'rail-min' : ''} ${S.ui.navOpen ? 'nav-open' : ''}">${navRail()}<div class="nav-scrim" data-act="toggleNav" aria-hidden="true"></div><div class="shell-main">${page}</div>${mobileDock()}</div>` : page) + (sh ? SHEETS[sh.type](sh) : '');
  document.getElementById('app').innerHTML = html;
  document.body.style.overflow = sh ? 'hidden' : '';
  const key = sh ? `${sh.type}|${sh.step || ''}|${sh.pick ? 'p' : ''}|${sh.tab || ''}|${sh.picking ? 'k' : ''}` : null;
  if (sh && key !== lastSheetKey) {
    const t = document.querySelector('.sheet [data-autofocus]') || document.getElementById('sheet-title');
    if (t) t.focus();
  } else if (focusId && document.getElementById(focusId)) {
    const el = document.getElementById(focusId);
    el.focus();
    if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selStart); } catch (e) { /* not a text field */ } }
    // Number fields can't report or set the caret, and a fresh one puts it at the start, so typing "450" came out "054".
    // Re-assigning the value moves the caret to the end, where the person was typing.
    else if (el.type === 'number') { const v = el.value; el.value = ''; el.value = v; }
  } else if (!sh && lastSheetKey && lastTrigger) {
    const sel = `[data-act="${lastTrigger.act}"]` + (lastTrigger.id ? `[data-id="${lastTrigger.id}"]` : '');
    const t = document.querySelector(sel) || document.querySelector(`[data-act="${lastTrigger.act}"]`);
    if (t) t.focus();
  }
  lastSheetKey = key;
  const rp = document.getElementById('rp-range');
  if (rp) replayTo(+rp.value);
  save();
  prototypeRouter?.sync();
}
if (!S.inventory) { S.inventory = seedInventory(); save(); }
if (!S.venues) { S.venues = seedVenues(); save(); }
ensureHistory();
// Re-draw the dashboard calendar when the screen crosses a month / week / day breakpoint.
let lastCalView = calView();
window.addEventListener('resize', () => { const v = calView(); if (v !== lastCalView) { lastCalView = v; if (S.screen === 'home' && !S.ui.sheet) render(); } });
// Sessions saved before the budget was enforced on edit may hold more slots than courts × players; settle them first come, first served.
S.sessions.forEach((x) => { if (x.status === 'prepared' && x.roster.length > capacityOf(x)) rebalanceSlots(x); });
setInterval(() => { if (S.screen === 'console' && !S.ui.sheet && !drag && !pdrag &&!(document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))) render(); }, 30000);
prototypeRouter = window.mountPrototypeRouter?.({ read: prototypePath, apply: applyPrototypeRoute, render, home: '/queue' });
if (!prototypeRouter) render();
})();
</script>
