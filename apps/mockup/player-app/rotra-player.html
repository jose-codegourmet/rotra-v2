<style>
/* Layout: public player directory. One top bar with the two places people go (leaderboard, own profile); profiles put
   the identity card beside rank, eligibility and games on wide screens and stack on phones.
   Tokens and base components are copied from the Queue prototype (apps/client globals.css: dark default, light toggleable). */
:root {
  --bg: #0b0b0c; --surface: #1a1a1d; --elev: #2a2a2e; --overlay: #3a3a3f;
  --fg: #f0f0f2; --fg2: #9090a0; --fg3: #5a5a66;

  --error: #ff4d4d; --error-subtle: rgba(255, 77, 77, 0.12); --warn: #ffb800; --warn-subtle: rgba(255, 184, 0, 0.12); --ann-bg: #3a3000; --ann-border: #ffd400; --ann-tag: #ffd400;
  --border: #2a2a2e; --border-strong: #404048; --scrim: rgba(0, 0, 0, 0.6);
  --font: "Satoshi", "Manrope", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  --r: 10px; --r-sm: 6px;
  --court: #14603f; --court-line: rgba(255, 255, 255, 0.85); --court-free: #232328; --court-free-line: rgba(255, 255, 255, 0.16);
  --shadow: none; --knob: var(--fg); --field: var(--bg);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  /* Light: white cards on a soft off-white page, a deeper green that reads as text and carries white labels (AA). */
  --bg: #f4f5f2; --surface: #ffffff; --elev: #eef0ec; --overlay: #dfe3dc;
  --fg: #121513; --fg2: #535a54; --fg3: #7a817b;
  --accent: #0a7d44; --accent-dim: #086a39; --accent-subtle: rgba(10, 125, 68, 0.09); --on-accent: #ffffff;
  --error: #c62828; --error-subtle: rgba(198, 40, 40, 0.07); --warn: #a35600; --warn-subtle: rgba(217, 119, 6, 0.09); --ann-bg: #fff3b0; --ann-border: #e6b800; --ann-tag: #7a5c00;
  --border: #e2e5df; --border-strong: #cdd2c9; --scrim: rgba(18, 21, 19, 0.4);
  --court: #2e8b57; --court-line: #ffffff; --court-free: #e8ebe5; --court-free-line: rgba(18, 21, 19, 0.14);
  --shadow: 0 1px 2px rgba(18, 24, 20, 0.05), 0 2px 8px rgba(18, 24, 20, 0.04); --knob: #ffffff; --field: #ffffff;
  color-scheme: light;
} }
:root[data-theme="light"] {
  /* Light: white cards on a soft off-white page, a deeper green that reads as text and carries white labels (AA). */
  --bg: #f4f5f2; --surface: #ffffff; --elev: #eef0ec; --overlay: #dfe3dc;
  --fg: #121513; --fg2: #535a54; --fg3: #7a817b;
  --accent: #0a7d44; --accent-dim: #086a39; --accent-subtle: rgba(10, 125, 68, 0.09); --on-accent: #ffffff;
  --error: #c62828; --error-subtle: rgba(198, 40, 40, 0.07); --warn: #a35600; --warn-subtle: rgba(217, 119, 6, 0.09); --ann-bg: #fff3b0; --ann-border: #e6b800; --ann-tag: #7a5c00;
  --border: #e2e5df; --border-strong: #cdd2c9; --scrim: rgba(18, 21, 19, 0.4);
  --court: #2e8b57; --court-line: #ffffff; --court-free: #e8ebe5; --court-free-line: rgba(18, 21, 19, 0.14);
  --shadow: 0 1px 2px rgba(18, 24, 20, 0.05), 0 2px 8px rgba(18, 24, 20, 0.04); --knob: #ffffff; --field: #ffffff;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.3px; }
h1 { font-size: 26px; font-weight: 800; line-height: 1.2; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.mono { font-family: var(--mono); font-size: 0.92em; }
.muted { color: var(--fg2); }
.small { font-size: 13px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--fg2); }
.tnum { font-variant-numeric: tabular-nums; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.top-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: baseline; gap: 8px; font-weight: 800; letter-spacing: 1.5px; font-size: 17px; }
.brand b { color: var(--accent); }
.brand span { font-weight: 600; letter-spacing: 0; color: var(--fg2); font-size: 14px; }
.top .grow { flex: 1; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
button.conn { background: transparent; cursor: pointer; min-height: 32px; }
button.conn:hover { border-color: var(--accent); background: var(--surface); }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.sync-head { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-subtle); }
.sync-head > i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 7px; flex: none; }
.sync-head.off { border-color: var(--warn); background: var(--warn-subtle); }
.sync-head.off > i { background: var(--warn); }
.sync-head.sync > i { animation: pulse 1s infinite; }
@media (prefers-reduced-motion: reduce) { .sync-head.sync > i { animation: none; } }
.sync-grp { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--bg); }
.sync-grp.wait { border-color: var(--warn); }
.sync-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.sync-list li { display: flex; justify-content: space-between; gap: 12px; min-width: 0; }
.sync-list li > span:first-child { overflow-wrap: anywhere; }
.conn.off i { background: var(--warn); }
.conn.sync i { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .conn.sync i { animation: none; } }

.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.narrow { max-width: 760px; }
.crumb { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-weight: 600; text-align: center; }
.btn:hover:not(:disabled) { background: var(--elev); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-dim); }
.btn.danger { border-color: var(--error); color: var(--error); background: transparent; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--elev); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.xs { min-height: 32px; padding: 0 10px; font-size: 13px; border-radius: var(--r-sm); }
.btn.block { width: 100%; }
.btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-subtle); }
.btn.primary[aria-pressed] { background: var(--accent); }
.icon-btn { min-width: 36px; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.tight { gap: 6px; }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; min-width: 0; box-shadow: var(--shadow); }
.card.hl { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-subtle) inset; }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--border); }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; min-width: 0; }
.li .main { flex: 1; min-width: 0; }
.li.click { cursor: pointer; }
.card.li { padding: 14px 16px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--fg2); white-space: nowrap; }
.chip.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-subtle); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-subtle); }
.chip.bad { color: var(--error); border-color: color-mix(in srgb, var(--error) 45%, transparent); background: var(--error-subtle); }
.chip.solid { background: var(--elev); color: var(--fg); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--elev); color: var(--fg2); flex: none; }
.avatar.lg { width: 52px; height: 52px; font-size: 18px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-weight: 800; }
.avatar.photo { background: var(--elev); overflow: hidden; }
.avatar.photo svg { width: 100%; height: 100%; display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.avatar.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av-edit { position: relative; flex: none; display: block; }
.av-edit .av-cam { position: absolute; right: -6px; bottom: -6px; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--surface); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; cursor: pointer; padding: 0; }
.av-cam svg { width: 16px; height: 16px; }
/* Owner comment, November 11, 2026: the character picker is 5 big circles in a row, 3 rows, 15 per page. */
.av-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.av-pick { padding: 3px; border: 3px solid transparent; border-radius: 50%; background: none; cursor: pointer; display: grid; place-items: center; min-width: 0; }
.av-pick[aria-pressed="true"] { border-color: var(--accent); }
.av-pick .avatar { width: 100%; height: auto; aspect-ratio: 1; border-radius: 50%; font-size: clamp(16px, 4vw, 28px); }
.av-pick .avatar svg, .av-pick .avatar img { width: 100%; height: 100%; }
.cmp-game { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px 0; border-top: 1px solid var(--border); }
.cmp-game .cmp-row3 { align-self: stretch; display: grid; grid-template-columns: 40% 30% 30%; align-items: center; gap: 0; }
.cmp-row3 > * { min-width: 0; padding-right: 8px; }
.cmp-row3 > .cmp-court { padding-right: 0; }
.cmp-info { display: flex; flex-direction: column; gap: 2px; padding-left: 10px; }
.cmp-info b { font-size: 13px; }
.cmp-info span { overflow-wrap: anywhere; }
.cmp-res .chip { white-space: normal; text-align: center; line-height: 1.2; max-width: 100%; }
.cmp-res { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; text-align: right; }
.cmp-court { position: relative; display: grid; grid-template-columns: 1fr 1fr; border-radius: 8px; overflow: hidden; }
.cmp-court .sc-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0.1; }
.cmp-court { background: none; border: 1px solid color-mix(in srgb, var(--accent) 10%, transparent); }
.cmp-side { position: relative; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; gap: 10px; padding: 10px 2px; }
.cmp-pl { display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center; min-width: 0; max-width: 100%; color: var(--fg); }
.cmp-pl b { font-size: 11px; line-height: 1.15; margin-top: 4px; overflow-wrap: anywhere; }
.cmp-lv { font-size: 9px; line-height: 1.2; color: var(--fg2); }
.cmp-score { font-size: 22px; font-weight: 800; white-space: nowrap; }
.cmp-av { position: relative; display: block; }
.cmp-g { position: absolute; top: -6px; right: -8px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; background: var(--bg); color: var(--fg); border: 2px solid var(--border-strong); }
.cmp-pl.won .cmp-g { border-color: var(--accent); }
.cmp-pl .avatar { width: 38px; height: 38px; font-size: 12px; box-shadow: 0 0 0 2px var(--border-strong); }
.cmp-pl.won .avatar { box-shadow: 0 0 0 2px var(--accent); }
.cmp-x { align-self: center; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 6px; }
.cmp-tm { display: flex; align-items: center; gap: 14px; }
.cmp-tm-av { display: flex; }
.cmp-tm-av .avatar { box-shadow: 0 0 0 3px var(--surface); }
.cmp-tm-av .avatar + .avatar { margin-left: -14px; }
.cmp-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.cmp-tiles > div { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px; border-radius: var(--r); background: var(--elev); }
.cmp-tiles b { font-size: 26px; line-height: 1.1; }
.cmp-tiles .won b { color: var(--accent); }
.cmp-wr { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.cmp-wr b { font-size: 22px; }
.cmp-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.cmp-who { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
.cmp-vs { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--elev); color: var(--fg2); }
.cmp-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); text-align: center; }
.cmp-row b { font-size: 15px; overflow-wrap: anywhere; }
.cmp-row b.lead { color: var(--accent); }
.cmp-row > span { max-width: 110px; }
.h2h { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.h2h-n { display: flex; flex-direction: column; align-items: center; min-width: 56px; }
.h2h-n b { font-size: 28px; line-height: 1; }
.h2h-bar { display: flex; gap: 2px; height: 12px; }
.h2h-bar i { display: block; flex-basis: 0; background: var(--accent); border-radius: 999px 0 0 999px; }
.h2h-bar i.them { background: var(--border-strong); border-radius: 0 999px 999px 0; }
.av-now { display: flex; align-items: center; gap: 14px; }
.avatar.xl { width: 64px; height: 64px; font-size: 20px; }
.avatar.xl.photo { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--border-strong); }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--surface); font-size: 14px; }
.notice.warn { border-color: var(--warn); background: var(--warn-subtle); }
.notice.bad { border-color: var(--error); background: var(--error-subtle); }
.notice.ok { border-color: var(--accent); background: var(--accent-subtle); }
.notice svg { flex: none; margin-top: 2px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--fg2); }
.kv dd { margin: 0; min-width: 0; }
.home-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
@media (min-width: 900px) { .home-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.home-label { margin-bottom: -8px; }
.home-now-body { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.home-now-title { font-size: 20px; }
.home-now .btn { text-decoration: none; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.empty { padding: 24px 12px; text-align: center; color: var(--fg2); font-size: 14px; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--fg2); }
.field .hint, .hint { font-size: 12px; color: var(--fg2); font-weight: 400; }
.err { font-size: 13px; color: var(--error); font-weight: 600; }
.input, select.input, textarea.input { width: 100%; min-height: 44px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--field); padding: 8px 12px; }
textarea.input { min-height: 80px; resize: vertical; }
.input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.input.bad { border-color: var(--error); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r); padding: 3px; gap: 3px; flex-wrap: wrap; align-self: flex-start; }
.seg button { border: 0; background: transparent; min-height: 36px; padding: 0 14px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--fg2); }
.seg button[aria-pressed="true"] { background: var(--elev); color: var(--fg); }
.switch { position: relative; width: 46px; height: 28px; border-radius: 999px; background: var(--overlay); border: 0; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--knob); box-shadow: var(--shadow); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--on-accent); }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); }
.check input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.choice { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--bg); cursor: pointer; min-width: 0; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-subtle); }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 700; color: var(--fg2); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
/* Sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; animation: fade .15s; }
.sheet { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 16px; box-shadow: 0 24px 60px rgba(0, 0, 0, .45); animation: pop .16s ease-out; }
.sheet.wide { width: min(820px, calc(100vw - 24px)); }
@media (max-width: 640px) {
  .sheet, .sheet.wide { left: 0; right: 0; top: auto; bottom: 0; transform: none; width: 100%; max-height: 92dvh; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .18s ease-out; }
}
.sheet header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 6px; }
.sheet header h2:focus { outline: none; }
.sheet .sb { padding: 10px 20px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.sheet footer { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 20px 18px; border-top: 1px solid var(--border); }
.sheet footer .btn { flex: 1 1 auto; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -48%); } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .scrim, .sheet { animation: none !important; } }
/* Toast */
.toasts { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; width: min(440px, calc(100vw - 32px)); pointer-events: none; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: var(--r); font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }

/* Google sign-in design (November 16, 2026 proposal) */
:root { --g-blue: #4285f4; --g-red: #ea4335; --g-yellow: #fbbc05; --g-green: #34a853; }
.btn.google { background: var(--surface); border-color: var(--border-strong); color: var(--fg); gap: 10px; }
.btn.google:hover:not(:disabled) { background: var(--elev); }
.g-mark { width: 18px; height: 18px; flex: none; display: block; }
.or { display: flex; align-items: center; gap: 12px; color: var(--fg3); font-size: 12px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; }
.or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.invite-card { padding: 0; overflow: hidden; }
.invite-card .ic-top { padding: 20px; background: var(--accent-subtle); border-bottom: 1px solid var(--border); display: flex; gap: 14px; align-items: center; min-width: 0; }
.invite-card .ic-top h1 { font-size: 22px; overflow-wrap: anywhere; }
.invite-card .ic-body { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.ic-when { display: flex; gap: 12px; align-items: center; }
.gid { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px; border: 1px solid var(--border); border-radius: var(--r); background: var(--elev); min-width: 0; }
.gid .main { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.gid .main span { overflow-wrap: anywhere; }
.gpick { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.gpick button { display: flex; gap: 12px; align-items: center; width: 100%; padding: 12px 14px; border: 0; border-top: 1px solid var(--border); background: none; color: inherit; text-align: left; cursor: pointer; min-height: 60px; font: inherit; }
.gpick button:first-child { border-top: 0; }
.gpick button:hover { background: var(--elev); }
.gpick .main { display: flex; flex-direction: column; min-width: 0; }
.gpick .main span { overflow-wrap: anywhere; }
/* Identity picker (D-2026-11-16-04): one card per club that saved the person's email. */
/* Owner artifact comment, November 16, 2026: the identity cards sit in the share dialog's carousel (drag or swipe, a fade mask on a side with more cards). */
/* Owner artifact comment, same day: the card in view is always centred, also after a swipe; the next one peeks in at the side. */
.sh-dlg .sh-tiles.idpick { --idw: min(300px, 72vw); align-items: stretch; padding-inline: calc(50% - var(--idw) / 2); scroll-padding-inline: 0; }
.idpick button { display: flex; flex-direction: column; align-items: stretch; gap: 10px; flex: none; width: var(--idw); scroll-snap-stop: always; padding: 14px; border: 1px solid var(--border-strong); border-radius: var(--r); background: var(--surface); color: inherit; text-align: left; cursor: pointer; font: inherit; }
.idpick button:hover { background: var(--elev); border-color: var(--accent); }
/* Owner artifact comment, same day: the club's logo and name on top, then everything the club saved. */
.idpick .club { display: flex; gap: 8px; align-items: center; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.idpick .facts { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; margin: 0; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; }
.idpick .facts dt { color: var(--fg2); } .idpick .facts dd { margin: 0; overflow-wrap: anywhere; }
.idpick .who { display: flex; gap: 12px; align-items: center; min-width: 0; }
.idpick .main { display: flex; flex-direction: column; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.method { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding-top: 12px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.method:first-of-type { border-top: 0; padding-top: 0; }
.method .who2 { display: flex; gap: 12px; align-items: center; min-width: 0; }
.method .ico { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--elev); flex: none; color: var(--fg2); }
.choose-card { display: flex; flex-direction: column; gap: 12px; }
.login-foot { padding-top: 14px; border-top: 1px solid var(--border); }

.band-ann { background: var(--ann-bg); border-bottom: 1px solid var(--ann-border); color: var(--fg); font-size: 13px; }
.band-ann.hard { border-bottom-width: 2px; }
.band-ann .in { max-width: 1240px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-start; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.band-ann .in > div { min-width: 0; }
.band-ann .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.band-ann .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; color: var(--ann-tag); margin-right: 6px; }
.nitem.ann { background: var(--ann-bg); }
.nitem.ann .nic { background: var(--surface); color: var(--ann-tag); }
.nitem.ann .dot { background: var(--ann-border); }
.bell { position: relative; }
.bell .cnt { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--error); color: var(--on-accent); font-size: 11px; font-weight: 700; display: grid; place-items: center; line-height: 1; border: 2px solid var(--bg); box-sizing: content-box; }
.nlist { display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.nitem { display: flex; gap: 12px; align-items: flex-start; width: 100%; padding: 14px 16px; border: 0; border-top: 1px solid var(--border); background: none; color: inherit; text-align: left; font: inherit; cursor: pointer; }
.nitem:first-child { border-top: 0; }
.nitem:hover { background: var(--elev); }
.nitem.unread { background: var(--accent-subtle); }
.nitem .nic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--elev); color: var(--fg2); flex: none; }
.nitem.unread .nic { background: var(--surface); color: var(--accent-dim); }
.nitem .nmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.nitem .nmain b { overflow-wrap: anywhere; }
.nitem .ntime { font-size: 12px; color: var(--fg3); white-space: nowrap; }
.nitem .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; margin-top: 6px; }
.ngroup { padding: 4px 0; }
.nfilters { display: flex; gap: 6px; flex-wrap: wrap; }
.req-steps { display: flex; flex-direction: column; gap: 10px; margin: 0; padding-left: 20px; }

.vsteps { display: flex; flex-direction: column; gap: 0; }
.vstep { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--border); }
.vstep:first-child { border-top: 0; padding-top: 0; }
.vstep .vic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; border: 2px solid var(--border-strong); color: var(--fg3); font-size: 13px; font-weight: 700; }
.vstep.done .vic { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.vstep .vmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.vstep .vmain span { overflow-wrap: anywhere; }
.vstep .row { margin-top: 4px; }
.vbar { height: 6px; border-radius: 999px; background: var(--elev); overflow: hidden; }
.vbar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }

/* Login */
.login { min-height: calc(100dvh - 80px); display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.login .card { width: min(420px, 100%); padding: 28px; display: flex; flex-direction: column; gap: 18px; }

.login::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(11, 11, 12, 0) 25%, rgba(11, 11, 12, .55) 60%, rgba(11, 11, 12, .8)); }
.login .card { box-shadow: 0 24px 60px rgba(0, 0, 0, .5); }

@media (max-width: 899px) { .login::before { background: rgba(11, 11, 12, .6); } }
.login-stack { width: min(420px, 100%); display: flex; flex-direction: column; gap: 12px; }
.legal-note { text-align: center; }
.legal-note a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.mark { font-size: 40px; font-weight: 800; letter-spacing: 6px; line-height: 1; }
.mark b { color: var(--accent); }


/* ---------- Player Information ---------- */
:root { --viewer-bg: #000000; --viewer-fg: #ffffff; --qr-bg: #ffffff; --qr-fg: #0b0b0c; --top-h: 61px; --gold: #f2c14e; --silver: #c3c8d0; --bronze: #d38b52; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --gold: #946600; --silver: #5f6774; --bronze: #93501f; } }
:root[data-theme="light"] { --gold: #946600; --silver: #5f6774; --bronze: #93501f; }
button.brand { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font: inherit; font-weight: 800; letter-spacing: 1.5px; font-size: 17px; }
.nav { display: flex; gap: 2px; margin-left: 8px; }
.nav button { border: 0; background: none; min-height: 36px; padding: 0 12px; border-radius: var(--r-sm); font-weight: 600; color: var(--fg2); cursor: pointer; white-space: nowrap; }
.nav button:hover { color: var(--fg); background: var(--surface); }
.nav button[aria-current="page"] { color: var(--fg); background: var(--elev); }
/* Owner artifact comment, November 19, 2026: "make the mobile version of the header be a dock on mobile but keep the
   notifications and light/dark mode button on the top right". Phones get a bottom dock; the top bar keeps the logo, bell,
   theme switch (and the prototype button). */
.dock { display: none; }
/* P-ONBOARD: fullscreen steps after an invite link (owner, November 19, 2026). No top bar or dock. */
.ob { min-height: 100dvh; display: flex; flex-direction: column; }
.ob-top { position: sticky; top: 0; z-index: 5; display: flex; flex-direction: column; gap: 10px; padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.ob-brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: min(640px, 100%); margin: 0 auto; }
.ob-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: min(640px, 100%); margin: 0 auto; }
.ob-bar i { height: 4px; border-radius: 4px; background: var(--border-strong); }
.ob-bar i.on { background: var(--accent); }
.ob-in { flex: 1; width: min(640px, 100%); margin: 0 auto; padding: 32px 16px 120px; display: flex; flex-direction: column; gap: 20px; }
.ob-in h1 { font-size: 26px; }
.ob-foot { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--border); padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.ob-foot-in { width: min(640px, 100%); margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ob-opts { display: grid; gap: 10px; }
.ob-opt { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 16px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--surface); color: var(--fg); font: inherit; cursor: pointer; }
.ob-opt b { font-size: 16px; }
.ob-opt.has-art { position: relative; padding: 0; gap: 0; overflow: hidden; }
.ob-opt .ob-art { display: block; width: 100%; aspect-ratio: 12 / 5; background: #0b0b0c center / cover no-repeat; filter: saturate(.8) brightness(.8); transition: filter .2s; }
.ob-opt[aria-checked="true"] .ob-art, .ob-opt:hover .ob-art { filter: none; }
.ob-opt .ob-opt-body { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px 14px; }
.ob-opt .ob-check { position: absolute; top: 8px; right: 8px; display: none; place-items: center; width: 26px; height: 26px; border-radius: 99px; background: var(--accent); color: #0b0b0c; }
.ob-opt .ob-check svg { width: 14px; height: 14px; }
.ob-opt[aria-checked="true"] .ob-check { display: grid; }
@media (min-width: 720px) { .ob-opts { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { .ob-opt .ob-art { aspect-ratio: 3 / 1; } .ob-opt .ob-opt-body { padding: 10px 14px 12px; } }
.ob-opt[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); background: var(--accent-subtle); }
.ob-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.ob-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--fg); font: inherit; font-weight: 600; cursor: pointer; }
.ob-chip svg { width: 14px; height: 14px; }
.ob-banner { width: 100%; aspect-ratio: 12 / 5; border-radius: var(--r); background: #0b0b0c center / cover no-repeat; border: 1px solid var(--border); }
@media (max-width: 640px) { .ob-banner { aspect-ratio: 2 / 1; } }
.ob-chip.own { border-color: var(--accent); background: var(--accent-subtle); padding-right: 6px; }
.ob-x { display: grid; place-items: center; width: 24px; height: 24px; border: 0; border-radius: 99px; background: none; color: var(--fg2); cursor: pointer; }
.ob-x:hover { color: var(--fg); background: var(--elev); }
.ob-x svg { width: 12px; height: 12px; }
.ob-chip[aria-checked="true"] { border-color: var(--accent); background: var(--accent-subtle); color: var(--fg); }
.ob-form .wrap { padding-top: 20px; padding-bottom: 120px; }
/* Owner artifact comment, November 19, 2026: players found Your details hard to get through, couldn't tell required from
   optional, and fill it on their phones in a hurry. Required fields first with a Required pill; optional ones folded away;
   a fixed Continue; 16 px inputs so phones don't zoom. */
.req-pill { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .2px; vertical-align: 1px; color: var(--accent); background: var(--accent-subtle); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
.ob-details { gap: 14px; }
.ob-sec { gap: 16px; }
.ob-sec-h { font-size: 17px; }
.ob-more summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; min-height: 44px; }
.ob-more summary::-webkit-details-marker { display: none; }
.ob-more[open] summary svg { transform: rotate(90deg); }
.ob .input { min-height: 48px; font-size: 16px; }
@media (max-width: 640px) { .ob-form .wrap { padding-left: 12px; padding-right: 12px; } .ob-sec.card { padding: 16px; } .ob-form .page-head h1 { font-size: 24px; } }
@media (max-width: 640px) {
  .top .nav { display: none; }
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: center; gap: 4px;
    padding: 6px max(12px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
    background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--border); }
  .dock button { flex: 1; max-width: 160px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px;
    border: 0; background: none; border-radius: var(--r); color: var(--fg2); font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .dock button svg { width: 22px; height: 22px; }
  .dock button[aria-current="page"] { color: var(--accent); background: var(--accent-subtle); }
  body { padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px)); }
}
.band-off { background: var(--warn-subtle); border-bottom: 1px solid var(--warn); font-size: 13px; }
.band-off .in { max-width: 1240px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-start; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.band-off svg { color: var(--warn); flex: none; margin-top: 2px; }
.band-off .in .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

/* Leaderboard */
.lb { display: flex; flex-direction: column; }

/* Owner, November 16, 2026: three leaderboards (annual, monthly, weekly), ordered by wins in the period. A mark beside the
   place shows a move since the previous period: up, down, or New. Hover or focus shows where the player was before. */
.lb-move { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 2px; min-width: 30px; height: 24px; font-family: var(--mono); font-size: 11px; font-weight: 700; color: var(--fg2); }

.lb-move.new { font-family: inherit; font-size: 10px; letter-spacing: .4px; text-transform: uppercase; color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-subtle); border-radius: 999px; padding: 0 6px; height: 20px; }
.lb-move[data-tip]::after { content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-30%); z-index: 5; width: max-content; max-width: 240px; padding: 6px 10px; border-radius: var(--r-sm); background: var(--fg); color: var(--bg); font: 600 12px/1.35 var(--font); letter-spacing: 0; text-transform: none; white-space: normal; opacity: 0; pointer-events: none; transition: opacity .12s; }
.lb-row:hover .lb-move[data-tip]::after, .lb-row:focus-visible .lb-move[data-tip]::after, .lb-move[data-tip]:hover::after { opacity: 1; }
.lb-wins { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; text-align: right; }
.lb-wins b { font-family: var(--mono); font-size: 15px; font-variant-numeric: tabular-nums; }
.lb-wins span { font-size: 12px; color: var(--fg2); }
.lb-tabs { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; }
.lb-head { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--fg2); border-bottom: 1px solid var(--border); padding-block: 6px; }
.lb-head span:first-child { text-align: right; }
.lb-head span:last-child { text-align: right; }
.lb-row { width: 100%; border: 0; background: transparent; text-align: left; border-radius: var(--r-sm); cursor: pointer; min-height: 56px; }
.lb-row + .lb-row { box-shadow: 0 -1px 0 var(--border); }
.lb-row:hover { background: var(--elev); }
.lb-row.me { background: var(--accent-subtle); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
.lb-pos { font-family: var(--mono); font-weight: 600; font-size: 15px; color: var(--fg2); text-align: right; font-variant-numeric: tabular-nums; }
/* Top three: a gold, silver or bronze medal for the position, a matching ring on the picture, and a tinted row. */
.lb-row.podium { --medal: var(--gold); min-height: 66px; background: linear-gradient(90deg, color-mix(in srgb, var(--medal) 15%, transparent), transparent 75%); }
.lb-row.p2 { --medal: var(--silver); }
.lb-row.p3 { --medal: var(--bronze); }
.lb-row.podium:hover { background: linear-gradient(90deg, color-mix(in srgb, var(--medal) 24%, transparent), var(--elev) 75%); }
.lb-row[aria-disabled="true"], .pod[aria-disabled="true"] { cursor: default; }
.lb-row[aria-disabled="true"]:hover { background: transparent; }
.lb-row.podium[aria-disabled="true"]:hover { background: linear-gradient(90deg, color-mix(in srgb, var(--medal) 15%, transparent), transparent 75%); }
.lb-row.podium .lb-pos { justify-self: end; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; font-weight: 700; color: var(--medal); background: color-mix(in srgb, var(--medal) 18%, var(--surface)); box-shadow: inset 0 0 0 2px var(--medal); }
.lb-row.podium .avatar { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--medal); }
.lb-row.podium .lb-name b { font-size: 16px; }
.lb-row.podium .lb-lv { color: var(--fg); }
/* Podium: a dark stage lit from below in the brand green, with pixel-notched steps and pixel type to match the
   pixel fire behind #1. Steps run 2nd–1st–3rd left to right; brightness, not metal colors, sets the order. */
:root { --pixel: "Silkscreen", var(--mono); }
.podium { position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 18px 18px 0; border-radius: 16px;
  border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border));
  background:
    radial-gradient(120% 70% at 50% 100%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 70%),
    repeating-linear-gradient(0deg, color-mix(in srgb, var(--accent) 7%, transparent) 0 1px, transparent 1px 8px),
    repeating-linear-gradient(90deg, color-mix(in srgb, var(--accent) 7%, transparent) 0 1px, transparent 1px 8px),
    var(--surface); }
.pod-head { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; }
.pod-head h2 { font-family: var(--pixel); font-weight: 700; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); }
.pod-stage { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 10px; padding-top: 40px; }
.pod { --glow: 30%; display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; padding: 0; border: 0; background: none; color: inherit; cursor: pointer; font: inherit; }
.pod.p1 { --glow: 100%; order: 2; }
.pod.p2 { --glow: 55%; order: 1; }
.pod.p3 { --glow: 38%; order: 3; }
.pod-who { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-width: 0; max-width: 100%; padding-inline: 4px; }
.pod-who .avatar { position: relative; z-index: 1; width: 64px; height: 64px; font-size: 20px; margin-bottom: 8px; border-radius: 50%;
  box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px color-mix(in srgb, var(--accent) var(--glow), var(--border-strong)); }
.pod.p1 .pod-who .avatar { width: 86px; height: 86px; font-size: 26px; border-radius: 50%;
  box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--accent), 0 0 32px 6px color-mix(in srgb, var(--accent) 50%, transparent); }
.pod-name { position: relative; z-index: 1; font-weight: 700; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.pod.p1 .pod-name { font-size: 18px; }
.pod-lv { position: relative; z-index: 1; font-size: 12px; font-weight: 600; color: var(--fg2); }
.pod.p1 .pod-lv { color: var(--accent); }
/* Steps: the notched polygon gives each block stepped pixel corners. */
.pod-step { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 12px; font-family: var(--pixel); line-height: 1;
  clip-path: polygon(0 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0, calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px, 100% 100%, 0 100%);
  color: color-mix(in srgb, var(--accent) var(--glow), var(--fg2));
  background:
    repeating-linear-gradient(0deg, transparent 0 7px, color-mix(in srgb, var(--accent) 12%, transparent) 7px 8px),
    linear-gradient(180deg, color-mix(in srgb, var(--accent) calc(var(--glow) * 0.42), var(--elev)), color-mix(in srgb, var(--accent) calc(var(--glow) * 0.12), var(--surface))); }
.pod-step b { font-size: 34px; font-weight: 700; }
.pod-step small { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
.pod.p1 .pod-step { height: 136px; color: var(--on-accent); background:
    repeating-linear-gradient(0deg, transparent 0 7px, color-mix(in srgb, var(--on-accent) 10%, transparent) 7px 8px),
    linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--surface))); }
.pod.p1 .pod-step b { font-size: 46px; }
.pod.p2 .pod-step { height: 100px; }
.pod.p3 .pod-step { height: 76px; }
.pod:hover .pod-name, .pod:focus-visible .pod-name { text-decoration: underline; text-underline-offset: 3px; }
.pod:hover .pod-step { filter: brightness(1.12); }
.pod.me .pod-name::after { content: " · You"; color: var(--accent); }
.fire { position: absolute; z-index: 0; left: 50%; bottom: calc(100% - 96px); transform: translateX(-50%); width: 180px; height: 150px; image-rendering: pixelated; pointer-events: none; }
/* Embers: a few pixels drifting up from the floor. */
.embers { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.embers i { position: absolute; bottom: -6px; width: 4px; height: 4px; background: var(--accent); opacity: 0; animation: ember 5s linear infinite; }
@keyframes ember { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: .9; } 100% { transform: translateY(-260px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .embers { display: none; } }
@media (max-width: 560px) {

  .pod-name { font-size: 13px; }
  .pod.p1 .pod-name { font-size: 14px; }

  .fire { width: 140px; height: 118px; bottom: calc(100% - 78px); }
}
.lb-name { min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 6px; row-gap: 2px; }

/* Rank */
.rank-main { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }

.ladder { display: flex; gap: 10px; }

@media (max-width: 480px) { .ladder-full .lrow { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.split { display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 2px; }

.split .b { background: color-mix(in srgb, var(--accent) 35%, var(--elev)); }
.legend { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.legend b { font-family: var(--mono); font-size: 18px; }

/* Profile */
.prof { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
@media (min-width: 920px) {
  .prof { grid-template-columns: 360px minmax(0, 1fr); }

}
.hero { display: flex; flex-direction: column; gap: 14px; }
/* Owner comment, November 11, 2026: the profile hero carries a public banner like Discord. */
/* #765 (owner, November 12, 2026): nothing overlaps the banner; it is 5:2, the ratio of the owner's banner photo. Only the banner pencil sits on it (own profile, Edit profile). */
.card.hero { padding-top: 0; overflow: hidden; }
.hero-top { position: relative; margin: 0 -16px; }
.hero-banner { aspect-ratio: 5 / 2; width: 100%; }

/* Predefined banners only (owner comment, November 11, 2026). Each is built from the theme tokens so both themes hold up. */
.bn-court { background: linear-gradient(135deg, var(--accent-dim), var(--accent) 55%, var(--accent-subtle)); }

.bn-stripe { background: repeating-linear-gradient(135deg, var(--accent-dim) 0 14px, var(--elev) 14px 28px); }
/* #765: the banner picker is a dialog like Profile picture: 5:2 tiles, 2 across on phones, 3 from 640 px. */
.banner-pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 640px) { .banner-pick { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.banner-opt { width: 100%; aspect-ratio: 5 / 2; border-radius: var(--r-sm); border: 2px solid var(--border); padding: 0; cursor: pointer; }
.banner-opt[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-subtle); }
.banner-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hero .who { display: flex; gap: 14px; align-items: center; min-width: 0; }

/* Owner, November 13, 2026 ("profile page card is inconsistent with the public profile dialog"): the profile card's top matches the
   profile dialog — the top half of the banner as a 5:1 strip, the picture centred on its bottom edge with a surface ring, and the
   name under the picture (nickname first, full name under it when there is one). */
.p-hero .hero-banner { aspect-ratio: 5 / 1; background-size: 100% 200%; background-position: top; }
.p-hero .who { flex-direction: column; align-items: flex-start; gap: 10px; margin-top: -56px; position: relative; z-index: 1; }

.p-hero .acts { grid-template-columns: minmax(0, 1fr); }

/* Edit profile › Name: the top of the panel mirrors the profile card (owner comment, November 11, 2026). */

.edit-hero .who { align-items: center; }
.hero h1 { overflow-wrap: anywhere; }
.avatar.xxl { width: 88px; height: 88px; border-radius: 50%; font-size: 30px; font-weight: 800; background: var(--accent); color: var(--on-accent); } /* circle: owner comment, November 11, 2026 */
.avatar.xxl.photo { background: var(--elev); }
.rtr-line { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--bg); min-width: 0; }

.links { display: flex; flex-direction: column; gap: 8px; }
.links a { display: flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--border); min-width: 0; }

.acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 8px; }

/* Games */
.sess { display: flex; flex-direction: column; gap: 4px; }

/* Player ID */

// ---------- Profiles, rank and eligibility ----------
function migsSessions() {
  const r = S.rank;
  if (r === 'below') return MIGS_SESSIONS.slice(0, 2);
  if (r === 'new') return [{ ...MIGS_SESSIONS[0], games: MIGS_SESSIONS[0].games.filter((g) => g.fmt !== 'Singles') }];
  if (r === 'reassess') return MIGS_SESSIONS.map((s) => ({ ...s, ago: s.ago + 100, pageGone: true }));
  return MIGS_SESSIONS;
}
const countedIn = (sessions, days) => sessions.filter((s) => s.ago <= days).reduce((n, s) => n + s.games.filter((g) => g.kind === 'counted').length, 0);
const countedAll = (sessions) => countedIn(sessions, Infinity);
const genCache = new Map();
function profileOf(pid) {
  if (S.accounts[pid]) {
    const a = S.accounts[pid];
    const sessions = pid === 'u1' ? migsSessions() : a.fresh ? [] : (genCache.get(pid) || genCache.set(pid, genSessions(pid, 7)).get(pid));
    const state = pid === 'u1' ? S.rank : a.fresh ? 'new' : 'below';
    return { ...a, state, level: state === 'new' ? null : a.level, sessions, recent: countedIn(sessions, WINDOW_DAYS) };
  }
  const m = /^b(\d+)$/.exec(pid || '');
  const e = m && BASE[+m[1]];
  if (!e) return null;
  if (!genCache.has(pid)) genCache.set(pid, genSessions(pid, e.recent));
  const sessions = genCache.get(pid);
  return { ...e, claimed: !e.unclaimed, state: 'eligible', style: '', expY: '', expM: '', social: {}, sessions, recent: countedIn(sessions, WINDOW_DAYS) };
}
// Visitors (not signed in) never see a private player or a guest: masked and not opened (D-2026-11-09-07).
// Proposed (#715): an always-private player stays masked for signed-in players too; the player sees their own profile.
const hiddenFromViewer = (p) => !!p && p.id !== S.me && (!!p.alwaysPrivate || (!S.me && !!(p.profilePrivate || p.guest)));
// D-2026-11-16-04: an unclaimed player (saved by a club with an email, not registered yet) is public and carries this mark.
const isUnclaimed = (p) => !!p && p.claimed === false;
const savedByName = (p) => (CLUB_DIR[p.savedBy] || CLUB_DIR.c1).name; // Jomar was saved by Lahug Smash Club
const unclaimedChip = () => chip('Not registered yet', 'warn');
const maskName = (name) => name.split(/\s+/).filter(Boolean).map((w) => `${w[0]}***`).join(' ');
const maskedView = (e) => ({ id: e.id, name: maskName(e.name), nick: '', photo: e.photo, face: e.face, photoUrl: e.photoUrl, level: e.level }); // picture stays visible: D-2026-11-11-11
// Migs joins the list only while his own figures qualify; everyone else is filtered by the current threshold.
const migsOnBoard = () => S.rank !== 'new' && S.rank !== 'reassess' && countedIn(migsSessions(), WINDOW_DAYS) >= T();
function boardList() {
  if (S.board === 'empty') return [];
  const out = [];
  const migs = migsOnBoard();
  BASE.forEach((e, i) => {
    if (i === MIGS_SLOT && migs) out.push({ id: 'u1', name: S.accounts.u1.name, nick: S.accounts.u1.nick, photo: S.accounts.u1.photo, face: S.accounts.u1.face, photoUrl: S.accounts.u1.photoUrl, level: S.accounts.u1.level, profilePrivate: S.accounts.u1.profilePrivate, alwaysPrivate: S.accounts.u1.alwaysPrivate });
    if (e.recent >= T()) out.push(e);

}
// Owner, November 16, 2026: the leaderboards are just by wins. Every player with a standard match in the period can be
// on a list; the 10-match rule no longer decides who is listed. (boardList keeps the older qualified set for the
// rank status text.)
function boardAll() {
  if (S.board === 'empty') return [];
  const out = [];
  const migs = migsOnBoard();
  BASE.forEach((e, i) => {
    if (i === MIGS_SLOT && S.rank !== 'new') out.push({ id: 'u1', name: S.accounts.u1.name, nick: S.accounts.u1.nick, photo: S.accounts.u1.photo, face: S.accounts.u1.face, photoUrl: S.accounts.u1.photoUrl, level: S.accounts.u1.level, profilePrivate: S.accounts.u1.profilePrivate, alwaysPrivate: S.accounts.u1.alwaysPrivate });

function rankStatus(p, pos) {
  const t = T(), own = p.id === S.me, first = own ? 'you' : firstName(p), plays = own ? 'play' : 'plays', has = own ? 'You now have' : `${firstName(p)} now has`;
  if (p.level == null) return { chips: chip('Not calculated'), text: `ROTRA calculates a rank once a club has assessed ${first} and a session with that assessment is done. Until then there is no rank to show.` };
  if (p.state === 'reassess') return { chips: chip('Needs reassessment', 'warn'), stale: true, text: `Last played more than three months ago, so this rank is out of date. A club gives ${first} a fresh assessment to bring it up to date.` };
  if (p.recent >= t) return { chips: p.state === 'processing' ? chip('Updating', 'warn') : '', text: '' };
  return { chips: chip('Provisional'), text: `This rank is still settling: ${p.recent} of ${t} standard matches in the last three months.` };
}

}

// old overall list, so a profile's position is its annual place. The prototype makes the monthly and weekly numbers up.
const LB_PERIODS = [['year', 'Top annual'], ['month', 'Top monthly'], ['week', 'Top weekly']];

// Pixel fire (the classic spreading-flame effect) drawn in the brand green. The canvas is tiny and scaled up
// with crisp pixels; colors come from the --accent token so it follows the theme. Reduced motion gets one still frame.
const FIRE = { w: 48, h: 40, buf: null, raf: 0, last: 0, key: '', pal: [] };
function firePalette() {
  const acc = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const dark = isDark();
  const key = acc + dark;
  if (key === FIRE.key) return FIRE.pal;
  const hex = /^#([0-9a-f]{6})$/i.exec(acc);
  const [r, g, b] = hex ? [0, 2, 4].map((k) => parseInt(hex[1].slice(k, k + 2), 16)) : [0, 255, 136];
  const mix = (c, t, to) => Math.round(c + (to - c) * t);
  FIRE.pal = Array.from({ length: 37 }, (_, i) => {
    const t = i / 36;
    if (i === 0) return [0, 0, 0, 0];
    const base = t < 0.55 ? [r, g, b].map((c) => mix(c * 0.35, t / 0.55, c)) : [r, g, b].map((c) => mix(c, (t - 0.55) / 0.45 * (dark ? 0.75 : 0.35), 255));
    return [...base, t < 0.12 ? 0 : Math.round(255 * Math.min(1, (t - 0.12) * 2.2))];
  });
  FIRE.key = key;
  return FIRE.pal;
}
function fireStep() {
  const { w, h } = FIRE;
  if (!FIRE.buf) {
    FIRE.buf = new Uint8Array(w * h);
    // Only the middle of the bottom row burns, which shapes the flames into a tongue behind the picture.
    for (let x = 0; x < w; x++) { const d = Math.abs(x - w / 2) / (w / 2); FIRE.buf[(h - 1) * w + x] = d < 0.3 ? 36 : d < 0.62 ? Math.round(36 * (1 - (d - 0.3) / 0.32)) : 0; }
  }
  const buf = FIRE.buf;
  for (let x = 0; x < w; x++) {
    for (let y = 1; y < h; y++) {
      const src = y * w + x;
      const v = buf[src];
      if (!v) { buf[src - w] = 0; continue; }
      const rnd = Math.floor(Math.random() * 4);
      const dst = src - rnd + 1 - w;
      // Cooling a little over one step per row keeps the flames inside the canvas and ragged at the tips.
      if (dst >= 0) buf[dst] = Math.max(0, v - (rnd & 1) - (Math.random() < 0.55 ? 1 : 0));
    }
  }
}
function fireDraw(c) {
  const ctx = c.getContext('2d');
  const pal = firePalette();
  const { w, h } = FIRE;
  const img = ctx.createImageData(w, h);
  FIRE.buf.forEach((v, i) => {
    const p = pal[v] || pal[0];
    const x = i % w;
    // Fade the sides so the burn reads as a tongue of flame, not a block.
    const side = Math.max(0, 1 - ((x - w / 2) / (w * 0.42)) ** 2);
    img.data.set([p[0], p[1], p[2], Math.round(p[3] * side)], i * 4);
  });
  ctx.putImageData(img, 0, 0);
}
function fireTick(ts) {
  const c = document.getElementById('fire');
  if (!c) { FIRE.raf = 0; return; }
  if (ts - FIRE.last > 60) { fireStep(); fireDraw(c); FIRE.last = ts; }
  FIRE.raf = requestAnimationFrame(fireTick);
}
function startFire() {
  const c = document.getElementById('fire');
  if (!c) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    if (!FIRE.buf) for (let i = 0; i < 60; i++) fireStep();
    fireDraw(c);
    return;
  }
  if (!FIRE.buf) for (let i = 0; i < 40; i++) fireStep();
  fireDraw(c);
  if (!FIRE.raf) FIRE.raf = requestAnimationFrame(fireTick);
}

// Experience: Years + months and Playing since are two views of one value; typing either fills the other.
// Saved as Playing since, so the years and months stay right as time passes.
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function linkExperience(el) {
  const pre = el.dataset.exp, key = el.id.slice(pre.length + 1);
  const box = (k) => document.getElementById(`${pre}-${k}`);
  const put = (k, v) => { const i = box(k); if (i) { i.value = v; setPath(i.dataset.bind, v); } };
  const now = new Date(), nowM = now.getFullYear() * 12 + now.getMonth();
  if (key === 'expY' || key === 'expM') {
    const y = box('expY').value.trim(), m = box('expM').value.trim();
    if (!y && !m) { put('sinceM', ''); put('sinceY', ''); return; }
    if (!/^\d*$/.test(y) || !/^\d*$/.test(m) || +m > 11) return;
    const t = nowM - ((+y || 0) * 12 + (+m || 0));
    put('sinceM', String((t % 12) + 1)); put('sinceY', String(Math.floor(t / 12)));
  } else {
    const mo = box('sinceM').value, yr = box('sinceY').value.trim();
    if (!mo || !/^\d{4}$/.test(yr)) return;
    const diff = nowM - (+yr * 12 + (+mo - 1));
    if (diff < 0) return;
    put('expY', String(Math.floor(diff / 12))); put('expM', String(diff % 12));
  }
}
const expText = (p) => {
  // Playing since wins when set: the years and months keep counting from it.
  const since = p.sinceM && p.sinceY ? new Date().getFullYear() * 12 + new Date().getMonth() - (+p.sinceY * 12 + (+p.sinceM - 1)) : null;
  const y = since != null ? Math.floor(since / 12) : +p.expY || 0, m = since != null ? since % 12 : +p.expM || 0;
  if (!y && !m) return '';
  return [y && `${y} ${y === 1 ? 'year' : 'years'}`, m && `${m} ${m === 1 ? 'month' : 'months'}`].filter(Boolean).join(', ') + ' playing';
};

// ---------- P-ID-QR ----------
function qrSVG(text) {
  if (typeof qrcode !== 'function') return null;
  try {
    const q = qrcode(0, 'M');
    q.addData(text); q.make();
    const n = q.getModuleCount(), pad = 2;
    let d = '';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + pad} ${r + pad}h1v1h-1z`;
    return `<svg viewBox="0 0 ${n + pad * 2} ${n + pad * 2}" shape-rendering="crispEdges" aria-hidden="true"><path d="${d}" fill="currentColor"/></svg>`;
  } catch (e) { return null; }
}
function viewId() {

  const [, cc, city, date, seq] = p.rtr.split('-');
  const dt = new Date(2000 + +date.slice(4), +date.slice(0, 2) - 1, +date.slice(2, 4));
  const code = qrSVG(p.rtr);
  return `<main class="wrap slim">
    <div class="page-head">${backBtn('openProfile', 'My profile', p.id)}<h1>My player ID</h1>
      <p class="muted">Show this to a club so they can find your profile without your phone number.</p></div>
    <section class="card stack" style="align-items:stretch;gap:16px">
      ${code ? `<div class="qr" role="img" aria-label="QR code for player ID ${esc(p.rtr)}">${code}</div>` : `<div class="qr missing">The QR code couldn't be drawn here. Read the ID out or let the club type it.</div>`}
      <p class="id-big" id="rtr-big">${esc(p.rtr)}</p>
      <div class="row" style="justify-content:center"><button class="btn sm" data-act="copyId" data-id="${p.id}" data-big="1">${I.copy} Copy ID</button></div>
      <p class="small muted" style="text-align:center">The code holds only this ID. It doesn't contain your phone, email or sign-in details, and scanning it doesn't sign anyone in or reserve a slot.</p>
    </section>
    <section class="card stack"><h2>What the ID means</h2>
      <div class="rtr-parts">
        <div><code>RTR</code><span>ROTRA</span></div><div><code>${esc(cc)}</code><span>Country</span></div>
        <div><code>${esc(city)}</code><span>City of the club that added you</span></div>
        <div><code>${esc(date)}</code><span>First synced ${dt.toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' })}</span></div>
        <div><code>${esc(seq)}</code><span>Order that day in that city</span></div></div>
      <p class="small muted">Your ID never changes, even if you move, play for another club, or change your phone or email.</p>
      ${!S.online ? notice('warn', 'Saved on this device. A club seeing you for the first time may need internet to look you up.') : ''}
    </section>
  </main>`;
}

// ---------- P-PHONE-PRIVACY + P-CONTACT-REQUEST ----------
const REQ_FIELD = { phone: 'Phone number', email: 'Email' };
const REQ = {
  submitted: { chip: 'Waiting for review', k: 'warn' },
  applying: { chip: 'Approved · being applied', k: 'warn' },
  applied: { chip: 'Applied', k: 'ok' },
  failed: { chip: 'Needs attention', k: 'bad' },
  rejected: { chip: 'Not approved', k: '' },
};
function requestCard(p) {
  const r = S.requests[p.id];
  if (!r) return '';
  const f = REQ_FIELD[r.field].toLowerCase();
  const rv = (x) => esc(r.field === 'phone' ? maskPhone(x) : x);
  const text = {
    submitted: `You asked to change your ${f} to <b>${rv(r.to)}</b>. Changes take effect only after Admin approval. Until then, keep signing in with <span class="mono">${rv(r.from)}</span>.`,
    applying: `Approved. Your new ${f} is being set up. Keep signing in with <span class="mono">${rv(r.from)}</span> until this says Applied.`,
    applied: `Your ${f} is now <b>${rv(r.to)}</b>. Your player ID and game history stay the same.`,
    failed: `The change was approved but couldn't be applied yet. You still sign in with <span class="mono">${rv(r.from)}</span>. ROTRA will retry or contact you.`,
    rejected: `The platform owner didn't approve changing your ${f} to ${rv(r.to)}. Your current ${f} stays. You can send a new request.`,
  }[r.status];
  return `<div class="notice ${r.status === 'applied' ? 'ok' : r.status === 'failed' ? 'bad' : r.status === 'rejected' ? '' : 'warn'}">${r.status === 'applied' ? I.check : I.info}<div class="stack tight"><div class="row">${chip(REQ[r.status].chip, REQ[r.status].k)}<span class="small muted">${REQ_FIELD[r.field]} change · sent ${fmtTime(r.at)}</span></div><p>${text}</p></div></div>`;
}
// Proposed (#715): three profile visibility levels. Public sets neither flag, Private sets profilePrivate, Always private sets both.
const VIS = [
  ['public', 'Public', 'Visitors and signed-in ROTRA players see your profile.'],
  ['private', 'Private', 'Visitors see your name masked. Signed-in ROTRA players see your profile.'],
  ['always', 'Always private', 'Everyone sees your name masked; your picture and banner stay visible. Only the Queue Master of a session you join sees your name.'],
];
const VIS_LABEL = { public: 'public', private: 'private', always: 'always private' };
function viewAccount() {
  if (!S.me) return viewLogin();
  const p = profileOf(S.me);
  const r = S.requests[p.id];
  const open = r && ['submitted', 'applying', 'failed'].includes(r.status);
  const savedText = p.phoneHidden ? 'Saved: your phone number is hidden from clubs.' : 'Saved: clubs can see your phone number.';
  const vis = p.alwaysPrivate ? 'always' : p.profilePrivate ? 'private' : 'public';
  return `<main class="wrap slim">
    <div class="page-head">${backBtn('openProfile', 'My profile', p.id)}<h1>Privacy and contact</h1></div>
    <section class="card stack"><h2>Profile visibility</h2>
      <div class="choices" role="radiogroup" aria-label="Profile visibility">${VIS.map(([k, l, h]) => `<button type="button" class="choice" role="radio" aria-checked="${vis === k}" data-act="setVisibility" data-v="${k}" ${S.ui.profilePending ? 'disabled aria-busy="true"' : ''}><span class="dot" aria-hidden="true"></span><span class="stack tight"><b>${l}</b><span class="small muted">${h}</span></span></button>`).join('')}</div>
      <p class="small" aria-live="polite">${S.ui.profilePending ? 'Saving…' : esc(`Saved: your profile is ${VIS_LABEL[vis]}.`)}</p>
      ${S.ui.profileErr ? notice('bad', esc(S.ui.profileErr)) : ''}
    </section>
    <section class="card stack"><h2>Stats on your profile</h2>
      <p class="small muted" style="margin:0">Both are on unless you turn them off. Turning one off hides it from everyone else; you still see it on your own profile.</p>
      <div class="setting"><div class="main stack tight"><label for="sw-stats" style="font-weight:700">Show my profile stats</label>
        <p class="small muted">Latest stats on your profile card: win rate, games, wins and losses this year.</p></div>
        ${sw(!p.hideStats, 'toggleStatsVis', 'Show my profile stats', 'id="sw-stats"')}</div>
      <div class="setting"><div class="main stack tight"><label for="sw-weekly" style="font-weight:700">Show my weekly performance</label>
        <p class="small muted">The wins and losses by day of the week chart on your profile and your Games page.</p></div>
        ${sw(!p.hideWeekly, 'toggleWeeklyVis', 'Show my weekly performance', 'id="sw-weekly"')}</div>
      <p class="small" aria-live="polite">${esc(`Saved: profile stats ${p.hideStats ? 'hidden' : 'shown'}, weekly performance ${p.hideWeekly ? 'hidden' : 'shown'}.`)}</p>
    </section>
    <section class="card stack"><h2>Player Information</h2>
      <div class="setting"><div class="main stack tight"><label for="sw-dir" style="font-weight:700">Hide me from Player Information</label>
        <p class="small muted">Clubs can't find you in the Player Information search or by RTR ID. Clubs that already saved you can still add you. You join sessions yourself.</p></div>
        ${sw(p.hiddenDir, 'toggleDirectory', 'Hide me from Player Information', `id="sw-dir" ${S.ui.dirPending ? 'disabled aria-busy="true"' : ''}`)}</div>
      <p class="small" aria-live="polite">${S.ui.dirPending ? 'Saving…' : esc(p.hiddenDir ? 'Saved: you are hidden from Player Information.' : 'Saved: clubs can find you in Player Information.')}</p>
      ${S.ui.dirErr ? notice('bad', esc(S.ui.dirErr)) : ''}
    </section>
    <section class="card stack"><h2>Phone privacy</h2>
      <div class="setting"><div class="main stack tight"><label for="sw-phone" style="font-weight:700">Hide my phone number from clubs</label>
        <p class="small muted">Clubs can find you by your player ID or QR code instead. Your phone and email are never on your public profile or the leaderboard, whatever this is set to.</p></div>
        ${sw(p.phoneHidden, 'togglePrivacy', 'Hide my phone number from clubs', `id="sw-phone" ${S.ui.privacyPending ? 'disabled aria-busy="true"' : ''}`)}</div>
      <p class="small" aria-live="polite">${S.ui.privacyPending ? 'Saving…' : esc(savedText)}</p>
      ${S.ui.privacyErr ? notice('bad', esc(S.ui.privacyErr)) : ''}
      <p class="small muted">Hiding your number applies from now on. It can't erase what a club has already seen, and a club device that's offline updates when it reconnects. It doesn't change how you sign in.</p>
    </section>
    <section class="card stack"><h2>Sign-in methods</h2>
      <div class="method"><div class="who2"><span class="ico">${G_MARK}</span><div class="stack tight" style="min-width:0"><b>Google</b><span class="small muted" style="overflow-wrap:anywhere">${p.google ? `Connected · ${esc(p.google)}${p.google.toLowerCase() !== p.email.toLowerCase() ? ' (different from your ROTRA email)' : ''}` : 'Not connected'}</span></div></div>
        ${p.google ? `<span class="row">${chip('Required')}<button class="btn sm" data-act="google" data-ctx="connect">Change</button></span>` : `<button class="btn sm primary" data-act="google" data-ctx="connect">Connect Google</button>`}</div>
      <div class="method"><div class="who2"><span class="ico">${I.lock}</span><div class="stack tight" style="min-width:0"><b>Email and password</b><span class="small muted" style="overflow-wrap:anywhere">${p.hasPassword === false ? 'Not used' : p.google ? `Backup only until ${G_DEADLINE}` : `Password set · ${esc(p.email)}`}</span></div></div></div>
      <p class="small muted" style="margin:0">Google sign-in is required for every ROTRA player. Any Google account you own works, even with a different email. Your ROTRA email stays ${esc(p.email)}.</p>
      <div class="between" style="padding-top:12px;border-top:1px solid var(--border)"><span class="small">Account verification is in its own page.</span><button class="btn sm" data-act="go" data-to="verify">${verifyChip(S.accounts[S.me])}</button></div>
    </section>
    <section class="card stack"><h2>Contact details</h2>
      <dl class="kv"><dt>Phone</dt><dd class="mono">${esc(maskPhone(p.phone))}</dd><dt>Email</dt><dd style="overflow-wrap:anywhere">${esc(p.email)}</dd></dl>
      <p class="small muted">You sign in with your email. To change them, ask the ROTRA platform owner. Changes take effect only after Admin approval.</p>
      ${requestCard(p)}
      <div class="row">${open ? '' : '<button class="btn sm" data-act="openRequest">Request a change</button>'}</div>
    </section>
    <section class="card between"><div><h3>Sign out</h3><p class="small muted">Your public profile stays visible.</p></div><button class="btn sm danger" data-act="signOut">Sign out</button></section>
  </main>`;
}

const editFields = (p) => ({ name: p.name, nick: p.nick || '', gender: p.gender || '', style: p.style || '', courtPos: p.courtPos || '', skills: [...(p.skills || [])], skillsOther: [...(p.skillsOther || [])], fav: p.fav || '', favOther: p.favOther || '', expY: p.expY ?? '', expM: p.expM ?? '', sinceM: p.sinceM ?? '', sinceY: p.sinceY ?? '', facebook: p.social.facebook || '', instagram: p.social.instagram || '', youtube: p.social.youtube || '', linkedin: p.social.linkedin || '' });

const courtLabel = (k) => (COURT_POS.find(([x]) => x === k) || [])[1] || '';
const favLabel = (p) => (p.fav === 'other' ? p.favOther : (FAV_PLAYERS.find(([x]) => x === p.fav) || [])[1]) || '';
const pickCourt = (base, d) => `<div class="ob-opts" role="radiogroup" aria-label="Where you play">${COURT_POS.map(([k, l, t]) => `<button type="button" class="ob-opt has-art" role="radio" aria-checked="${d.courtPos === k}" data-act="pickSet" data-path="${base}.courtPos" data-v="${k}"><span class="ob-art" style="background-image:url('${COURT_POS_ART[k]}')" aria-hidden="true"></span><span class="ob-opt-body"><b>${l}</b><span class="small muted">${t}</span></span><i class="ob-check" aria-hidden="true">${I.check}</i></button>`).join('')}</div>`;

const pickSkills = (base, d) => { const id = base.replace(/\W/g, '-'), mine = d.skillsOther || [];
  return `<div class="ob-chips" role="group" aria-label="Shots you know">${SKILLS.map(([k, l]) => `<button type="button" class="ob-chip" role="checkbox" aria-checked="${(d.skills || []).includes(k)}" data-act="pickToggle" data-path="${base}.skills" data-v="${k}">${(d.skills || []).includes(k) ? I.check : ''}${l}</button>`).join('')}
    ${mine.map((t, i) => `<span class="ob-chip own" aria-checked="true">${I.check}${esc(t)}<button type="button" class="ob-x" data-act="skillRemove" data-path="${base}" data-i="${i}" aria-label="Remove ${esc(t)}">${I.x}</button></span>`).join('')}

const fieldsExp = (base, d, e, pre) => `

const fieldsLinks = (base, d, e, pre) => `<p class="hint">Optional. Links describe you to others; you can't sign in with them. Whether links are public is still being decided.</p>

function personalFields(base, d, e, pre) {

// Edit profile sections: a menu on the left on wide screens, tabs across the top on phones. All sections share
// one draft and one Save, so switching sections never loses edits.
// Predefined profile banners (owner comment, November 11, 2026): players pick one; nothing is uploaded.
const BANNERS = [['court', 'Court'], ['night', 'Night'], ['dusk', 'Dusk'], ['ember', 'Ember'], ['sun', 'Sun'], ['stripe', 'Stripe']];
// Owner comment, November 13, 2026: the default banner is the one Admin › Profile banners marks Default (Court in this prototype).
const DEFAULT_BANNER = 'court';
const bannerOf = (p) => BANNERS.some(([k]) => k === p.banner) ? p.banner : DEFAULT_BANNER;
const EDIT_TABS = [
  { id: 'basics', label: 'Name', intro: 'How you appear on the leaderboard and your profile.', keys: ['name', 'nick', 'gender'], body: fieldsBasics },
  { id: 'game', label: 'Playing style', intro: 'Help clubs and other players know your game.', keys: ['courtPos', 'skills', 'fav', 'favOther', 'expY', 'expM', 'sinceM', 'sinceY'], body: fieldsGame },
  { id: 'links', label: 'Links', intro: 'Social pages shown on your profile.', keys: Object.keys(SOCIAL), body: fieldsLinks },
  { id: 'account', label: 'Account', intro: 'Private details you sign in with, and your permanent player ID.', keys: [] },
];
function viewEdit() {
  if (!S.me) return viewLogin();
  const p = profileOf(S.me);
  if (!S.ui.edit) { S.ui.edit = editFields(p); S.ui.editOrig = editFields(p); }
  const e = S.ui.editErr, d = S.ui.edit, o = S.ui.editOrig;
  const tab = EDIT_TABS.find((t) => t.id === S.ui.editTab) || EDIT_TABS[0];
  const errs = (t) => t.keys.filter((k) => e[k]).length;
  const dirty = (t) => t.keys.some((k) => String(d[k]) !== String(o[k]));
  const body = tab.id === 'account'
    ? `<dl class="kv"><dt>Phone</dt><dd class="mono">${esc(maskPhone(p.phone))}</dd><dt>Email</dt><dd style="overflow-wrap:anywhere">${esc(p.email)}</dd><dt>Player ID</dt><dd class="mono" style="overflow-wrap:anywhere">${esc(p.rtr)}</dd></dl>
      <p class="small muted">You can't edit these here. Phone and email changes go to the ROTRA platform owner for approval; your player ID never changes.</p>
      <div class="row"><button type="button" class="btn sm" data-act="openRequest">Request a phone or email change</button><button type="button" class="btn sm ghost" data-act="go" data-to="account">Phone privacy</button></div>
      <p class="hint">Rank, club levels and game results come from clubs and can't be changed by players.</p>`
    : (tab.id === 'basics' ? `<div class="hero edit-hero" aria-label="Profile card preview">
        <div class="hero-top"><div class="hero-banner bn-${esc(bannerOf(p))}" aria-hidden="true"></div><button type="button" class="bn-cam" data-act="openBanner" aria-label="Change banner" title="Change banner">${I.edit}</button></div>
        <div class="who"><span class="av-edit">${avatar(p, 'xxl', true)}<button type="button" class="av-cam" data-act="openAvatar" aria-label="Change profile picture" title="Change profile picture">${I.edit}</button></span><div style="min-width:0" class="stack tight"><b style="font-size:20px">${esc((d.name || '').trim() || p.name)}</b>${(d.nick || '').trim() ? `<span class="muted">“${esc(d.nick.trim())}”</span>` : ''}</div></div>
        <p class="hint" style="margin:0">This is how the top of your profile card looks. Tap a pencil to change your picture or banner.</p>
      </div>` : '') + tab.body('ui.edit', d, e, 'ed');
  return `<main class="wrap mid">
    <div class="page-head">${backBtn('cancelEdit', 'My profile')}<h1>Edit profile</h1>
      <p class="muted">Fields marked public appear on your profile for anyone to see.</p></div>
    <div class="edit-grid">
      <nav class="edit-nav" role="tablist" aria-label="Profile sections">${EDIT_TABS.map((t) => `<button type="button" role="tab" id="etab-${t.id}" aria-selected="${t.id === tab.id}" aria-controls="epanel" data-act="editTab" data-v="${t.id}">
        <span>${t.label}</span>${errs(t) ? `<span class="chip bad" aria-label="${errs(t)} to fix">${errs(t)}</span>` : dirty(t) ? '<i class="edit-dot" title="Unsaved changes" aria-label="Unsaved changes"></i>' : ''}</button>`).join('')}</nav>
      <form class="card stack edit-panel" id="epanel" role="tabpanel" aria-labelledby="etab-${tab.id}" data-form="edit" novalidate>
        <div class="stack tight"><h2>${tab.label}</h2><p class="small muted">${tab.intro}</p></div>
        ${S.ui.editFail ? notice('bad', esc(S.ui.editFail)) : ''}
        ${Object.keys(e).length ? notice('bad', `Some details need fixing: ${EDIT_TABS.filter(errs).map((t) => t.label).join(', ')}.`) : ''}
        ${body}
        <div class="edit-save"><span class="small muted">${editDirty() ? 'Unsaved changes' : 'No changes yet'}</span>
          <div class="row"><button type="button" class="btn" data-act="cancelEdit">Cancel</button><button class="btn primary" type="submit" ${S.ui.editPending ? 'disabled' : ''}>${S.ui.editPending ? 'Saving…' : 'Save changes'}</button></div></div>
      </form>
    </div>
  </main>`;
