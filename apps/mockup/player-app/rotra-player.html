<style>
/* Layout: public player directory. One top bar with the two places people go (leaderboard, own profile); profiles put
   the identity card beside rank, eligibility and games on wide screens and stack on phones.
   Tokens and base components are copied from the Queue prototype (apps/client globals.css: dark default, light toggleable). */
:root {
  --bg: #0b0b0c; --surface: #1a1a1d; --elev: #2a2a2e; --overlay: #3a3a3f;
  --fg: #f0f0f2; --fg2: #9090a0; --fg3: #5a5a66;
  --accent: #00ff88; --accent-dim: #00cc6a; --accent-subtle: rgba(0, 255, 136, 0.13); --on-accent: #0b0b0c;
  --error: #ff4d4d; --error-subtle: rgba(255, 77, 77, 0.12); --warn: #ffb800; --warn-subtle: rgba(255, 184, 0, 0.12);
  --border: #2a2a2e; --border-strong: #404048; --scrim: rgba(0, 0, 0, 0.6);
  --font: "Satoshi", "Manrope", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  --r: 10px; --r-sm: 6px;
  --court: #14603f; --court-line: rgba(255, 255, 255, 0.85); --court-free: #232328; --court-free-line: rgba(255, 255, 255, 0.16);
  --shadow: none; --knob: var(--fg); --field: var(--bg);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  /* Light: white cards on a soft off-white page, a deeper green that reads as text and carries white labels (AA). */
  --bg: #f4f5f2; --surface: #ffffff; --elev: #eef0ec; --overlay: #dfe3dc;
  --fg: #121513; --fg2: #535a54; --fg3: #7a817b;
  --accent: #0a7d44; --accent-dim: #086a39; --accent-subtle: rgba(10, 125, 68, 0.09); --on-accent: #ffffff;
  --error: #c62828; --error-subtle: rgba(198, 40, 40, 0.07); --warn: #a35600; --warn-subtle: rgba(217, 119, 6, 0.09);
  --border: #e2e5df; --border-strong: #cdd2c9; --scrim: rgba(18, 21, 19, 0.4);
  --court: #2e8b57; --court-line: #ffffff; --court-free: #e8ebe5; --court-free-line: rgba(18, 21, 19, 0.14);
  --shadow: 0 1px 2px rgba(18, 24, 20, 0.05), 0 2px 8px rgba(18, 24, 20, 0.04); --knob: #ffffff; --field: #ffffff;
  color-scheme: light;
} }
:root[data-theme="light"] {
  /* Light: white cards on a soft off-white page, a deeper green that reads as text and carries white labels (AA). */
  --bg: #f4f5f2; --surface: #ffffff; --elev: #eef0ec; --overlay: #dfe3dc;
  --fg: #121513; --fg2: #535a54; --fg3: #7a817b;
  --accent: #0a7d44; --accent-dim: #086a39; --accent-subtle: rgba(10, 125, 68, 0.09); --on-accent: #ffffff;
  --error: #c62828; --error-subtle: rgba(198, 40, 40, 0.07); --warn: #a35600; --warn-subtle: rgba(217, 119, 6, 0.09);
  --border: #e2e5df; --border-strong: #cdd2c9; --scrim: rgba(18, 21, 19, 0.4);
  --court: #2e8b57; --court-line: #ffffff; --court-free: #e8ebe5; --court-free-line: rgba(18, 21, 19, 0.14);
  --shadow: 0 1px 2px rgba(18, 24, 20, 0.05), 0 2px 8px rgba(18, 24, 20, 0.04); --knob: #ffffff; --field: #ffffff;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.3px; }
h1 { font-size: 26px; font-weight: 800; line-height: 1.2; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.mono { font-family: var(--mono); font-size: 0.92em; }
.muted { color: var(--fg2); }
.small { font-size: 13px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--fg2); }
.tnum { font-variant-numeric: tabular-nums; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.top-in { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: baseline; gap: 8px; font-weight: 800; letter-spacing: 1.5px; font-size: 17px; }
.brand b { color: var(--accent); }
.brand span { font-weight: 600; letter-spacing: 0; color: var(--fg2); font-size: 14px; }
.top .grow { flex: 1; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
button.conn { background: transparent; cursor: pointer; min-height: 32px; }
button.conn:hover { border-color: var(--accent); background: var(--surface); }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.sync-head { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-subtle); }
.sync-head > i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 7px; flex: none; }
.sync-head.off { border-color: var(--warn); background: var(--warn-subtle); }
.sync-head.off > i { background: var(--warn); }
.sync-head.sync > i { animation: pulse 1s infinite; }
@media (prefers-reduced-motion: reduce) { .sync-head.sync > i { animation: none; } }
.sync-grp { display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--bg); }
.sync-grp.wait { border-color: var(--warn); }
.sync-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.sync-list li { display: flex; justify-content: space-between; gap: 12px; min-width: 0; }
.sync-list li > span:first-child { overflow-wrap: anywhere; }
.conn.off i { background: var(--warn); }
.conn.sync i { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .conn.sync i { animation: none; } }

.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.narrow { max-width: 760px; }
.crumb { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-weight: 600; text-align: center; }
.btn:hover:not(:disabled) { background: var(--elev); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-dim); }
.btn.danger { border-color: var(--error); color: var(--error); background: transparent; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--elev); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.xs { min-height: 32px; padding: 0 10px; font-size: 13px; border-radius: var(--r-sm); }
.btn.block { width: 100%; }
.btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-subtle); }
.btn.primary[aria-pressed] { background: var(--accent); }
.icon-btn { min-width: 36px; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.tight { gap: 6px; }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; min-width: 0; box-shadow: var(--shadow); }
.card.hl { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-subtle) inset; }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--border); }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; min-width: 0; }
.li .main { flex: 1; min-width: 0; }
.li.click { cursor: pointer; }
.card.li { padding: 14px 16px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--fg2); white-space: nowrap; }
.chip.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-subtle); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-subtle); }
.chip.bad { color: var(--error); border-color: color-mix(in srgb, var(--error) 45%, transparent); background: var(--error-subtle); }
.chip.solid { background: var(--elev); color: var(--fg); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--elev); color: var(--fg2); flex: none; }
.avatar.lg { width: 52px; height: 52px; font-size: 18px; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-weight: 800; }
.avatar.photo { background: var(--elev); overflow: hidden; }
.avatar.photo svg { width: 100%; height: 100%; display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.avatar.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.av-edit { position: relative; flex: none; display: block; }
.av-edit .av-cam { position: absolute; right: -6px; bottom: -6px; width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--surface); background: var(--accent); color: var(--on-accent); display: grid; place-items: center; cursor: pointer; padding: 0; }
.av-cam svg { width: 16px; height: 16px; }
.av-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
.av-pick { padding: 4px; border: 2px solid transparent; border-radius: 16px; background: none; cursor: pointer; display: grid; place-items: center; }
.av-pick[aria-pressed="true"] { border-color: var(--accent); }
.av-pick .avatar { width: 56px; height: 56px; }
.cmp-game { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px 0; border-top: 1px solid var(--border); }
.cmp-game .cmp-row3 { align-self: stretch; display: grid; grid-template-columns: 40% 30% 30%; align-items: center; gap: 0; }
.cmp-row3 > * { min-width: 0; padding-right: 8px; }
.cmp-row3 > .cmp-court { padding-right: 0; }
.cmp-info { display: flex; flex-direction: column; gap: 2px; padding-left: 10px; }
.cmp-info b { font-size: 13px; }
.cmp-info span { overflow-wrap: anywhere; }
.cmp-res .chip { white-space: normal; text-align: center; line-height: 1.2; max-width: 100%; }
.cmp-res { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; text-align: right; }
.cmp-court { position: relative; display: grid; grid-template-columns: 1fr 1fr; border-radius: 8px; overflow: hidden; }
.cmp-court .sc-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0.1; }
.cmp-court { background: none; border: 1px solid color-mix(in srgb, var(--accent) 10%, transparent); }
.cmp-side { position: relative; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; gap: 10px; padding: 10px 2px; }
.cmp-pl { display: flex; flex-direction: column; align-items: center; gap: 1px; text-align: center; min-width: 0; max-width: 100%; color: var(--fg); }
.cmp-pl b { font-size: 11px; line-height: 1.15; margin-top: 4px; overflow-wrap: anywhere; }
.cmp-lv { font-size: 9px; line-height: 1.2; color: var(--fg2); }
.cmp-score { font-size: 22px; font-weight: 800; white-space: nowrap; }
.cmp-av { position: relative; display: block; }
.cmp-g { position: absolute; top: -6px; right: -8px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; display: grid; place-items: center; font-style: normal; font-size: 11px; font-weight: 800; background: var(--bg); color: var(--fg); border: 2px solid var(--border-strong); }
.cmp-pl.won .cmp-g { border-color: var(--accent); }
.cmp-pl .avatar { width: 38px; height: 38px; font-size: 12px; box-shadow: 0 0 0 2px var(--border-strong); }
.cmp-pl.won .avatar { box-shadow: 0 0 0 2px var(--accent); }
.cmp-x { align-self: center; }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 6px; }
.cmp-tm { display: flex; align-items: center; gap: 14px; }
.cmp-tm-av { display: flex; }
.cmp-tm-av .avatar { box-shadow: 0 0 0 3px var(--surface); }
.cmp-tm-av .avatar + .avatar { margin-left: -14px; }
.cmp-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.cmp-tiles > div { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px; border-radius: var(--r); background: var(--elev); }
.cmp-tiles b { font-size: 26px; line-height: 1.1; }
.cmp-tiles .won b { color: var(--accent); }
.cmp-wr { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.cmp-wr b { font-size: 22px; }
.cmp-head { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.cmp-who { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; min-width: 0; }
.cmp-vs { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--elev); color: var(--fg2); }
.cmp-row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border); text-align: center; }
.cmp-row b { font-size: 15px; overflow-wrap: anywhere; }
.cmp-row b.lead { color: var(--accent); }
.cmp-row > span { max-width: 110px; }
.h2h { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.h2h-n { display: flex; flex-direction: column; align-items: center; min-width: 56px; }
.h2h-n b { font-size: 28px; line-height: 1; }
.h2h-bar { display: flex; gap: 2px; height: 12px; }
.h2h-bar i { display: block; flex-basis: 0; background: var(--accent); border-radius: 999px 0 0 999px; }
.h2h-bar i.them { background: var(--border-strong); border-radius: 0 999px 999px 0; }
.av-now { display: flex; align-items: center; gap: 14px; }
.avatar.xl { width: 64px; height: 64px; font-size: 20px; }
.avatar.xl.photo { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--border-strong); }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--surface); font-size: 14px; }
.notice.warn { border-color: var(--warn); background: var(--warn-subtle); }
.notice.bad { border-color: var(--error); background: var(--error-subtle); }
.notice.ok { border-color: var(--accent); background: var(--accent-subtle); }
.notice svg { flex: none; margin-top: 2px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--fg2); }
.kv dd { margin: 0; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.empty { padding: 24px 12px; text-align: center; color: var(--fg2); font-size: 14px; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; font-weight: 600; color: var(--fg2); }
.field .hint, .hint { font-size: 12px; color: var(--fg2); font-weight: 400; }
.err { font-size: 13px; color: var(--error); font-weight: 600; }
.input, select.input, textarea.input { width: 100%; min-height: 44px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--field); padding: 8px 12px; }
textarea.input { min-height: 80px; resize: vertical; }
.input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
.input.bad { border-color: var(--error); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r); padding: 3px; gap: 3px; flex-wrap: wrap; align-self: flex-start; }
.seg button { border: 0; background: transparent; min-height: 36px; padding: 0 14px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--fg2); }
.seg button[aria-pressed="true"] { background: var(--elev); color: var(--fg); }
.switch { position: relative; width: 46px; height: 28px; border-radius: 999px; background: var(--overlay); border: 0; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--knob); box-shadow: var(--shadow); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(18px); background: var(--on-accent); }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--r-sm); }
.check input { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }
.choice { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--bg); cursor: pointer; min-width: 0; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-subtle); }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 10px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 700; color: var(--fg2); border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
/* Sheets */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 40; animation: fade .15s; }
.sheet { position: fixed; z-index: 41; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 40px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 16px; box-shadow: 0 24px 60px rgba(0, 0, 0, .45); animation: pop .16s ease-out; }
.sheet.wide { width: min(820px, calc(100vw - 24px)); }
@media (max-width: 640px) {
  .sheet, .sheet.wide { left: 0; right: 0; top: auto; bottom: 0; transform: none; width: 100%; max-height: 92dvh; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .18s ease-out; }
}
.sheet header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 6px; }
.sheet header h2:focus { outline: none; }
.sheet .sb { padding: 10px 20px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.sheet footer { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; padding: 12px 20px 18px; border-top: 1px solid var(--border); }
.sheet footer .btn { flex: 1 1 auto; }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -48%); } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .scrim, .sheet { animation: none !important; } }
/* Toast */
.toasts { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; width: min(440px, calc(100vw - 32px)); pointer-events: none; }
.toast { background: var(--fg); color: var(--bg); padding: 10px 14px; border-radius: var(--r); font-size: 14px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, .35); }

/* Login */
.login { min-height: calc(100dvh - 80px); display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.login .card { width: min(420px, 100%); padding: 28px; display: flex; flex-direction: column; gap: 18px; }
.mark { font-size: 40px; font-weight: 800; letter-spacing: 6px; line-height: 1; }
.mark b { color: var(--accent); }


/* ---------- Player Information ---------- */
:root { --viewer-bg: #000000; --viewer-fg: #ffffff; --qr-bg: #ffffff; --qr-fg: #0b0b0c; --top-h: 61px; --gold: #f2c14e; --silver: #c3c8d0; --bronze: #d38b52; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --gold: #946600; --silver: #5f6774; --bronze: #93501f; } }
:root[data-theme="light"] { --gold: #946600; --silver: #5f6774; --bronze: #93501f; }
button.brand { background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font: inherit; font-weight: 800; letter-spacing: 1.5px; font-size: 17px; }
.nav { display: flex; gap: 2px; margin-left: 8px; }
.nav button { border: 0; background: none; min-height: 36px; padding: 0 12px; border-radius: var(--r-sm); font-weight: 600; color: var(--fg2); cursor: pointer; white-space: nowrap; }
.nav button:hover { color: var(--fg); background: var(--surface); }
.nav button[aria-current="page"] { color: var(--fg); background: var(--elev); }
@media (max-width: 560px) {
  .top-in { flex-wrap: wrap; row-gap: 6px; }
  .nav { order: 5; width: 100%; margin: 0; }
  .nav button { flex: 1; }
}
.band-off { background: var(--warn-subtle); border-bottom: 1px solid var(--warn); font-size: 13px; }
.band-off .in { max-width: 1240px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-start; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.band-off svg { color: var(--warn); flex: none; margin-top: 2px; }
.band-off .in .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.srow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 8px; min-height: 56px; border-radius: var(--r-sm); color: inherit; text-decoration: none; }
.srow + .srow { box-shadow: 0 -1px 0 var(--border); }
a.srow:hover { background: var(--elev); }
a.srow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.srow .main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.crow { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.crow + .crow { border-top: 1px solid var(--border); }
.crow .main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.crow .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.page-head { display: flex; flex-direction: column; gap: 6px; }
.back { align-self: flex-start; margin-left: -10px; }
.nowrap { flex-wrap: nowrap; }
.wrap.mid { max-width: 920px; }
.wrap.slim { max-width: 640px; }

/* Leaderboard */
.lb { display: flex; flex-direction: column; }
.lb-head, .lb-row { display: grid; grid-template-columns: 56px 36px minmax(0, 1fr) minmax(0, auto); gap: 12px; align-items: center; padding: 8px 12px; }
.lb-head { font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--fg2); border-bottom: 1px solid var(--border); padding-block: 6px; }
.lb-head span:first-child { text-align: right; }
.lb-head span:last-child { text-align: right; }
.lb-row { width: 100%; border: 0; background: transparent; text-align: left; border-radius: var(--r-sm); cursor: pointer; min-height: 56px; }
.lb-row + .lb-row { box-shadow: 0 -1px 0 var(--border); }
.lb-row:hover { background: var(--elev); }
.lb-row.me { background: var(--accent-subtle); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
.lb-pos { font-family: var(--mono); font-weight: 600; font-size: 15px; color: var(--fg2); text-align: right; font-variant-numeric: tabular-nums; }
/* Top three: a gold, silver or bronze medal for the position, a matching ring on the picture, and a tinted row. */
.lb-row.podium { --medal: var(--gold); min-height: 66px; background: linear-gradient(90deg, color-mix(in srgb, var(--medal) 15%, transparent), transparent 75%); }
.lb-row.p2 { --medal: var(--silver); }
.lb-row.p3 { --medal: var(--bronze); }
.lb-row.podium:hover { background: linear-gradient(90deg, color-mix(in srgb, var(--medal) 24%, transparent), var(--elev) 75%); }
.lb-row[aria-disabled="true"], .pod[aria-disabled="true"] { cursor: default; }
.lb-row[aria-disabled="true"]:hover { background: transparent; }
.lb-row.podium[aria-disabled="true"]:hover { background: linear-gradient(90deg, color-mix(in srgb, var(--medal) 15%, transparent), transparent 75%); }
.lb-row.podium .lb-pos { justify-self: end; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; font-size: 16px; font-weight: 700; color: var(--medal); background: color-mix(in srgb, var(--medal) 18%, var(--surface)); box-shadow: inset 0 0 0 2px var(--medal); }
.lb-row.podium .avatar { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--medal); }
.lb-row.podium .lb-name b { font-size: 16px; }
.lb-row.podium .lb-lv { color: var(--fg); }
/* Podium: a dark stage lit from below in the brand green, with pixel-notched steps and pixel type to match the
   pixel fire behind #1. Steps run 2nd–1st–3rd left to right; brightness, not metal colors, sets the order. */
:root { --pixel: "Silkscreen", var(--mono); }
.podium { position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; gap: 18px; padding: 18px 18px 0; border-radius: 16px;
  border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--border));
  background:
    radial-gradient(120% 70% at 50% 100%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 70%),
    repeating-linear-gradient(0deg, color-mix(in srgb, var(--accent) 7%, transparent) 0 1px, transparent 1px 8px),
    repeating-linear-gradient(90deg, color-mix(in srgb, var(--accent) 7%, transparent) 0 1px, transparent 1px 8px),
    var(--surface); }
.pod-head { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; flex-wrap: wrap; }
.pod-head h2 { font-family: var(--pixel); font-weight: 700; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); }
.pod-stage { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; gap: 10px; padding-top: 40px; }
.pod { --glow: 30%; display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0; padding: 0; border: 0; background: none; color: inherit; cursor: pointer; font: inherit; }
.pod.p1 { --glow: 100%; order: 2; }
.pod.p2 { --glow: 55%; order: 1; }
.pod.p3 { --glow: 38%; order: 3; }
.pod-who { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-width: 0; max-width: 100%; padding-inline: 4px; }
.pod-who .avatar { position: relative; z-index: 1; width: 64px; height: 64px; font-size: 20px; margin-bottom: 8px; border-radius: 12px;
  box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px color-mix(in srgb, var(--accent) var(--glow), var(--border-strong)); }
.pod.p1 .pod-who .avatar { width: 86px; height: 86px; font-size: 26px; border-radius: 14px;
  box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--accent), 0 0 32px 6px color-mix(in srgb, var(--accent) 50%, transparent); }
.pod-name { position: relative; z-index: 1; font-weight: 700; font-size: 15px; line-height: 1.25; overflow-wrap: anywhere; }
.pod.p1 .pod-name { font-size: 18px; }
.pod-lv { position: relative; z-index: 1; font-size: 12px; font-weight: 600; color: var(--fg2); }
.pod.p1 .pod-lv { color: var(--accent); }
/* Steps: the notched polygon gives each block stepped pixel corners. */
.pod-step { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; padding-top: 12px; font-family: var(--pixel); line-height: 1;
  clip-path: polygon(0 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0, calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px, 100% 100%, 0 100%);
  color: color-mix(in srgb, var(--accent) var(--glow), var(--fg2));
  background:
    repeating-linear-gradient(0deg, transparent 0 7px, color-mix(in srgb, var(--accent) 12%, transparent) 7px 8px),
    linear-gradient(180deg, color-mix(in srgb, var(--accent) calc(var(--glow) * 0.42), var(--elev)), color-mix(in srgb, var(--accent) calc(var(--glow) * 0.12), var(--surface))); }
.pod-step b { font-size: 34px; font-weight: 700; }
.pod-step small { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
.pod.p1 .pod-step { height: 136px; color: var(--on-accent); background:
    repeating-linear-gradient(0deg, transparent 0 7px, color-mix(in srgb, var(--on-accent) 10%, transparent) 7px 8px),
    linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--surface))); }
.pod.p1 .pod-step b { font-size: 46px; }
.pod.p2 .pod-step { height: 100px; }
.pod.p3 .pod-step { height: 76px; }
.pod:hover .pod-name, .pod:focus-visible .pod-name { text-decoration: underline; text-underline-offset: 3px; }
.pod:hover .pod-step { filter: brightness(1.12); }
.pod.me .pod-name::after { content: " · You"; color: var(--accent); }
.fire { position: absolute; z-index: 0; left: 50%; bottom: calc(100% - 96px); transform: translateX(-50%); width: 180px; height: 150px; image-rendering: pixelated; pointer-events: none; }
/* Embers: a few pixels drifting up from the floor. */
.embers { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.embers i { position: absolute; bottom: -6px; width: 4px; height: 4px; background: var(--accent); opacity: 0; animation: ember 5s linear infinite; }
@keyframes ember { 0% { transform: translateY(0); opacity: 0; } 12% { opacity: .9; } 100% { transform: translateY(-260px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .embers { display: none; } }
@media (max-width: 560px) {
  .podium { padding: 14px 10px 0; }
  .pod-stage { gap: 6px; padding-top: 32px; }
  .pod-who .avatar { width: 52px; height: 52px; }
  .pod.p1 .pod-who .avatar { width: 68px; height: 68px; }
  .pod-name { font-size: 13px; }
  .pod.p1 .pod-name { font-size: 14px; }
  .pod.p1 .pod-step { height: 108px; }
  .pod.p1 .pod-step b { font-size: 36px; }
  .pod.p2 .pod-step { height: 80px; }
  .pod.p3 .pod-step { height: 62px; }
  .pod-step b { font-size: 26px; }
  .pod-step small { font-size: 10px; }
  .fire { width: 140px; height: 118px; bottom: calc(100% - 78px); }
}
.lb-name { min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 6px; row-gap: 2px; }
.lb-name b { font-weight: 700; overflow-wrap: anywhere; }
.lb-lv { font-size: 13px; font-weight: 600; color: var(--fg2); text-align: right; }
@media (max-width: 560px) {
  .lb-head { display: none; }
  .lb-row { grid-template-columns: 44px 36px minmax(0, 1fr); row-gap: 0; padding-inline: 8px; }
  .lb-lv { grid-column: 3; text-align: left; font-size: 12px; }
  .lb-row .avatar { grid-row: span 2; }
  .lb-pos { grid-row: span 2; }
}
.skel { display: block; background: var(--elev); border-radius: 6px; height: 14px; animation: pulse 1.2s infinite; }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
.find-row { display: flex; gap: 8px; }
.find-row .input { flex: 1; min-width: 0; }

/* Rank */
.rank-main { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.rank-label { font-size: 26px; font-weight: 800; letter-spacing: -0.4px; line-height: 1.15; }
.rank-label.dim { color: var(--fg2); }
.rank-pos { display: flex; flex-direction: column; align-items: flex-end; gap: 0; }
.rank-pos b { font-family: var(--mono); font-size: 40px; line-height: 1; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
.rank-pos.none b { font-size: 20px; color: var(--fg2); font-family: var(--font); font-weight: 700; }
.ladder { display: flex; gap: 10px; }
.ladder .tier { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ladder .bands { display: flex; gap: 3px; }
.ladder i { display: block; flex: 1; height: 10px; border-radius: 2px; background: var(--elev); }
.ladder i.on { background: color-mix(in srgb, var(--accent) 32%, var(--elev)); }
.ladder i.cur { background: var(--accent); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--accent); }
.ladder.stale i.cur { background: var(--warn); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--warn); }
.ladder.stale i.on { background: color-mix(in srgb, var(--warn) 25%, var(--elev)); }
.ladder .tn { font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase; color: var(--fg2); }
.ladder-full { display: flex; flex-direction: column; gap: 6px; }
.ladder-full .lrow { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 12px; align-items: center; }
.ladder-full .lrow > span { font-size: 13px; font-weight: 600; color: var(--fg2); }
.ladder-full .cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; }
.ladder-full .cells b { display: grid; place-items: center; min-height: 30px; border-radius: var(--r-sm); background: var(--elev); color: var(--fg2); font-size: 13px; font-weight: 700; }
.ladder-full .cells b.cur { background: var(--accent); color: var(--on-accent); }
.ladder-full .cells b.cur.stale { background: var(--warn); color: var(--on-accent); }
@media (max-width: 480px) { .ladder-full .lrow { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.split { display: flex; height: 14px; border-radius: 999px; overflow: hidden; gap: 2px; }
.split .a { background: var(--accent); }
.split .b { background: color-mix(in srgb, var(--accent) 35%, var(--elev)); }
.legend { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; }
.legend b { font-family: var(--mono); font-size: 18px; }
.prog { height: 8px; background: var(--elev); border-radius: 999px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.prog.warn i { background: var(--warn); }
.big-count { font-family: var(--mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }

/* Profile */
.prof { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
@media (min-width: 920px) {
  .prof { grid-template-columns: 360px minmax(0, 1fr); }
  .prof > .side { position: sticky; top: calc(var(--top-h) + 16px + env(safe-area-inset-top, 0px)); }
}
.hero { display: flex; flex-direction: column; gap: 14px; }
/* Owner comment, November 11, 2026: the profile hero carries a public banner like Discord, with the picture overlapping it. */
.card.hero { padding-top: 0; overflow: hidden; }
.hero-banner { height: 96px; margin: 0 -16px; }
/* Predefined banners only (owner comment, November 11, 2026). Each is built from the theme tokens so both themes hold up. */
.bn-court { background: linear-gradient(135deg, var(--accent-dim), var(--accent) 55%, var(--accent-subtle)); }
.bn-night { background: linear-gradient(135deg, var(--elev), var(--overlay) 60%, var(--border-strong)); }
.bn-dusk { background: linear-gradient(135deg, var(--overlay), var(--accent-dim)); }
.bn-ember { background: linear-gradient(135deg, var(--error), var(--warn)); }
.bn-sun { background: linear-gradient(135deg, var(--warn), var(--accent)); }
.bn-stripe { background: repeating-linear-gradient(135deg, var(--accent-dim) 0 14px, var(--elev) 14px 28px); }
.banner-pick { display: flex; flex-wrap: wrap; gap: 8px; }
.banner-opt { width: 84px; height: 36px; border-radius: var(--r-sm); border: 2px solid var(--border); padding: 0; cursor: pointer; }
.banner-opt[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-subtle); }
.banner-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hero .who { display: flex; gap: 14px; align-items: flex-end; min-width: 0; margin-top: -44px; }
.hero .who .avatar.xxl { box-shadow: 0 0 0 5px var(--surface); }
.hero .who h1 { margin: 0; }
.hero h1 { overflow-wrap: anywhere; }
.avatar.xxl { width: 88px; height: 88px; border-radius: 20px; font-size: 30px; font-weight: 800; background: var(--accent); color: var(--on-accent); }
.avatar.xxl.photo { background: var(--elev); }
.rtr-line { display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 12px; border-radius: var(--r-sm); border: 1px solid var(--border-strong); background: var(--bg); min-width: 0; }
.rtr-line code { flex: 1; min-width: 0; font-family: var(--mono); font-size: 14px; letter-spacing: .4px; overflow-wrap: anywhere; }
.private { border-style: dashed; border-color: var(--border-strong); background: transparent; box-shadow: none; }
.links { display: flex; flex-direction: column; gap: 8px; }
.links a { display: flex; align-items: center; gap: 10px; color: var(--fg); text-decoration: none; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--border); min-width: 0; }
.links a:hover { border-color: var(--accent); }
.links a span { overflow-wrap: anywhere; min-width: 0; }
.links a small { color: var(--fg2); margin-left: auto; flex: none; }
.acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 8px; }

/* Games */
.sess { display: flex; flex-direction: column; gap: 4px; }
.sess-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 12px; flex-wrap: wrap; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
.game { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; }
.game + .game { border-top: 1px solid var(--border); }
.res { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 13px; }
.res.W { background: var(--accent-subtle); color: var(--accent); }
.res.L { background: var(--elev); color: var(--fg2); }
.res.X { background: transparent; border: 1px dashed var(--border-strong); color: var(--fg3); }
.game .main { min-width: 0; }
.game .main b { font-weight: 700; }
.score { font-family: var(--mono); font-size: 14px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.score.none { font-family: var(--font); font-size: 12px; font-weight: 500; color: var(--fg2); white-space: normal; max-width: 150px; }
@media (max-width: 480px) {
  .game { grid-template-columns: 30px minmax(0, 1fr); }
  .score { grid-column: 2; text-align: left; max-width: none; }
}

/* Player ID */
.qr { background: var(--qr-bg); color: var(--qr-fg); padding: 14px; border-radius: 16px; width: min(260px, 100%); aspect-ratio: 1; align-self: center; }
.qr svg { width: 100%; height: 100%; display: block; }
.qr.missing { display: grid; place-items: center; text-align: center; font-size: 13px; padding: 20px; }
.id-big { font-family: var(--mono); font-size: clamp(17px, 4.6vw, 24px); font-weight: 600; letter-spacing: .6px; text-align: center; overflow-wrap: anywhere; }
.rtr-parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 96px), 1fr)); gap: 8px; }
.rtr-parts div { border: 1px solid var(--border); border-radius: var(--r-sm); padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.rtr-parts code { font-family: var(--mono); font-weight: 600; color: var(--accent); }
.rtr-parts span { font-size: 12px; color: var(--fg2); }
.setting { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.setting .main { min-width: 0; }
/* Edit profile: section menu on the left, one section at a time on the right; tabs across the top on phones. */
.edit-grid { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 20px; align-items: start; }
.edit-nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: calc(var(--top-h) + 16px + env(safe-area-inset-top, 0px)); }
.edit-nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 42px; padding: 0 12px; border: 0; border-radius: var(--r-sm); background: none; color: var(--fg2); font-weight: 600; text-align: left; cursor: pointer; }
.edit-nav button:hover { background: var(--surface); color: var(--fg); }
.edit-nav button[aria-selected="true"] { background: var(--elev); color: var(--fg); box-shadow: inset 2px 0 0 var(--accent); }
.edit-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.edit-panel { gap: 16px; }
.edit-save { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--border); }
@media (max-width: 720px) {
  .edit-grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .edit-nav { position: static; flex-direction: row; overflow-x: auto; gap: 4px; border-bottom: 1px solid var(--border); }
  .edit-nav button { flex: none; border-radius: 0; min-height: 44px; box-shadow: none; }
  .edit-nav button[aria-selected="true"] { background: none; box-shadow: inset 0 -2px 0 var(--accent); }
  .edit-save { position: sticky; bottom: 0; margin: 0 -16px -16px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-radius: 0 0 var(--r) var(--r); }
}
.demo-sec { display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--border); }
.demo-sec:first-of-type { border-top: 0; padding-top: 0; }
.sheet footer.single .btn { flex: 0 1 auto; }

// Pixel fire (the classic spreading-flame effect) drawn in the brand green. The canvas is tiny and scaled up
// with crisp pixels; colors come from the --accent token so it follows the theme. Reduced motion gets one still frame.
const FIRE = { w: 48, h: 40, buf: null, raf: 0, last: 0, key: '', pal: [] };
function firePalette() {
  const acc = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  const dark = isDark();
  const key = acc + dark;
  if (key === FIRE.key) return FIRE.pal;
  const hex = /^#([0-9a-f]{6})$/i.exec(acc);
  const [r, g, b] = hex ? [0, 2, 4].map((k) => parseInt(hex[1].slice(k, k + 2), 16)) : [0, 255, 136];
  const mix = (c, t, to) => Math.round(c + (to - c) * t);
  FIRE.pal = Array.from({ length: 37 }, (_, i) => {
    const t = i / 36;
    if (i === 0) return [0, 0, 0, 0];
    const base = t < 0.55 ? [r, g, b].map((c) => mix(c * 0.35, t / 0.55, c)) : [r, g, b].map((c) => mix(c, (t - 0.55) / 0.45 * (dark ? 0.75 : 0.35), 255));
    return [...base, t < 0.12 ? 0 : Math.round(255 * Math.min(1, (t - 0.12) * 2.2))];
  });
  FIRE.key = key;
  return FIRE.pal;
}
function fireStep() {
  const { w, h } = FIRE;
  if (!FIRE.buf) {
    FIRE.buf = new Uint8Array(w * h);
    // Only the middle of the bottom row burns, which shapes the flames into a tongue behind the picture.
    for (let x = 0; x < w; x++) { const d = Math.abs(x - w / 2) / (w / 2); FIRE.buf[(h - 1) * w + x] = d < 0.3 ? 36 : d < 0.62 ? Math.round(36 * (1 - (d - 0.3) / 0.32)) : 0; }
  }
  const buf = FIRE.buf;
  for (let x = 0; x < w; x++) {
    for (let y = 1; y < h; y++) {
      const src = y * w + x;
      const v = buf[src];
      if (!v) { buf[src - w] = 0; continue; }
      const rnd = Math.floor(Math.random() * 4);
      const dst = src - rnd + 1 - w;
      // Cooling a little over one step per row keeps the flames inside the canvas and ragged at the tips.
      if (dst >= 0) buf[dst] = Math.max(0, v - (rnd & 1) - (Math.random() < 0.55 ? 1 : 0));
    }
  }
}
function fireDraw(c) {
  const ctx = c.getContext('2d');
  const pal = firePalette();
  const { w, h } = FIRE;
  const img = ctx.createImageData(w, h);
  FIRE.buf.forEach((v, i) => {
    const p = pal[v] || pal[0];
    const x = i % w;
    // Fade the sides so the burn reads as a tongue of flame, not a block.
    const side = Math.max(0, 1 - ((x - w / 2) / (w * 0.42)) ** 2);
    img.data.set([p[0], p[1], p[2], Math.round(p[3] * side)], i * 4);
  });
  ctx.putImageData(img, 0, 0);
}
function fireTick(ts) {
  const c = document.getElementById('fire');
  if (!c) { FIRE.raf = 0; return; }
  if (ts - FIRE.last > 60) { fireStep(); fireDraw(c); FIRE.last = ts; }
  FIRE.raf = requestAnimationFrame(fireTick);
}
function startFire() {
  const c = document.getElementById('fire');
  if (!c) return;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    if (!FIRE.buf) for (let i = 0; i < 60; i++) fireStep();
    fireDraw(c);
    return;
  }
  if (!FIRE.buf) for (let i = 0; i < 40; i++) fireStep();
  fireDraw(c);
  if (!FIRE.raf) FIRE.raf = requestAnimationFrame(fireTick);
}

// Experience: Years + months and Playing since are two views of one value; typing either fills the other.
// Saved as Playing since, so the years and months stay right as time passes.
const MONTH_NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function linkExperience(el) {
  const pre = el.dataset.exp, key = el.id.slice(pre.length + 1);
  const box = (k) => document.getElementById(`${pre}-${k}`);
  const put = (k, v) => { const i = box(k); if (i) { i.value = v; setPath(i.dataset.bind, v); } };
  const now = new Date(), nowM = now.getFullYear() * 12 + now.getMonth();
  if (key === 'expY' || key === 'expM') {
    const y = box('expY').value.trim(), m = box('expM').value.trim();
    if (!y && !m) { put('sinceM', ''); put('sinceY', ''); return; }
    if (!/^\d*$/.test(y) || !/^\d*$/.test(m) || +m > 11) return;
    const t = nowM - ((+y || 0) * 12 + (+m || 0));
    put('sinceM', String((t % 12) + 1)); put('sinceY', String(Math.floor(t / 12)));
  } else {
    const mo = box('sinceM').value, yr = box('sinceY').value.trim();
    if (!mo || !/^\d{4}$/.test(yr)) return;
    const diff = nowM - (+yr * 12 + (+mo - 1));
    if (diff < 0) return;
    put('expY', String(Math.floor(diff / 12))); put('expM', String(diff % 12));
  }
}
const expText = (p) => {
  // Playing since wins when set: the years and months keep counting from it.
  const since = p.sinceM && p.sinceY ? new Date().getFullYear() * 12 + new Date().getMonth() - (+p.sinceY * 12 + (+p.sinceM - 1)) : null;
  const y = since != null ? Math.floor(since / 12) : +p.expY || 0, m = since != null ? since % 12 : +p.expM || 0;
  if (!y && !m) return '';
  return [y && `${y} ${y === 1 ? 'year' : 'years'}`, m && `${m} ${m === 1 ? 'month' : 'months'}`].filter(Boolean).join(', ') + ' playing';
};

const monthIdx = (d) => d.getFullYear() * 12 + d.getMonth();
function clubCalendar(sessions, off) {

  const days = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();

  const on = (d) => inMonth.filter((x) => dayOf(x.ago).getDate() === d);
  const cells = [...Array(first.getDay()).fill(null), ...Array.from({ length: days }, (_, k) => k + 1)];
  const title = first.toLocaleDateString([], { month: 'long', year: 'numeric' });
  const grid = `<div class="cal" role="group" aria-label="${title}">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map((d) => `<span class="dow" aria-hidden="true">${d}</span>`).join('')}${cells.map((d) => {

// ---------- P-PHONE-PRIVACY + P-CONTACT-REQUEST ----------
const REQ_FIELD = { phone: 'Phone number', email: 'Email' };
const REQ = {
  submitted: { chip: 'Waiting for review', k: 'warn' },
  applying: { chip: 'Approved · being applied', k: 'warn' },
  applied: { chip: 'Applied', k: 'ok' },
  failed: { chip: 'Needs attention', k: 'bad' },
  rejected: { chip: 'Not approved', k: '' },
};
function requestCard(p) {
  const r = S.requests[p.id];
  if (!r) return '';
  const f = REQ_FIELD[r.field].toLowerCase();
  const text = {
    submitted: `You asked to change your ${f} to <b>${esc(r.to)}</b>. Changes take effect only after Admin approval. Until then, keep signing in with <span class="mono">${esc(r.from)}</span>.`,
    applying: `Approved. Your new ${f} is being set up. Keep signing in with <span class="mono">${esc(r.from)}</span> until this says Applied.`,
    applied: `Your ${f} is now <b>${esc(r.to)}</b>. Your player ID and game history stay the same.`,
    failed: `The change was approved but couldn't be applied yet. You still sign in with <span class="mono">${esc(r.from)}</span>. ROTRA will retry or contact you.`,
    rejected: `The platform owner didn't approve changing your ${f} to ${esc(r.to)}. Your current ${f} stays. You can send a new request.`,
  }[r.status];
  return `<div class="notice ${r.status === 'applied' ? 'ok' : r.status === 'failed' ? 'bad' : r.status === 'rejected' ? '' : 'warn'}">${r.status === 'applied' ? I.check : I.info}<div class="stack tight"><div class="row">${chip(REQ[r.status].chip, REQ[r.status].k)}<span class="small muted">${REQ_FIELD[r.field]} change · sent ${fmtTime(r.at)}</span></div><p>${text}</p></div></div>`;
}

// ---------- P-EDIT-PROFILE ----------
const editFields = (p) => ({ name: p.name, nick: p.nick || '', style: p.style || '', expY: p.expY ?? '', expM: p.expM ?? '', sinceM: p.sinceM ?? '', sinceY: p.sinceY ?? '', facebook: p.social.facebook || '', instagram: p.social.instagram || '', youtube: p.social.youtube || '', linkedin: p.social.linkedin || '' });
const editDirty = () => S.ui.edit && JSON.stringify(S.ui.edit) !== JSON.stringify(S.ui.editOrig);
function field(id, label, path, value, err, o = {}) {
  const tag = o.area ? `<textarea class="input${err ? ' bad' : ''}" id="${id}" data-bind="${path}" maxlength="${o.max || 280}" ${err ? `aria-invalid="true" aria-describedby="${id}-err"` : ''}>${esc(value)}</textarea>`

// Edit profile sections: a menu on the left on wide screens, tabs across the top on phones. All sections share

// Rank card, My session result and Session games share one sheet. The image is drawn on the device (canvas), like the Queue Session QR card.
// Other players' names show the way a visitor would see them: private players and guests masked, public registered players in full.
const SHARE_MASKED = new Set(['Kat Lim', 'Rafa Aquino', 'Ian Co', 'Pia Tan']); // prototype: private profile or guest
const shareName = (n) => (SHARE_MASKED.has(n) ? maskName(n) : n);
const profileLink = (id) => `${/^https?:/.test(location.origin) ? location.origin : 'https://rotra.example'}/player/players/${id}`;
const SHARE_GAME_LIMIT = { post: 3, story: 4 };
const sharePerson = (name) => ({ id: name, name: shareName(name), photo: !SHARE_MASKED.has(name) });
function shareModel(sh) {
  if (!S.me) return null;
  const p = profileOf(S.me), s = sh.sid ? migsSessions().find((x) => x.id === sh.sid) : null;
  const top = { p, title: p.name, sub: p.nick ? `“${p.nick}”` : 'ROTRA player' };
  const link = profileLink(p.id);
  // Proposed (#738): Share profile, own profile only. Always available: no level shows "Not ranked yet", no games shows "No games yet".
  // Owner comment, November 11, 2026: show the ranking when there is one, and the number of wins.
  if (sh.kind === 'profile') {
    const pos = positionOf(p.id);
    const gs = p.sessions.filter((x) => x.ago <= WINDOW_DAYS).flatMap((x) => x.games.filter((g) => g.kind === 'counted'));
    const w = gs.filter((g) => g.res === 'W').length;
    return { kind: 'profile', title: 'Share profile', top, link, blocks: [
      { t: 'rank', label: p.level == null ? 'Not ranked yet' : lvLabel(p.level), pos, hidePos: pos == null, dim: p.level == null },
      gs.length ? { t: 'stats', note: 'Last 90 days', items: [['Wins', String(w)]] } : { t: 'stat', text: 'No games yet' },
    ] };
  }
  if (sh.kind === 'rank') {
    if (p.level == null) return null;
    const pos = positionOf(p.id);
    return { kind: 'rank', title: 'Share rank', top, link, blocks: [{ t: 'rank', label: lvLabel(p.level), pos }, { t: 'ladder', level: p.level }] };
  }
  if (!s || s.published !== true) return null;
  const gs = s.games.filter((g) => g.kind !== 'partial'), w = gs.filter((g) => g.res === 'W').length, l = gs.length - w;
  const head = [{ t: 'h', text: s.title }, { t: 'p', text: `${fmtDay(s.ago)} · ${s.club}` }];
  if (sh.kind === 'result') return { kind: 'result', title: 'Share result', top, link, blocks: [...head, { t: 'big', value: `#${s.pos}`, label: 'in Standings' }, { t: 'stat', text: `${gs.length} ${gs.length === 1 ? 'game' : 'games'} · ${w}–${l}` }] };
  const lines = gs.map((g) => ({
    res: g.res, score: g.score,
    mine: [p, ...g.partner.map(sharePerson)], theirs: g.opp.map(sharePerson),
    mineLabel: [p.name, ...g.partner.map(shareName)].map(n => n.split(' ')[0]).join(' + '),
    theirsLabel: g.opp.map(n => shareName(n).split(' ')[0]).join(' + '),
  }));
  return { kind: 'games', title: 'Share games', top, link, blocks: [...head, { t: 'lines', lines }, { t: 'stat', text: `Total W–L ${w}–${l}` }] };

}
function shareCardHTML(m, fmt) {
  const p = m.top.p, story = fmt === 'story';
  const av = p.photoUrl ? `<img src="${p.photoUrl}" alt="">` : p.photo ? faceSVG(p) : esc(initials(p.name));
  const blk = (b) => {

    if (b.t === 'stats') return `<div class="sh-stats"><span>${esc(b.note)}</span><div class="g">${b.items.map(([k, v]) => `<div><b>${esc(v)}</b><em>${esc(k)}</em></div>`).join('')}</div></div>`;
    if (b.t === 'ladder') return `<div class="sh-ladder" aria-hidden="true">${TIERS.map(([name, bands]) => `<div class="t"><div class="bs">${bands.map((i) => `<i class="${i === b.level ? 'cur' : i < b.level ? 'on' : ''}"></i>`).join('')}</div><em>${name}</em></div>`).join('')}</div>`;
    if (b.t === 'big') return `<div class="sh-big"><b>${esc(b.value)}</b><span>${esc(b.label)}</span></div>`;

    const limit = SHARE_GAME_LIMIT[fmt];
    return `<div class="sh-lines">${b.lines.slice(0, limit).map((g) => `<div class="sh-gl">${team(g.mine, g.mineLabel, g.res === 'W')}<div class="sh-score${g.res === 'W' ? ' win' : ''}"><b>${esc(g.score || '—')}</b><span>${g.score ? g.res === 'W' ? 'Won' : 'Lost' : 'Winner recorded'}</span></div>${team(g.theirs, g.theirsLabel, g.res === 'L')}</div>`).join('')}</div>${b.lines.length > limit ? `<span class="sh-more">+${b.lines.length - limit} more games</span>` : ''}`;
  };
  return `<div class="sh-card ${fmt} ${m.kind}" role="group" aria-label="Share image preview">
    <div class="sh-top"><span class="sh-av">${av}</span><div><b>${esc(m.top.title)}</b><span>${esc(m.top.sub)}</span></div></div>
    <div class="sh-mid">${m.blocks.map(blk).join('')}</div>
    <div class="sh-foot"><div><span class="w">ROTR<b>A</b></span><span class="tag">Run the game.</span></div><div class="sh-code" role="img" aria-label="QR code that opens your profile">${qrSVG(m.link) || ''}</div></div></div>`;
}
const loadImg = (src) => new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
async function shareAvatar(p) {
  if (p.photoUrl) return loadImg(p.photoUrl);
  if (p.photo) return loadImg(`data:image/svg+xml;charset=utf-8,${encodeURIComponent(faceSVG(p).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" '))}`);
  return null;
}
// Draws the card at 1080 x 1350 (Post) or 1080 x 1920 (Story). Sizes are in the preview's CSS pixels, scaled up.
async function drawShareCard(m, fmt) {
  const story = fmt === 'story', cw = story ? 270 : 320, ch = story ? 480 : 400, k = 1080 / cw, pad = 20;
  const FG = '#f0f0f2', DIM = '#9090a0', ACC = '#00ff88', CELL = 'rgba(255,255,255,0.1)', SANS = 'system-ui, -apple-system, "Segoe UI", sans-serif', MONO = 'ui-monospace, Menlo, Consolas, monospace';
  const c = document.createElement('canvas'); c.width = 1080; c.height = story ? 1920 : 1350;
  const x = c.getContext('2d'); x.scale(k, k);
  const rr = (X, Y, w, h, r) => { x.beginPath(); x.roundRect ? x.roundRect(X, Y, w, h, r) : x.rect(X, Y, w, h); };
  const font = (wt, sz, fam = SANS) => { x.font = `${wt} ${sz}px ${fam}`; };
  rr(0, 0, cw, ch, 20); x.fillStyle = '#0b0b0c'; x.fill(); x.save(); x.clip();
  const g = x.createRadialGradient(cw / 2, 0, 0, cw / 2, 0, cw * 0.9); g.addColorStop(0, 'rgba(0,255,136,0.16)'); g.addColorStop(1, 'rgba(0,255,136,0)');
  x.fillStyle = g; x.fillRect(0, 0, cw, ch * 0.7);
  x.textBaseline = 'alphabetic';
  const wrap = (text, maxW, maxLines) => {
    const out = []; let cur = '';
    for (const w of text.split(' ')) { const t = cur ? `${cur} ${w}` : w; if (!cur || x.measureText(t).width <= maxW) cur = t; else { out.push(cur); cur = w; } }
    if (cur) out.push(cur);
    if (out.length > maxLines) { let last = out.slice(maxLines - 1).join(' '); while (last.length > 1 && x.measureText(`${last}…`).width > maxW) last = last.slice(0, -1); out.length = maxLines - 1; out.push(`${last}…`); }
    return out;
  };
  const W = cw - pad * 2;
  let y = pad;
  // top: picture, name, nickname
  const p = m.top.p, img = await shareAvatar(p);
  rr(pad, y, 52, 52, 14); x.save(); x.clip();
  x.fillStyle = ACC; x.fillRect(pad, y, 52, 52);
  if (img) x.drawImage(img, pad, y, 52, 52);
  else { x.fillStyle = '#0b0b0c'; font(800, 18); x.textAlign = 'center'; x.fillText(initials(p.name), pad + 26, y + 32); x.textAlign = 'left'; }
  x.restore();
  x.fillStyle = FG; font(700, 16); x.fillText(wrap(m.top.title, W - 64, 1)[0], pad + 64, y + 24);
  x.fillStyle = DIM; font(400, 12); x.fillText(m.top.sub, pad + 64, y + 42);
  y += 52 + 14;
  for (const b of m.blocks) {
    if (b.t === 'h') { const sz = m.kind === 'games' ? 18 : 22; font(800, sz); x.fillStyle = FG; wrap(b.text, W, 2).forEach((ln) => { y += sz * 1.15; x.fillText(ln, pad, y - 3); }); y += 8; }
    else if (b.t === 'p') { font(400, 13); x.fillStyle = DIM; wrap(b.text, W, 2).forEach((ln) => { y += 18; x.fillText(ln, pad, y - 4); }); y += 8; }
    else if (b.t === 'rank') {
      font(800, 22); x.fillStyle = b.dim ? FG : ACC; y += 24; x.fillText(b.label, pad, y - 3); y += 10;
      if (b.hidePos && !b.pos) { y += 6; continue; }
      font(600, 11); x.fillStyle = DIM; x.fillText('OVERALL', pad, y + 8); y += 12;
      if (b.pos) { font(700, 36, MONO); x.fillStyle = ACC; x.fillText(`#${num(b.pos)}`, pad, y + 34); y += 44; }
      else { font(700, 20); x.fillStyle = FG; x.fillText('No position', pad, y + 20); y += 28; }
      y += 6;
    } else if (b.t === 'stats') {
      font(600, 10); x.fillStyle = DIM; x.fillText(b.note.toUpperCase(), pad, y + 10); y += 22;
      const cw3 = W / 3;
      b.items.forEach(([k, v], i) => { font(700, 20, MONO); x.fillStyle = FG; x.fillText(v, pad + i * cw3, y + 18); font(400, 10); x.fillStyle = DIM; x.fillText(k, pad + i * cw3, y + 33); });
      y += 44;
    } else if (b.t === 'ladder') {
      const tw = (W - 20) / 3, bw = (tw - 6) / 3;
      TIERS.forEach(([name, bands], ti) => {
        const X0 = pad + ti * (tw + 10);
        bands.forEach((i, bi) => { const bx = X0 + bi * (bw + 3); x.fillStyle = i === b.level ? ACC : i < b.level ? 'rgba(0,255,136,0.32)' : CELL; rr(bx, y + 3, bw, 10, 2); x.fill(); });
        font(600, 10); x.fillStyle = DIM; x.fillText(name.toUpperCase(), X0, y + 28);
      });
      y += 38;
    } else if (b.t === 'big') {
      font(700, 40, MONO); x.fillStyle = ACC; x.fillText(b.value, pad, y + 38); const vw = x.measureText(b.value).width;
      font(400, 13); x.fillStyle = DIM; x.fillText(b.label, pad + vw + 8, y + 38); y += 52;
    } else if (b.t === 'stat') { font(700, 15); x.fillStyle = FG; x.fillText(b.text, pad, y + 16); y += 26; }
    else if (b.t === 'more') { font(400, 11); x.fillStyle = DIM; x.fillText(b.text, pad, y + 11); y += 18; }
    else if (b.t === 'lines') {
      const smallTeam = async (people, label, right, yy, winning) => {
        const shown = people.slice(0, 2), start = right ? cw - pad - shown.length * 20 - 4 : pad;
        for (const [i, person] of shown.entries()) {
          const image = await shareAvatar(person), ax = start + i * 20;
          rr(ax, yy, 24, 24, 12); x.save(); x.clip(); x.fillStyle = CELL; x.fill();
          if (image) x.drawImage(image, ax, yy, 24, 24);
          else { font(700, 8); x.fillStyle = FG; x.textAlign = 'center'; x.fillText(initials(person.name), ax + 12, yy + 15); }
          x.restore();
          if (winning) { x.strokeStyle = ACC; x.lineWidth = 2; x.beginPath(); x.arc(ax + 12, yy + 12, 13, 0, Math.PI * 2); x.stroke(); }
          x.textAlign = 'left';
        }
        font(400, 9); x.fillStyle = DIM; x.textAlign = right ? 'right' : 'left';
        x.fillText(wrap(label, (W - 84) / 2, 1)[0] || '', right ? cw - pad : pad, yy + 36); x.textAlign = 'left';
      };
      for (const ln of b.lines.slice(0, SHARE_GAME_LIMIT[fmt])) {
        await smallTeam(ln.mine, ln.mineLabel, false, y, ln.res === 'W');
        await smallTeam(ln.theirs, ln.theirsLabel, true, y, ln.res === 'L');
        x.textAlign = 'center'; font(800, 20, MONO); x.fillStyle = ln.res === 'W' ? ACC : FG;
        x.fillText(ln.score || '—', cw / 2, y + 19);
        font(400, 9); x.fillStyle = DIM; x.fillText(ln.score ? ln.res === 'W' ? 'Won' : 'Lost' : 'Winner recorded', cw / 2, y + 33); x.textAlign = 'left';
        x.fillStyle = CELL; x.fillRect(pad, y + 42, W, 1); y += 44;
      }
      if (b.lines.length > SHARE_GAME_LIMIT[fmt]) { font(400, 11); x.fillStyle = DIM; x.fillText(`+${b.lines.length - SHARE_GAME_LIMIT[fmt]} more games`, pad, y + 12); y += 16; }

    }
  }
  // footer: ROTRA mark, tagline, small corner QR that opens the profile
  const fy = ch - pad;
  font(800, 13); try { x.letterSpacing = '1.3px'; } catch (e) { /* older browsers: no letter spacing */ }
  x.fillStyle = FG; x.fillText('ROTR', pad, fy - 16); const rw = x.measureText('ROTR').width; x.fillStyle = ACC; x.fillText('A', pad + rw, fy - 16);
  try { x.letterSpacing = '0px'; } catch (e) { /* ignore */ }
  font(400, 11); x.fillStyle = DIM; x.fillText('Run the game.', pad, fy - 2);
  let q = null;
  try { if (typeof qrcode === 'function') { q = qrcode(0, 'M'); q.addData(m.link); q.make(); } } catch (e) { q = null; }
  const qs = 64, qx = cw - pad - qs, qy = ch - pad - qs;
  rr(qx, qy, qs, qs, 8); x.fillStyle = '#fff'; x.fill();
  if (q) { const n = q.getModuleCount(), cell = qs / (n + 4); x.fillStyle = '#000'; for (let r = 0; r < n; r++) for (let cc = 0; cc < n; cc++) if (q.isDark(r, cc)) x.fillRect(qx + (cc + 2) * cell, qy + (r + 2) * cell, cell + 0.2, cell + 0.2); }
  x.restore();
  return c;
}

// ---------- Sheets ----------

// ---------- Actions ----------
function go(to, id) {
  if (S.screen === 'edit' && to !== 'edit' && editDirty()) { S.ui.pendingGo = { to, id }; S.ui.sheet = { type: 'discard' }; render(); return; }
  if (S.screen === 'edit') { S.ui.edit = null; S.ui.editErr = {}; S.ui.editFail = ''; }
  S.screen = to;
  if (id !== undefined) S.viewId = id;
  S.ui.sheet = null; S.ui.findErr = '';
  render();
  window.scrollTo(0, 0);
}
function signIn(uid) {
  S.me = uid;
  S.ui.login = { id: '', pass: '', show: false, err: '', pending: false, note: '' };
  const to = S.ui.after || { to: 'profile', id: uid };
  S.ui.after = null;
  go(to.to, to.id);
}
const digits = (v) => String(v).replace(/\D/g, '');
const normPhone = (v) => { const d = digits(v); if (/^09\d{9}$/.test(d)) return `63${d.slice(1)}`; if (/^639\d{9}$/.test(d)) return d; return null; };
const fmtPhone = (n) => `+63 ${n.slice(2, 5)} ${n.slice(5, 8)} ${n.slice(8)}`;
const validEmail = (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
function accountFor(email) {
  const v = email.trim().toLowerCase();
  return Object.values(S.accounts).find((a) => a.claimed && a.email && a.email.toLowerCase() === v);
}
function validatePersonal(d) {
  const e = {};
  if (!d.name.trim()) e.name = 'Enter your full name.';
  else if (d.name.trim().length > 60) e.name = 'Keep your name to 60 characters or fewer.';
  if (d.nick.trim().length > 24) e.nick = 'Keep your nickname to 24 characters or fewer.';
  const y = String(d.expY).trim(), m = String(d.expM).trim();
  if (y && (!/^\d+$/.test(y) || +y > 80)) e.expY = 'Enter whole years from 0 to 80.';
  if (m && (!/^\d+$/.test(m) || +m > 11)) e.expM = 'Enter months from 0 to 11.';
  if (d.sinceM && d.sinceY && (+d.sinceY * 12 + (+d.sinceM - 1)) > new Date().getFullYear() * 12 + new Date().getMonth()) e.since = "Playing since can't be in the future.";
  Object.entries(SOCIAL).forEach(([k, s]) => {
    const v = String(d[k] || '').trim();
    if (!v) return;
    let ok = false;
    try { const u = new URL(v); ok = /^https?:$/.test(u.protocol) && s.hosts.some((h) => u.hostname === h || u.hostname.endsWith(`.${h}`)); } catch (err) { ok = false; }
    if (!ok) e[k] = `Enter a full ${s.label} link, like ${s.eg}.`;
  });
  return e;
}
const applyPersonal = (a, d) => Object.assign(a, { name: d.name.trim(), nick: d.nick.trim(), style: d.style.trim(), expY: String(d.expY).trim(), expM: String(d.expM).trim(), sinceM: d.sinceM || '', sinceY: String(d.sinceY || '').trim(), social: { facebook: d.facebook.trim(), instagram: d.instagram.trim(), youtube: d.youtube.trim(), linkedin: d.linkedin.trim() } });

function copyText(text, el) {
  const fallback = () => {
    if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast('ID selected. Copy it from your device menu.');
  };
  try { navigator.clipboard.writeText(text).then(() => toast('Player ID copied'), fallback); } catch (e) { fallback(); }
}

// Phone input mask: once a field holds only phone characters it is grouped as 0917 555 0142 or +63 917 555 0142,
// keeping the caret after the same digit. Email text is left alone; deleting doesn't re-mask, so a space can be removed.
function maskPhoneInput(v) {
  if (!/^\s*\+?[\d\s()-]*$/.test(v) || !/\d/.test(v)) return v;
  const d = v.replace(/\D/g, '');
  if (/^\s*\+/.test(v) || d.startsWith('63')) { const x = d.slice(0, 12); return `+${[x.slice(0, 2), x.slice(2, 5), x.slice(5, 8), x.slice(8)].filter(Boolean).join(' ')}`; }
  const x = d.slice(0, 11);
  return [x.slice(0, 4), x.slice(4, 7), x.slice(7)].filter(Boolean).join(' ');
}
function applyPhoneMask(el, ev) {
  if ((ev.inputType || '').startsWith('delete')) return;
  const next = maskPhoneInput(el.value);
  if (next === el.value) return;
  const before = el.value.slice(0, el.selectionStart ?? el.value.length).replace(/\D/g, '').length;
  el.value = next;
  let pos = 0, seen = 0;
  while (pos < next.length && seen < before) { if (/\d/.test(next[pos])) seen += 1; pos += 1; }
  try { el.setSelectionRange(pos, pos); } catch (e) { /* not a text field */ }
}

  const el = ev.target;
  if ((el.id === 'req-to' || el.id === 'cl-phone') && el.type === 'tel') applyPhoneMask(el, ev);

    setPath(el.dataset.bind, el.value);

    if (el.dataset.live !== undefined) { S.shown = 25; S.ui.findErr = ''; render(); } else save();

    if (!Number.isFinite(n) || el.value === '') return;
    if (el.dataset.cfg === 'weight') S.config.weight = Math.max(0, Math.min(100, n));
    else S.config.threshold = Math.max(1, Math.min(40, n));
    render();
  }
});
