<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset your ROTRA password</title>
  </head>
  <body style="margin:0;padding:0;background:#06070a;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;color:#f0f0f2;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#06070a;padding:24px 12px;">
      <tr>
        <td align="center" valign="top">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" align="center" style="width:100%;max-width:560px;margin:0 auto;background:#17181f;border:1px solid #2a2a2e;border-radius:16px;overflow:hidden;">
            <tr>
              <td align="center" style="padding:28px 28px 10px 28px;text-align:center;">
                <h1 style="margin:0 0 8px 0;font-size:30px;line-height:1.2;letter-spacing:.12em;color:#f0f0f2;">
                  ROTR<span style="color:#12f58a;">A</span>
                </h1>
                <p style="margin:0;color:#b8b8c4;font-size:15px;line-height:1.6;">
                  Someone asked to reset the password for your ROTRA player profile.
                </p>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding:18px 28px 0 28px;text-align:center;">
                <!-- RedirectTo is https://player.rotra.club/reset-password (set by the Player app). -->
                <a
                  href="{{ .RedirectTo }}/{{ .TokenHash }}"
                  style="display:inline-block;background:#12f58a;color:#07110d;text-decoration:none;font-weight:700;font-size:15px;padding:12px 20px;border-radius:10px;"
                >
                  Choose a new password
                </a>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding:18px 28px 0 28px;text-align:center;">
                <p style="margin:0;color:#b8b8c4;font-size:14px;line-height:1.7;">
                  The link works once. If you didn't ask for this, ignore this email; your password stays the same.
                </p>
              </td>
            </tr>

            <tr>
              <td align="center" style="padding:26px 28px 28px 28px;text-align:center;">
                <div style="height:1px;background:#2a2a2e;margin-bottom:14px;"></div>
                <p style="margin:0;color:#4a4a55;font-size:11px;letter-spacing:.08em;text-transform:uppercase;">
                  ROTRA · Run the game
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
