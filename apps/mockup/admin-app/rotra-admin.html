<!doctype html>
<meta charset="utf-8">
<title>ROTRA Admin</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: internal workspace for the platform owner. A left rail with the five places Admin goes (clubs, players,
   requests, settings); lists are tables that turn into stacked rows on phones; details put the working column beside
   account facts on wide screens. Tokens and base components are copied from the Queue and Player prototypes
   (apps/client globals.css: dark default, light toggleable). */
:root {
  --bg: #0b0b0c; --surface: #1a1a1d; --elev: #2a2a2e; --overlay: #3a3a3f;
  --fg: #f0f0f2; --fg2: #9090a0; --fg3: #5a5a66;
  --accent: #00ff88; --accent-dim: #00cc6a; --accent-subtle: rgba(0, 255, 136, 0.13); --on-accent: #0b0b0c;
  --error: #ff4d4d; --error-subtle: rgba(255, 77, 77, 0.12); --warn: #ffb800; --warn-subtle: rgba(255, 184, 0, 0.12);
  --border: #2a2a2e; --border-strong: #404048; --scrim: rgba(0, 0, 0, 0.6);
  --font: "Satoshi", "Manrope", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  --r: 10px; --r-sm: 6px;
  --shadow: none; --knob: var(--fg); --field: var(--bg);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  /* Light: white cards on a soft off-white page, a deeper green that reads as text and carries white labels (AA). */
  --bg: #f4f5f2; --surface: #ffffff; --elev: #eef0ec; --overlay: #dfe3dc;
  --fg: #121513; --fg2: #535a54; --fg3: #7a817b;
  --accent: #0a7d44; --accent-dim: #086a39; --accent-subtle: rgba(10, 125, 68, 0.09); --on-accent: #ffffff;
  --error: #c62828; --error-subtle: rgba(198, 40, 40, 0.07); --warn: #a35600; --warn-subtle: rgba(217, 119, 6, 0.09);
  --border: #e2e5df; --border-strong: #cdd2c9; --scrim: rgba(18, 21, 19, 0.4);
  --shadow: 0 1px 2px rgba(18, 24, 20, 0.05), 0 2px 8px rgba(18, 24, 20, 0.04); --knob: #ffffff; --field: #ffffff;
  color-scheme: light;
} }
:root[data-theme="light"] {
  --bg: #f4f5f2; --surface: #ffffff; --elev: #eef0ec; --overlay: #dfe3dc;
  --fg: #121513; --fg2: #535a54; --fg3: #7a817b;
  --accent: #0a7d44; --accent-dim: #086a39; --accent-subtle: rgba(10, 125, 68, 0.09); --on-accent: #ffffff;
  --error: #c62828; --error-subtle: rgba(198, 40, 40, 0.07); --warn: #a35600; --warn-subtle: rgba(217, 119, 6, 0.09);
  --border: #e2e5df; --border-strong: #cdd2c9; --scrim: rgba(18, 21, 19, 0.4);
  --shadow: 0 1px 2px rgba(18, 24, 20, 0.05), 0 2px 8px rgba(18, 24, 20, 0.04); --knob: #ffffff; --field: #ffffff;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; letter-spacing: -0.3px; }
h1 { font-size: 26px; font-weight: 800; line-height: 1.2; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.mono { font-family: var(--mono); font-size: 0.92em; }
.muted { color: var(--fg2); }
.small { font-size: 13px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--fg2); }
.tnum { font-variant-numeric: tabular-nums; }
.wrapw { overflow-wrap: anywhere; }

/* Top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.top-in { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
button.brand { display: flex; align-items: baseline; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; font-weight: 800; letter-spacing: 1.5px; font-size: 17px; }
.brand b { color: var(--accent); }
.brand .sub { font-weight: 600; letter-spacing: 0; color: var(--fg2); font-size: 14px; }
.top .grow { flex: 1; }
.acct { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg2); min-width: 0; padding: 4px 10px; border: 1px solid var(--border); border-radius: 999px; }
.acct span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 30vw; }
@media (max-width: 560px) { .acct span { display: none; } .acct { padding: 6px; } }
.btn.burger { display: none; }
.band-off { background: var(--warn-subtle); border-bottom: 1px solid var(--warn); font-size: 13px; }
.band-off .in { display: flex; gap: 10px; align-items: flex-start; padding: 8px max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px)); }
.band-off svg { color: var(--warn); flex: none; margin-top: 2px; }
@keyframes pulse { 50% { opacity: .3; } }

/* Shell: rail + main column */
.shell { --rail: 236px; --topbar: 57px; display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); align-items: start; }
.shell-main { min-width: 0; }
.rail { position: sticky; top: calc(var(--topbar) + env(safe-area-inset-top, 0px)); height: calc(100dvh - var(--topbar) - env(safe-area-inset-top, 0px)); overflow-y: auto; display: flex; flex-direction: column; gap: 2px; padding: 12px 10px; border-right: 1px solid var(--border); background: var(--surface); }
.rail-label { font-size: 11px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; color: var(--fg3); padding: 14px 12px 4px; }
.rail-link { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 42px; padding: 9px 12px; border: 0; border-radius: var(--r-sm); background: none; color: var(--fg2); font-weight: 600; text-align: left; white-space: nowrap; cursor: pointer; }
.rail-link svg { flex: none; }
.rail-link:hover { background: var(--elev); color: var(--fg); }
.rail-link.on { background: var(--accent-subtle); color: var(--accent); }
.rail-link .count { margin-left: auto; font-size: 12px; color: var(--fg3); font-variant-numeric: tabular-nums; }
.rail-link .count.hot { color: var(--on-accent); background: var(--warn); border-radius: 999px; padding: 0 7px; font-weight: 700; }
.rail-end { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 2px; }
.rail-who { padding: 6px 12px 8px; font-size: 12px; color: var(--fg2); overflow-wrap: anywhere; }
.nav-scrim { display: none; }
@media (max-width: 900px) {
  .btn.burger { display: inline-flex; margin-left: -6px; }
  .shell { --rail: 0px; grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; z-index: 46; top: 0; bottom: 0; left: 0; width: min(280px, 84vw); height: auto; padding-top: calc(16px + env(safe-area-inset-top, 0px)); padding-left: max(10px, env(safe-area-inset-left, 0px)); transform: translateX(-102%); transition: transform .2s ease; box-shadow: 0 0 40px rgba(0, 0, 0, .25); }
  .nav-open .rail { transform: none; }
  .nav-open .nav-scrim { display: block; position: fixed; inset: 0; z-index: 45; background: var(--scrim); }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } }

.wrap { max-width: 1180px; margin: 0 auto; padding-block: 24px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; flex-direction: column; gap: 6px; }
.page-head p { max-width: 68ch; }
.back { align-self: flex-start; margin-left: -10px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--surface); cursor: pointer; font-weight: 600; text-align: center; }
.btn:hover:not(:disabled) { background: var(--elev); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent-dim); }
.btn.danger { border-color: var(--error); color: var(--error); background: transparent; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--elev); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn.xs { min-height: 32px; padding: 0 10px; font-size: 13px; border-radius: var(--r-sm); }
.icon-btn { min-width: 36px; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack.tight { gap: 6px; }
.link { background: none; border: 0; padding: 0; color: var(--fg); font-weight: 700; cursor: pointer; text-align: left; overflow-wrap: anywhere; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.link.acc { color: var(--accent); font-weight: 600; }

/* Surfaces */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; min-width: 0; box-shadow: var(--shadow); }
.card.warnc { border-color: color-mix(in srgb, var(--warn) 60%, transparent); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border-strong); color: var(--fg2); white-space: nowrap; }
.chip.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-subtle); }
.chip.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); background: var(--warn-subtle); }
.chip.bad { color: var(--error); border-color: color-mix(in srgb, var(--error) 45%, transparent); background: var(--error-subtle); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--elev); color: var(--fg2); flex: none; }
.avatar.lg { width: 56px; height: 56px; font-size: 18px; border-radius: 16px; background: var(--accent); color: var(--on-accent); font-weight: 800; }
.logo { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; font-size: 12px; letter-spacing: .5px; background: var(--elev); color: var(--fg); flex: none; border: 1px solid var(--border-strong); }
.logo.lg { width: 56px; height: 56px; font-size: 17px; border-radius: 14px; }
.logo.acc { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.who { display: flex; align-items: center; gap: 12px; min-width: 0; }
.who .main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--border-strong); background: var(--surface); font-size: 14px; }
.notice.warn { border-color: var(--warn); background: var(--warn-subtle); }
.notice.bad { border-color: var(--error); background: var(--error-subtle); }
.notice.ok { border-color: var(--accent); background: var(--accent-subtle); }
.notice svg { flex: none; margin-top: 2px; }
.notice > div { min-width: 0; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; font-size: 14px; margin: 0; }
.kv dt { color: var(--fg2); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 420px) { .kv { grid-template-columns: minmax(0, 1fr); gap: 0; } .kv dd { margin-bottom: 8px; } }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; align-items: start; }
.empty { padding: 28px 12px; text-align: center; color: var(--fg2); font-size: 14px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty b { color: var(--fg); font-size: 15px; }
.bul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.detail { display: grid; gap: 20px; grid-template-columns: minmax(0, 1fr); align-items: start; }
.detail > div { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
@media (min-width: 1040px) { .detail { grid-template-columns: minmax(0, 1fr) 340px; } }
.hero { display: flex; gap: 14px; align-items: center; min-width: 0; }
.hero .main { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.hero h1 { overflow-wrap: anywhere; }
.sec-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.sec-head > div { min-width: 0; display: flex; flex-direction: column; gap: 2px; }

/* Tables: rows become stacked label/value blocks on phones */
.tbl-wrap { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--fg2); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--border-strong); white-space: nowrap; }
.tbl td { padding: 11px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--elev); }
.tbl .n { text-align: right; }
.tbl .nw { white-space: nowrap; }
@media (max-width: 760px) {
  .tbl-wrap { margin: 0; padding: 0; overflow: visible; }
  .tbl.cards thead { display: none; }
  .tbl.cards, .tbl.cards tbody, .tbl.cards tr, .tbl.cards td { display: block; width: 100%; }
  .tbl.cards tr { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .tbl.cards tbody tr:last-child { border-bottom: 0; }
  .tbl.cards td { border: 0; padding: 3px 0; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: right; }
  .tbl.cards td::before { content: attr(data-label); color: var(--fg2); font-size: 13px; text-align: left; flex: none; }
  .tbl.cards td.lead { text-align: left; padding-bottom: 6px; }
  .tbl.cards td.lead::before { display: none; }
  .tbl.cards td:empty { display: none; }
  .tbl .n { text-align: right; }
}
.live { display: inline-flex; align-items: center; gap: 6px; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s infinite; flex: none; }
@media (prefers-reduced-motion: reduce) { .live i { animation: none; } }
.page-head > .row.between:has(.pl-add) { flex-wrap: nowrap; align-items: flex-start; gap: 12px; }
.pl-add { flex: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.sl-bars { display: flex; align-items: flex-end; gap: 8px; height: 84px; padding-top: 6px; }
.sl-bars span { flex: 1 1 0; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.sl-bars i { display: block; width: 100%; max-width: 44px; border-radius: 4px 4px 0 0; background: var(--accent); opacity: .85; }
.sl-bars em { font-size: 11px; font-style: normal; color: var(--fg2); }
.sl-tools { margin-bottom: 14px; }
.sl-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 12px; margin-bottom: 14px; }
.sl-kpi { color: var(--accent); gap: 8px; }
.sl-kpi .label { color: var(--fg2); }
.sl-val { font-size: 30px; font-weight: 800; line-height: 1.1; color: var(--fg); }
.sl-chart { display: block; width: 100%; height: 56px; color: var(--accent); }
.sl-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 12px; margin-bottom: 14px; }
.sl-row { padding: 8px 0; border-top: 1px solid var(--border); gap: 10px; align-items: baseline; }
.sl-row:first-child { border-top: 0; }
.qv { gap: 12px; }
.qv-hero { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: var(--r); background: var(--elev); }
.qv-hero.claimed { background: linear-gradient(135deg, var(--accent-subtle), transparent 70%), var(--elev); }
.qv-id { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.qv-id h2 { font-size: 18px; margin: 0; overflow-wrap: anywhere; }
.qv-invite { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 10px 12px; border: 1px dashed var(--border-strong); border-radius: var(--r); }
.qv-invite > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.qv-kv { margin: 0; }
.qv-kv dd { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.qv-soc a { text-decoration: none; }
.qv-sec { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border); }
.qv-sec h3 { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg2); margin: 0; }
.pl-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 104px), 1fr)); gap: 10px; margin-bottom: 14px; }
.pl-card { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px 14px; text-align: left; color: var(--fg); font: inherit; cursor: pointer; }
.pl-card span { font-size: 12px; color: var(--fg2); }
.pl-card b { font-size: 26px; line-height: 1.1; }
.pl-card.pl-account b { color: var(--accent); }
.pl-card:hover { border-color: var(--border-strong); background: var(--elev); }
.pl-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pl-strip { display: flex; flex-wrap: wrap; gap: 14px 28px; padding: 14px 16px; margin-bottom: 14px; }
.pl-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pl-cells { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.pl-cell { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; border: 0; background: none; color: var(--fg); font: inherit; padding: 4px 0; cursor: pointer; text-align: left; }
.pl-cell span { font-size: 12px; color: var(--fg2); }
.pl-cell b { font-size: 22px; line-height: 1.1; }
.pl-cell:hover b { color: var(--accent); }
.pl-tools { margin-bottom: 10px; }
.pl-adv { margin-bottom: 10px; gap: 14px; }
.pl-fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; }
.pl-dup { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--r); cursor: pointer; }
.pl-switch { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 46px; height: 28px; border-radius: 999px; background: var(--overlay); cursor: pointer; margin: 0; transition: background .15s; }
.pl-switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--fg); transition: transform .15s; }
.pl-switch:checked { background: var(--accent); }
.pl-switch:checked::after { transform: translateX(18px); background: var(--on-accent, #000); }
.pl-switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pl-adv-foot { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.pl-bulk { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 12px; font-size: 13px; }
.pl-all { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.player-row { cursor: pointer; }
.player-row:hover { border-color: var(--border-strong); background: var(--elev); }
.player-row { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 4px 12px; padding: 12px 14px; }
.player-row .main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.player-row .main p { margin: 0; overflow-wrap: anywhere; }
.player-row .main .row { gap: 6px; flex-wrap: wrap; }
.player-row .link { text-align: left; font-weight: 700; }
.player-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 148px), 1fr)) !important; gap: 10px !important; }
.player-grid .player-row { grid-template-columns: auto 1fr auto; grid-template-areas: "sel . menu" "av av av" "main main main"; row-gap: 6px; padding: 8px 10px 14px; align-items: center; justify-items: center; text-align: center; }
.player-grid .player-row > .player-selection { grid-area: sel; justify-self: start; }
.player-grid .player-row > .avatar { grid-area: av; width: 56px; height: 56px; font-size: 18px; }
.player-grid .player-row > .main { grid-area: main; align-items: center; width: 100%; }
.player-grid .player-row > .main .row { justify-content: center; }
.player-grid .player-row > .main .link { text-align: center; }
.player-grid .player-row > .main .mono { font-size: 11px; }

// ---------- License and retention ----------
function access(c) {
  const t = todayYmd(), T = c.terms;
  if (!T.length) return { state: 'none' };
  const cur = T.find((x) => x.from <= t && t <= x.to);
  if (cur) {
    // Follow back-to-back terms so a renewal that starts the day after shows as one continuous period.
    let until = cur.to, moved = true;
    while (moved) { moved = false; T.forEach((x) => { if (x.from <= addDays(until, 1) && x.to > until) { until = x.to; moved = true; } }); }
    return { state: 'active', until, days: diffDays(t, until), plan: cur.plan };
  }
  const past = T.filter((x) => x.to < t);
  const next = T.filter((x) => x.from > t).sort((a, b) => (a.from < b.from ? -1 : 1))[0];
  if (!past.length) return { state: 'scheduled', starts: next.from, plan: next.plan };
  const last = past.reduce((m, x) => (x.to > m.to ? x : m));
  return { state: 'expired', since: addDays(last.to, 1), ended: last.to, next: next ? next.from : null, plan: last.plan };
}
const filterKey = (a) => (a.state === 'scheduled' ? 'none' : a.state);
function accessChip(a) {
  if (a.state === 'active') return a.days <= 7 ? chip(a.days === 0 ? 'Ends today' : `Ends in ${a.days} day${a.days === 1 ? '' : 's'}`, 'warn') : chip('Active', 'ok');
  if (a.state === 'expired') return chip('Expired', 'bad');
  if (a.state === 'scheduled') return chip(`Starts ${fmtYmd(a.starts)}`, 'warn');
  return chip('No license yet');
}
function retention(c) {
  const a = access(c), t = todayYmd(), r = c.ret;
  if (r.deletedOn) return { k: 'deleted', on: r.deletedOn };
  if (a.state !== 'expired') {
    const last = r.cycles.filter((x) => x.cancelled).slice(-1)[0];
    return last ? { k: 'restored', cycle: last } : { k: 'none' };
  }
  const deleteOn = addMonths(a.since, RETENTION_MONTHS);
  const total = diffDays(a.since, deleteOn), elapsed = Math.min(total, Math.max(0, diffDays(a.since, t)));
  if (r.failedOn) return { k: 'failed', deleteOn, failedOn: r.failedOn, since: a.since };
  if (t >= deleteOn) return { k: 'due', deleteOn, since: a.since };
  return { k: 'stale', deleteOn, since: a.since, left: diffDays(t, deleteOn), elapsed, total };
}

// ---------- Ranks (read-only context; uses the configuration in effect, never a draft) ----------
function rankOf(p) {
  if (p.level == null) return { k: 'none', text: 'No rank yet', chip: chip('No rank yet') };
  const T = eff().threshold;
  if (p.recent < T) return { k: 'below', text: `${LEVELS[p.level]} · ${p.recent} of ${T} recent matches`, chip: chip('Below requirement') };
  return { k: 'board', text: `${LEVELS[p.level]} · on the overall leaderboard`, chip: chip('On leaderboard', 'ok') };
}

// ---------- Contact requests ----------
const REQ = {
  submitted: { chip: 'Waiting for review', k: 'warn' },
  applying: { chip: 'Approved · applying', k: 'warn' },
  applied: { chip: 'Applied', k: 'ok' },
  failed: { chip: 'Needs attention', k: 'bad' },
  rejected: { chip: 'Not approved', k: '' },
};
const reqChip = (r) => chip(REQ[r.status].chip, REQ[r.status].k);
function checks(r) {
  const p = playerOf(r.pid), f = FIELD[r.field];
  const other = S.players.find((x) => x.id !== p.id && norm(x[r.field]) === norm(r.to));
  const newer = S.requests.find((x) => x.id !== r.id && x.pid === r.pid && x.field === r.field && x.at > r.at && ['submitted', 'applying'].includes(x.status));
  const busy = S.requests.find((x) => x.id !== r.id && x.pid === r.pid && x.status === 'applying');
  const cur = p[r.field] || '';
  return [
    other ? { ok: false, html: `This ${f} is already linked to <button class="link acc" data-act="openPlayer" data-id="${other.id}">${esc(other.name)}</button> (<span class="mono">${esc(other.rtr)}</span>). Approving would put two players on one ${f}, and Admin never merges players.` } : { ok: true, html: `Not linked to any other player` },
    newer ? { ok: false, html: `A newer request for this ${f} was sent ${ago(newer.at)}. <button class="link acc" data-act="openReview" data-id="${newer.id}">Review that one instead</button>.` } : { ok: true, html: `No newer request for this ${f}` },
    norm(cur) === norm(r.from) ? { ok: true, html: `Their current ${f} still matches the request` } : { ok: false, html: `Their ${f} has changed since this was sent. It's now <span class="mono">${esc(cur || 'not set')}</span>.` },
    busy ? { ok: false, html: 'Another contact change for this player is still being applied.' } : { ok: true, html: 'No other change is being applied for this player' },
  ];
}
const blocked = (r) => r.status === 'submitted' && checks(r).some((c) => !c.ok);
function nextAction(r) {
  if (r.status === 'submitted') return blocked(r) ? 'Review · blocked' : 'Review';
  if (r.status === 'applying') return 'Check status';
  if (r.status === 'failed') return 'Retry application';
  return 'View';
}

    const a = access(c);
    const until = a.state === 'active' ? fmtYmd(a.until) : a.state === 'expired' ? `Ended ${fmtYmd(a.ended)}` : a.state === 'scheduled' ? `From ${fmtYmd(a.starts)}` : '—';

function retentionCard(c) {
  const r = retention(c);
  const head = {
    none: chip('Pages live', 'ok'), restored: chip('Pages live', 'ok'), stale: chip('Pages stale', 'warn'), due: chip('Deletion due', 'warn'), failed: chip('Deletion failed', 'bad'), deleted: chip('Pages deleted'),
  }[r.k];
  let body = '';
  if (r.k === 'none') body = `<p>No deletion countdown. If the license ends, the club's public session pages go stale and are deleted after six months of continuous expiry.</p>`;
  if (r.k === 'restored') body = `<p>No deletion countdown. The license ended on ${fmtYmd(addDays(r.cycle.expired, -1))}; the renewal on ${fmtYmd(r.cycle.cancelled)} restored the public pages and cancelled that countdown. If the license ends again, a new six-month countdown starts.</p>`;
  if (r.k === 'stale') body = `<div class="stack tight"><div class="prog" role="img" aria-label="${r.elapsed} of ${r.total} days of the countdown have passed"><i style="width:${Math.round((r.elapsed / r.total) * 100)}%"></i></div>
      <div class="timeline"><span>Expired ${fmtYmd(r.since)}</span><span>Deleted ${fmtYmd(r.deleteOn)}</span></div></div>
    <dl class="kv"><dt>Expired for</dt><dd>${plural(r.elapsed, 'day')}</dd><dt>Pages deleted on</dt><dd>${fmtYmd(r.deleteOn)} · in ${plural(r.left, 'day')}</dd></dl>
    <p>The public session pages are stale. Renewing before ${fmtYmd(r.deleteOn)} restores them and cancels the deletion.</p>`;
  if (r.k === 'due') body = `<p>Six months of continuous expiry ended on ${fmtYmd(r.deleteOn)}. Deleting the public pages is in progress; this changes to Pages deleted once it has actually finished.</p>`;
  if (r.k === 'failed') body = `<dl class="kv"><dt>Expired since</dt><dd>${fmtYmd(r.since)}</dd><dt>Deletion was due</dt><dd>${fmtYmd(r.deleteOn)}</dd><dt>Last attempt</dt><dd>Failed on ${fmtYmd(r.failedOn)} · will be retried</dd></dl>
    <p>The pages are still online as stale pages; they haven't been deleted. Renewing now restores them and cancels the retry.</p>`;

// What one club pays ROTRA against how much it uses ROTRA, month by month. Payments are the recorded license payments; sessions and matches are
// sample figures drawn from the day and the club (the same ones the Sales page uses); the cost per session is a sample estimate until you set it.
const COST_PER_SESSION = 15;
function clubSales(c, months = 6) {
  const today = todayYmd(), [ty, tm] = ymdParts(today), rows = [];
  for (let i = months - 1; i >= 0; i--) {
    const first = new Date(ty, tm - 1 - i, 1), y = first.getFullYear(), m = first.getMonth() + 1, label = first.toLocaleDateString([], { month: 'short', year: 'numeric' });
    const dim = new Date(y, m, 0).getDate(), last = i === 0 ? ymdParts(today)[2] : dim;
    let sessions = 0, matches = 0;
    for (let d = 1; d <= last; d++) {
      const ymd = `${y}-${pad(m)}-${pad(d)}`, h = hashStr(`${c.id}-${ymd}`);
      if (!c.terms.some((x) => x.from <= ymd && ymd <= x.to) || h % 7 > 1) continue;
      sessions += 1; matches += 8 + ((h >>> 5) % 14);
    }
    const paid = c.terms.filter((x) => { const [py, pm] = ymdParts(x.paid); return py === y && pm === m; }).reduce((t, x) => t + (x.amount || 0), 0);
    rows.push({ label, paid, sessions, matches, cost: sessions * COST_PER_SESSION });
  }
  return rows;
}

// ---------- A-SALES ----------
// Platform totals for the owner: license revenue (from the payments recorded per club), sessions started and matches played.
// Revenue is real in this prototype (the sample payments in each club's history); sessions and matches are drawn from the date and the club,
// so the same period always shows the same figures.
const SALES_PERIODS = [['7', 'Last 7 days'], ['30', 'Last 30 days'], ['365', 'Last 12 months']];
function salesData(period) {
  const today = todayYmd(), monthly = period === '365';
  const buckets = monthly ? 12 : +period;
  const bucketOf = (ymd, offset = 0) => {
    // Bucket 0 is the oldest of the shown period; offset 1 maps the period before it onto the same buckets for the comparison.
    const [y, m] = ymdParts(ymd), [ty, tm] = ymdParts(today);
    const ago = monthly ? (ty * 12 + tm) - (y * 12 + m) : diffDays(ymd, today);
    return buckets - 1 - (ago - offset * buckets);
  };
  const series = () => ({ cur: Array(buckets).fill(0), prev: Array(buckets).fill(0) });
  const rev = series(), ses = series(), mat = series();
  const per = {}; // club id -> { sessions, matches, revenue } in the shown period
  const add = (ser, ymd, v) => { for (const [k, off] of [['cur', 0], ['prev', 1]]) { const b = bucketOf(ymd, off); if (b >= 0 && b < buckets) ser[k][b] += v; } };
  const inPeriod = (ymd) => { const b = bucketOf(ymd, 0); return b >= 0 && b < buckets; };
  const pays = [];
  S.clubs.forEach((c) => {
    c.terms.forEach((x) => { add(rev, x.paid, x.amount || 0); if (inPeriod(x.paid)) { pays.push({ club: c, ...x }); (per[c.id] ||= { c, sessions: 0, matches: 0, revenue: 0 }).revenue += x.amount || 0; } });
    // Every club with a license term running on a day starts a session on some days; the count is drawn from the day and the club.
    const days = monthly ? 365 * 2 : +period * 2;
    for (let i = 0; i < days; i++) {
      const ymd = addDays(today, -i), h = hashStr(`${c.id}-${ymd}`);
      if (!c.terms.some((x) => x.from <= ymd && ymd <= x.to)) continue;
      if (h % 7 > 1) continue; // about two days in seven
      const n = 1, mt = 8 + ((h >>> 5) % 14);
      add(ses, ymd, n); add(mat, ymd, mt);
      if (inPeriod(ymd)) { const row = (per[c.id] ||= { c, sessions: 0, matches: 0, revenue: 0 }); row.sessions += n; row.matches += mt; }
    }
  });
  const sum = (a) => a.reduce((t, v) => t + v, 0);
  // The comparison only makes sense when the period before it is fully inside the history we have.
  const first = S.clubs.flatMap((c) => c.terms.map((x) => x.from)).sort()[0] || today;
  const [ty, tm] = ymdParts(today);
  const prevStart = monthly ? toYmd(new Date(ty, tm - 1 - (2 * buckets - 1), 1)) : addDays(today, -(2 * buckets - 1));
  return { buckets, monthly, histOk: prevStart >= first, rev, ses, mat, per: Object.values(per), pays: pays.sort((a, b) => (a.paid < b.paid ? 1 : -1)), sum };

function viewReview() {
  const r = reqOf(S.viewId);
  if (!r) return shell(`${backBtn('contacts', 'Contact changes')}<div class="card empty"><b>Request not found.</b></div>`);
  const p = playerOf(r.pid), f = FIELD[r.field], F = f[0].toUpperCase() + f.slice(1);
  const ch = r.status === 'submitted' ? checks(r) : null, isBlocked = ch && ch.some((c) => !c.ok);
  const status = {
    submitted: '',
    applying: notice('warn', `<div class="row"><span class="spin" aria-hidden="true"></span><b>Approved${r.approvedAt ? ` ${ago(r.approvedAt)}` : ''}. Applying the change.</b></div><p>${esc(firstName(p))} keeps signing in with <span class="mono">${esc(r.from)}</span> until this finishes.</p>`),
    applied: notice('ok', `<b>Applied${r.appliedAt ? ` ${ago(r.appliedAt)}` : ''}.</b> ${esc(firstName(p))} now signs in with <span class="mono">${esc(r.to)}</span>. RTR ID and match history are unchanged.`),

    rejected: notice('', `<b>Not approved${r.decidedAt ? ` · ${ago(r.decidedAt)}` : ''}.</b> ${esc(firstName(p))} keeps <span class="mono">${esc(r.from)}</span>. They can send a new request.`),
  }[r.status];
  const actions = {
    submitted: `<button class="btn" data-act="go" data-to="contacts">Back without deciding</button><button class="btn danger" data-act="openDecline" data-id="${r.id}">Decline</button><button class="btn primary" data-act="openApprove" data-id="${r.id}" ${isBlocked ? 'disabled' : ''}>Approve</button>`,
    applying: `<button class="btn" data-act="checkApply" data-id="${r.id}" ${S.ui.checking === r.id ? 'disabled' : ''}>${S.ui.checking === r.id ? 'Checking…' : 'Check status'}</button>`,
    failed: `<button class="btn primary" data-act="retryApply" data-id="${r.id}">Retry application</button>`,

    <div class="page-head"><div class="row">${reqChip(r)}${isBlocked ? chip('Conflict', 'bad') : ''}</div><h1>${F} change for ${esc(p.name)}</h1></div>
    ${status}
    <div class="detail"><div>
      <section class="card stack"><h2>Requested change</h2>
        <div class="change"><div><span class="label">Current</span><span class="mono">${esc(r.from || 'Not set')}</span></div>${I.arrow}<div class="to"><span class="label">Requested</span><span class="mono">${esc(r.to)}</span></div></div>
        <dl class="kv"><dt>Sent</dt><dd>${fmtAt(r.at)} · ${ago(r.at)}</dd><dt>Came from</dt><dd>${r.source === 'app' ? `${esc(firstName(p))}'s signed-in Player Information account` : `${esc(firstName(p))} contacted you; you entered it`}</dd></dl></section>
      ${ch ? `<section class="card stack"><h2>Checks before approving</h2><ul class="checks">${ch.map((c) => `<li class="${c.ok ? 'ok' : 'bad'}">${c.ok ? I.check : I.xs}<span>${c.html}</span></li>`).join('')}</ul>
        ${isBlocked ? `<p class="small muted">Approve stays off until every check passes. You can still decline.</p>` : ''}</section>
      <section class="card stack"><h2>Verification</h2><p class="small">What proof approval needs hasn't been decided, so this prototype doesn't ask for ID documents. The request itself is the only evidence shown.</p></section>` : ''}
      ${actions ? `<div class="row end">${actions}</div>` : ''}
    </div><div>
      <section class="card stack"><div class="who">${avatar(p, '', true)}<div class="main"><button class="link" data-act="openPlayer" data-id="${p.id}">${esc(p.name)}</button><span class="mono small muted">${esc(p.rtr)}</span></div></div>
        <dl class="kv"><dt>Account</dt><dd>${p.claimed ? 'Registered' : 'Unclaimed'}</dd><dt>Phone</dt><dd class="mono">${esc(p.phone || 'Not given')}</dd><dt>Email</dt><dd class="mono">${esc(p.email || 'Not given')}</dd></dl>
        <p class="small muted">These are the contacts in use right now. An approved change shows here only once it's applied.</p></section>
      <section class="card stack"><h2>What approval changes</h2><ul class="bul"><li>Only the ${f} ${esc(firstName(p))} signs in with.</li><li>Not the RTR ID, match history, results or rank.</li><li>Never another player's profile.</li></ul></section>
    </div></div>`);
}

// ---------- A-RANK-CONFIG ----------
const cfgDraft = () => { if (!S.ui.cfg) { const e = eff(); S.ui.cfg = { assess: String(e.assess), perf: String(e.perf), threshold: String(e.threshold), base: e.v }; } return S.ui.cfg; };
function cfgCheck(d) {
  const e = {};
  const int = (v) => /^\d+$/.test(String(v).trim());
  if (!int(d.assess) || +d.assess > 100) e.assess = 'Use a whole number from 0 to 100.';
  if (!int(d.perf) || +d.perf > 100) e.perf = 'Use a whole number from 0 to 100.';
  if (!e.assess && !e.perf && +d.assess + +d.perf !== 100) e.total = `The two weights add up to ${+d.assess + +d.perf}%. They must total exactly 100%.`;
  if (!int(d.threshold) || +d.threshold < 1 || +d.threshold > 100) e.threshold = 'Use a whole number of at least 1.';
  return e;
}
const cfgDirty = () => { if (!S.ui.cfg) return false; const d = S.ui.cfg, b = S.config.find((x) => x.v === d.base) || eff(); return +d.assess !== b.assess || +d.perf !== b.perf || +d.threshold !== b.threshold || String(d.assess).trim() === '' || String(d.perf).trim() === '' || String(d.threshold).trim() === ''; };
function viewConfig() {
  const e = eff(), d = cfgDraft(), err = cfgCheck(d), dirty = cfgDirty();
  const tot = (+d.assess || 0) + (+d.perf || 0);
  return shell(`<div class="page-head"><h1>Ranking settings</h1><p class="muted">The agreed adjustable settings behind every player's shared rank. Changing them changes the algorithm's settings, never individual match results.</p></div>
    ${S.ui.cfgConflict ? notice('bad', `<b>Version ${e.v} was saved by someone else while you were editing.</b> Your draft is kept, but it was based on version ${d.base}. Compare it with the values now in effect, then review again. <div style="margin-top:8px"><button class="btn xs" data-act="cfgRebase">Use my draft on version ${e.v}</button> <button class="btn xs ghost" data-act="cfgDiscard">Start over from version ${e.v}</button></div>`) : ''}
    ${S.ui.cfgErr ? notice('bad', S.ui.cfgErr) : ''}
    <div class="detail"><div>
      <form class="card stack" data-form="config" novalidate><div class="sec-head"><div><h2>Edit</h2><p class="small muted">Whole percentages only, so the saved total is exactly 100%.</p></div>${dirty ? chip('Unsaved draft', 'warn') : ''}</div>
        <div class="fgrid">
          <label class="field" for="cfg-assess"><span>Club assessment weight</span><div class="affix"><input class="input suf ${err.assess || err.total ? 'bad' : ''}" id="cfg-assess" inputmode="numeric" data-bind="ui.cfg.assess" data-live value="${esc(d.assess)}"><b>%</b></div>${errLine(err.assess)}</label>
          <label class="field" for="cfg-perf"><span>Match performance weight</span><div class="affix"><input class="input suf ${err.perf || err.total ? 'bad' : ''}" id="cfg-perf" inputmode="numeric" data-bind="ui.cfg.perf" data-live value="${esc(d.perf)}"><b>%</b></div>${errLine(err.perf)}</label>
        </div>
        <div class="stack tight"><div class="split" role="img" aria-label="Assessment ${+d.assess || 0} percent, performance ${+d.perf || 0} percent">${tot === 100 ? `<span class="a" style="width:${+d.assess}%"></span><span class="b" style="width:${+d.perf}%"></span>` : ''}</div>
          <div class="between small"><span>Total <span class="total ${err.total ? 'bad' : ''}">${tot}%</span></span><button type="button" class="btn xs ghost" data-act="cfgBalance" ${err.assess ? 'disabled' : ''}>Set performance to ${err.assess ? '—' : `${100 - +d.assess}%`}</button></div>
          ${errLine(err.total)}</div>
        <label class="field" for="cfg-thr" style="max-width:320px"><span>Recent complete standard matches for the overall leaderboard</span><input class="input ${err.threshold ? 'bad' : ''}" id="cfg-thr" inputmode="numeric" data-bind="ui.cfg.threshold" data-live value="${esc(d.threshold)}"><span class="hint">Counted over the last three months. Not the same as the five sessions needed for Most Improved or Off Day.</span>${errLine(err.threshold)}</label>
        <div class="row end"><button type="button" class="btn" data-act="cfgDiscard" ${dirty ? '' : 'disabled'}>Discard draft</button><button class="btn primary" type="submit" ${dirty && !Object.keys(err).length && !S.ui.cfgConflict ? '' : 'disabled'}>Review changes</button></div>
      </form>
      <section class="card stack"><h2>Fixed rules</h2><p class="small muted">Shown for context. These aren't adjustable in Admin.</p><ul class="bul">
        <li>Each club's latest assessment of a player counts equally.</li>
        <li>The rank looks back over three months.</li>
        <li>Most Improved and Off Day need five earlier sessions at the same club within those three months.</li>
        <li>Fun games, partial games and invalid matches don't count toward the leaderboard requirement.</li></ul></section>
    </div><div>
      <section class="card stack"><div class="sec-head"><div><h2>In effect</h2><p class="small muted">Version ${e.v} · since ${fmtAt(e.at)}</p></div>${chip('Live', 'ok')}</div>
        <div class="tiles"><div class="tile"><span class="label">Assessment</span><span class="mono">${e.assess}%</span></div><div class="tile"><span class="label">Performance</span><span class="mono">${e.perf}%</span></div><div class="tile"><span class="label">Leaderboard</span><span class="mono">${e.threshold}</span><span class="small muted">recent matches</span></div></div>
        <p class="small muted">Set by ${esc(e.by)}. Player pages describe these values, not your draft.</p></section>
      <section class="card stack"><h2>Versions</h2><ul class="log">${[...S.config].reverse().map((x) => `<li><b>Version ${x.v}</b> ${x.assess}% / ${x.perf}% · ${x.threshold} matches<span>${fmtAt(x.at)} · ${esc(x.by)}</span></li>`).join('')}</ul></section>
    </div></div>`);
}

  out.push('Adds a payment record the club sees in Club settings.');

}

// ---------- Actions ----------
function go(to, id, anchor) {
  if (S.screen === 'config' && to !== 'config' && cfgDirty()) { S.ui.pendingGo = { to, id }; S.ui.sheet = { type: 'discard' }; S.ui.nav = false; render(); return; }
  if (S.screen === 'config' && to !== 'config') { S.ui.cfg = null; S.ui.cfgErr = ''; S.ui.cfgConflict = false; }
  S.screen = to;
  if (id !== undefined) S.viewId = id;
  // The quick view side panel is added straight to the page, so opening a page has to close it.
  document.querySelectorAll('body > .scrim, body > .sheet').forEach((x) => x.remove());
  S.ui.sheet = null; S.ui.nav = false; S.ui.checking = null;
  render();
  const el = anchor && document.getElementById(anchor);
  if (el) el.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
}
function signOutAll(ended = false) {
  S.me = null; S.denied = null; S.ended = ended; S.screen = 'clubs'; S.viewId = null;
  S.ui = { ...freshUi(), login: { email: '', pass: '', show: false, err: '', pending: false } };
  render(); window.scrollTo(0, 0);
}
function offlineBlock(target) { if (S.online) return false; target.err = OFFLINE_ERR; target.pending = false; render(); return true; }
function runApply(id, ms = 1800) {
  later(ms, () => {
    const r = reqOf(id);
    if (!r || r.status !== 'applying') return;

// Character uploads: images only, up to 1 MB each, cropped to a centred square and kept as a data URL (prototype only; nothing leaves the browser).
function cropToSquare(f) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(f), img = new Image();
    img.onload = () => {
      const side = Math.min(img.naturalWidth, img.naturalHeight), out = 192, cv = document.createElement('canvas');
      cv.width = out; cv.height = out;
      cv.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, out, out);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL(f.type === 'image/png' ? 'image/png' : 'image/jpeg', 0.86));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('unreadable')); };
    img.src = url;
  });
}
async function addCharFiles(list) {
  const files = [...(list || [])];
  if (!files.length) return;
  if (!S.online) { toast(OFFLINE_ERR); return; }
  let added = 0;
  const skipped = [];
  for (const f of files) {
    if (!/^image\/(png|jpeg|webp)$/.test(f.type)) { skipped.push(`${f.name} isn't a PNG, JPG or WebP image`); continue; }
    if (f.size > CHAR_MAX_BYTES) { skipped.push(`${f.name} is over 1 MB`); continue; }
    try {

  }
  render();
  if (added) toast(`${plural(added, 'image')} added and shown to players.`);
  if (skipped.length) toast(`Not added: ${skipped.join('; ')}.`);
}
// Banners are cropped to 3:1 (600 x 200 in the prototype), centred.
function cropToWide(f) {
